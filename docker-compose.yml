# Tomodachi POS - Community Edition
# Levantar: docker compose up -d
# Acceder: http://localhost:8080
# Credenciales iniciales: admin / admin123 (el sistema pedirá cambiarla en el primer acceso)
services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-tomodachi_root_secret}
      MARIADB_DATABASE: ${DB_NAME:-tomodachi_pos}
      MARIADB_USER: ${DB_USER:-tomodachi}
      MARIADB_PASSWORD: ${DB_PASS:-tomodachi_secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ghcr.io/angeldal/tomodachi:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-tomodachi_pos}
      DB_USER: ${DB_USER:-tomodachi}
      DB_PASS: ${DB_PASS:-tomodachi_secret}
      APP_MODE: ${APP_MODE:-OPEN_SOURCE}
      SEED_DEMO: ${SEED_DEMO:-false}
      TZ: ${TZ:-America/Mexico_City}
      # Proxy confiable (p. ej. Cloudflare Tunnel → CF-Connecting-IP): usa la
      # IP real del cliente en el rate limiting. Vacío = usar REMOTE_ADDR.
      TRUSTED_PROXY_HEADER: ${TRUSTED_PROXY_HEADER:-}
      # Orígenes CORS adicionales permitidos, separados por coma. El mismo
      # host de la petición siempre está permitido.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      # URL pública de la app (enlaces de correo). Ej: https://pos.midominio.com
      APP_URL: ${APP_URL:-}
    ports:
      - "127.0.0.1:${PORT:-8091}:80"
    volumes:
      # Persistir imágenes subidas (logos, productos, fondos)
      - app_uploads:/var/www/html/public/assets/images
      # Persistir recursos de Pantallas Digitales fuera de la imagen
      - signage_uploads:/var/www/html/uploads
      # Persistir sesiones PHP (sobreviven a rebuilds del contenedor)
      - app_sessions:/var/lib/php/sessions

  ws:
    image: ghcr.io/angeldal/tomodachi-ws:latest
    build:
      context: ./docker
      dockerfile: Dockerfile.customer-display-ws
    restart: unless-stopped
    environment:
      WS_HOST: 0.0.0.0
      WS_PORT: 8765

volumes:
  db_data:
  app_uploads:
  signage_uploads:
  app_sessions:
