<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Directorios de archivos subidos por usuarios: solo contenido estático.
    # Defensa en profundidad: aunque un archivo malicioso llegara al disco,
    # Apache no lo ejecuta ni lo entrega como script.
    <Directory /var/www/html/public/assets/images>
        Options -Indexes -ExecCGI
        <IfModule mod_php.c>
            php_flag engine off
        </IfModule>
        <FilesMatch "\.(php|phtml|php[0-9]|phar|cgi|pl|py|sh|shtml)$">
            Require all denied
        </FilesMatch>
        <IfModule mod_mime.c>
            RemoveHandler .php .phtml .phar
            RemoveType .php .phtml .phar
        </IfModule>
    </Directory>

    <Directory /var/www/html/uploads>
        Options -Indexes -ExecCGI
        <IfModule mod_php.c>
            php_flag engine off
        </IfModule>
        <FilesMatch "\.(php|phtml|php[0-9]|phar|cgi|pl|py|sh|shtml)$">
            Require all denied
        </FilesMatch>
        <IfModule mod_mime.c>
            RemoveHandler .php .phtml .phar
            RemoveType .php .phtml .phar
        </IfModule>
    </Directory>

    # Cabeceras de seguridad
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "geolocation=(), camera=(self), microphone=(self)"
        Header always set Strict-Transport-Security "max-age=31536000"
    </IfModule>

    ProxyPass "/ws/" "ws://ws:8765/" connectiontimeout=5 timeout=600
    ProxyPassReverse "/ws/" "ws://ws:8765/"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
