<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Directorios de archivos subidos por usuarios: solo contenido estático.
    # Defensa en profundidad: aunque un archivo malicioso llegara al disco,
    # Apache no lo ejecuta ni lo entrega como script.
    <Directory /var/www/html/public/assets/images>
        Options -Indexes -ExecCGI
        <IfModule mod_php.c>
            php_flag engine off
        </IfModule>
        <FilesMatch "\.(php|phtml|php[0-9]|phar|cgi|pl|py|sh|shtml)$">
            Require all denied
        </FilesMatch>
        <IfModule mod_mime.c>
            RemoveHandler .php .phtml .phar
            RemoveType .php .phtml .phar
        </IfModule>
    </Directory>

    <Directory /var/www/html/uploads>
        Options -Indexes -ExecCGI
        <IfModule mod_php.c>
            php_flag engine off
        </IfModule>
        <FilesMatch "\.(php|phtml|php[0-9]|phar|cgi|pl|py|sh|shtml)$">
            Require all denied
        </FilesMatch>
        <IfModule mod_mime.c>
            RemoveHandler .php .phtml .phar
            RemoveType .php .phtml .phar
        </IfModule>
    </Directory>

    # Cabeceras de seguridad
    <IfModule mod_headers.c>
        Header always set X-Content-Type-Options "nosniff"
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Permissions-Policy "geolocation=(), camera=(self), microphone=(self)"
        Header always set Strict-Transport-Security "max-age=31536000"
    </IfModule>

    # ------------------------------------------------------------
    # Compresión gzip (mod_deflate): reduce el tamaño de las respuestas
    # JSON, HTML, CSS, JS y SVG ~70-85%. El cliente descomprime de forma
    # transparente; no afecta caché ni sesiones. Requiere `a2enmod deflate`
    # (activado en el Dockerfile).
    # ------------------------------------------------------------
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/plain text/xml
        AddOutputFilterByType DEFLATE text/css
        AddOutputFilterByType DEFLATE application/javascript application/x-javascript
        AddOutputFilterByType DEFLATE application/json application/xml
        AddOutputFilterByType DEFLATE image/svg+xml
        AddOutputFilterByType DEFLATE application/vnd.ms-fontobject application/x-font-ttf
        AddOutputFilterByType DEFLATE font/opentype font/woff font/woff2

        # No comprimir contenido ya comprimido
        SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|ico|webp|mp3|mp4|zip|gz|woff2)$ no-gzip dont-vary
        BrowserMatch ^Mozilla/4 gzip-only-text/html
        BrowserMatch ^Mozilla/4\.0[678] no-gzip
        BrowserMatch \bMSIE !no-gzip !gzip-only-text/html
        Header append Vary User-Agent env=!dont-vary
    </IfModule>

    # ------------------------------------------------------------
    # Caché de contenido estático: los assets versionados (JS/CSS con ?v=)
    # y las imágenes pueden vivir 7 días en el navegador sin re-pedirse.
    # NO aplica a respuestas de la API (señaladas con no-store por el
    # backend), así que no rompe sesiones ni datos dependientes de auth.
    # ------------------------------------------------------------
    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/jpeg "access plus 7 days"
        ExpiresByType image/png "access plus 7 days"
        ExpiresByType image/gif "access plus 7 days"
        ExpiresByType image/webp "access plus 7 days"
        ExpiresByType image/svg+xml "access plus 7 days"
        ExpiresByType text/css "access plus 7 days"
        ExpiresByType application/javascript "access plus 7 days"
        ExpiresByType font/woff2 "access plus 7 days"
        ExpiresByType application/x-font-ttf "access plus 7 days"
    </IfModule>
    <IfModule mod_headers.c>
        # Para assets con ?v= el navegador siempre pide verificar con ETag/Last-Modified
        <FilesMatch "\.(css|js|svg|woff2|ttf|jpg|jpeg|png|gif|webp)$">
            Header set Cache-Control "public, max-age=604800, must-revalidate"
        </FilesMatch>
    </IfModule>

    # ------------------------------------------------------------
    # Carta del comensal: URL corta para el QR.
    #   /m/<token>  ->  /public/menu.html?t=<token>
    # El token identifica la carta; no autoriza nada por sí solo.
    # ------------------------------------------------------------
    RewriteEngine On
    RewriteRule ^/m/([A-Za-z0-9]{8,64})/?$ /public/menu.html?t=$1 [L,QSA]

    ProxyPass "/ws/" "ws://ws:8765/" connectiontimeout=5 timeout=600
    ProxyPassReverse "/ws/" "ws://ws:8765/"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
