; Pool php-fpm para Tomodachi POS (Community Edition) - sustituye al www.conf
; por defecto. Pool dinámico: los workers sobran SOLO mientras hay peticiones,
; no por conexión (a diferencia de mod_php de Apache, RAM fija por worker).
; - pm=dynamic: arranca pocos, crece bajo carga y se recoge al bajar.
; - max_children 48: da de sobra (~700+ RPS dashboard, ~450 lecturas) sin agotar
;   RAM. Cada worker ~15-20MB; 48 x 20MB ~ 1GB pico (huésped Raspberry OK).
; - start_servers 4 = 1 por núcleo (sin espera inicial para 4 clientes a la vez).
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 48
pm.start_servers = 4
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 1000

; Sesiones persistentes (ruta en conf.d/100-sessions.ini del Dockerfile)
php_admin_value[session.gc_maxlifetime] = 31536000

; No exponer versión de PHP
php_admin_flag[expose_php] = off

; Asegurar que el pool no escriba el log de ACCESO a disco (supervisord y el
; healthcheck no lo consumen; el búfer de logs de php-fpm ocupa RAM al pedo).
access.log = /dev/null
; Los errores SÍ tienen que salir del worker: sin catch_workers_output los
; workers mandan su stdout/stderr al descarte que impone la spec FastCGI y el
; error_log() de la aplicación nunca llega a stderr de php-fpm (o sea, nunca
; llega a docker logs). Se declara explícito a propósito: no depender del
; docker.conf de la imagen base (que hoy lo pone en yes, pero cuyo bloque [www]
; desaparece en 8.6+). El error log del pool lo publica supervisord en el stdout
; del PID 1 — ver docker/supervisord.conf.
catch_workers_output = yes