# Config nginx para Tomodachi POS (Community Edition)
# Contenedor ÚNICO: nginx + php-fpm (127.0.0.1:9000) orquestados por supervisord.
# Réplica fiel de Apache + docker/apache-tomodachi.conf + el .htaccess del repo
# (nginx ignora .htaccess, así que aquí se reimplementan esas protecciones):
#   - DocumentRoot = /var/www/html (igual que Apache)
#   - La UI se sirve bajo /public/... y la API bajo /api/...php
#   - '/' -> 302 /public/landing.html
#   - Auth por API token: se propaga el header Authorization como HTTP_AUTHORIZATION
#     (sin esto, los tokens Bearer td_... NO funcionan en nginx).
#   - js/css/html -> no-cache (decisión del repo en public/.htaccess: evita
#     que navegadores/Cloudflare sirvan versiones viejas tras un deploy).
#     Solo los ASSETS PESADOS (fuentes/imágenes) se cachean 7 días.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 100M;

    # Compresión (equivalente a mod_deflate del repo)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml image/svg+xml font/ttf font/otf application/octet-stream application/x-font-ttf;

    upstream php { server 127.0.0.1:9000; }

    server {
        listen 80;
        server_name _;
        root /var/www/html;          # DocumentRoot igual que Apache
        index index.html;

        # '/' -> landing (Apache: 302 a /public/landing.html)
        location = / {
            return 302 /public/landing.html;
        }

        # /m/<token> -> carta (URL corta QR)
        location ~ ^/m/[A-Za-z0-9]+/?$ {
            rewrite ^/m/[A-Za-z0-9]+/?$ /public/menu.html?t=$1 last;
        }

        # WebSocket relay (igual que ProxyPass de Apache al servicio ws:8765)
        location ^~ /ws/ {
            proxy_pass http://ws:8765/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 600s;
        }

        # Scripts de desarrollo/diagnóstico: no accesibles por web (como .htaccess)
        location ~ ^/(repro_issue|test_cli_mail|test_consume_mode|test_mail_get)\.php$ { deny all; }
        # Config de IA propietaria protegida
        location ~ ^/api/ai/config\.php$ { deny all; }

        # PHP (API): SCRIPT_FILENAME bajo DocumentRoot
        # NOTA: NO usar try_files aquí — su internal redirect en Nginx pierde el
        # método POST (devuelve 405) en requests con body. La regex \.php$ ya
        # acota a archivos PHP reales. Se propaga Authorization y X-Webhook-Signature
        # para que funcionen API tokens (Bearer) y webhooks (como el .htaccess).
        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTP_X_WEBHOOK_SIGNATURE $http_x_webhook_signature;
        }

        # js/css/html: NO cachear (decisión del repo en public/.htaccess).
        location ~* \.(?:js|css|html)$ {
            expires off;
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri =404;
        }

        # Assets pesados (fuentes/imágenes/video): caché 7 días — gran bajada de
        # tiempo de carga, y no arriesgan versionado viejo de código.
        location ~* \.(?:svg|woff2?|ttf|otf|jpg|jpeg|png|gif|webp|ico|mp4|webm)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, must-revalidate";
            try_files $uri =404;
        }

        # Negar acceso a archivos/directorios sensibles (equivalente a .htaccess)
        location ~ ^/(config|includes|database|temp|cache|vendor|tests|docs|docker|logs|codi)/ { deny all; }
        location ~ /\. { deny all; }
        location ~* \.(?:sql|log|txt|md|htaccess|ini|bak)$ { deny all; }

        # Páginas y assets de public/ (HTML por defecto no-cache)
        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache, must-revalidate";
        }
    }
}