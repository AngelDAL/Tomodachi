# Config nginx para Tomodachi POS (Community Edition)
# Contenedor ÚNICO: nginx + php-fpm (127.0.0.1:9000) orquestados por supervisord.
# Réplica fiel de Apache + docker/apache-tomodachi.conf + el .htaccess del repo
# (nginx ignora .htaccess, así que aquí se reimplementan esas protecciones):
#   - DocumentRoot = /var/www/html (igual que Apache)
#   - La UI se sirve bajo /public/... y la API bajo /api/...php
#   - '/' -> 302 /public/landing.html
#   - Auth por API token: se propaga el header Authorization como HTTP_AUTHORIZATION
#     (sin esto, los tokens Bearer td_... NO funcionan en nginx).
#   - js/css/html -> no-cache (decisión del repo en public/.htaccess: evita
#     que navegadores/Cloudflare sirvan versiones viejas tras un deploy).
#     Solo los ASSETS PESADOS (fuentes/imágenes) se cachean 7 días.
user www-data;
worker_processes auto;
pid /run/nginx.pid;
# Errores de nginx a stderr del PID 1 (supervisord los publica en docker logs).
# Sin esta línea nginx escribe en /var/log/nginx/error.log, un archivo dentro del
# contenedor que `docker logs` no muestra: los 502 y los upstream caídos no se ven.
error_log /dev/stderr warn;
events { worker_connections 2048; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 100M;

    # Correlación de peticiones: nginx genera un $request_id único por petición,
    # lo escribe en el access log y lo inyecta a PHP como HTTP_X_REQUEST_ID
    # (ver `fastcgi_param` más abajo) y al cliente como cabecera X-Request-Id.
    # Con eso un id de una respuesta lleva a la línea exacta del access log y a
    # los `[req=… store=… user=… route=…]` que emite includes/RequestContext.
    # Nota: declarar un log_format NO cambia el formato por defecto — hay que
    # nombrarlo en un access_log, si no el log sigue siendo `combined`.
    log_format tomodachi '$remote_addr - $request_id "$request" $status $request_time';
    access_log /var/log/nginx/access.log tomodachi;

    # Compresión (equivalente a mod_deflate del repo)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml image/svg+xml font/ttf font/otf application/octet-stream application/x-font-ttf;

    # --- Raíles del SSE anónimo del carrito (TAB-25-X2 / P0-2) ----------------
    # api/sales/cart_sse.php es anónimo y mantiene un worker de php-fpm ocupado
    # mientras dura el stream: N conexiones = N workers menos para el resto de
    # la instalación. Sin raíles, 48 conexiones agotan `pm.max_children = 48`
    # (docker/fpm-tuning.conf) y todo lo demás recibe 502/504.
    #
    # Dos claves de conteo porque son dos ataques distintos:
    #   * por SESIÓN ($sse_session_key): el atacante que abre N streams con el
    #     MISMO UUID del carrito — no necesita adivinar nada y amplifica sin
    #     límite. Un display legítimo abre 1 stream por sesión.
    #   * por IP ($binary_remote_addr): el atacante que usa muchos UUIDs.
    #
    # `$sse_session_key` mapea el `?session=` a la cubeta del raíl por sesión.
    # Un `?session=` ausente NO es "la misma sesión" que otro ausente: cae en
    # $request_id (único por petición, así cuenta 1 y sólo lo frena el raíl por
    # IP) en vez de compartir cubeta con todo el tráfico sin UUID.
    map $arg_session $sse_session_key {
        default  $arg_session;
        ""       $request_id;
    }
    # 1m de memoria ~ 8k cubetas activas cada zona; de sobra para una tienda.
    limit_conn_zone $sse_session_key zone=sse_session:1m;
    limit_conn_zone $binary_remote_addr zone=sse_ip:1m;

    upstream php { server 127.0.0.1:9000; }

    server {
        listen 80;
        server_name _;
        root /var/www/html;          # DocumentRoot igual que Apache
        index index.html;

        # El id de la petición viaja también al cliente: se puede pegar en un
        # ticket y encontrar la línea del log. `always` = también en 4xx/5xx.
        # OJO: un `location` con sus propios add_header NO hereda éste (nginx
        # descarta los add_header del nivel padre), por eso se repite en los
        # bloques que ya declaran Cache-Control.
        add_header X-Request-Id $request_id always;

        # '/' -> landing (Apache: 302 a /public/landing.html)
        location = / {
            return 302 /public/landing.html;
        }

        # /m/<token> -> carta (URL corta QR)
        location ~ ^/m/[A-Za-z0-9]+/?$ {
            rewrite ^/m/[A-Za-z0-9]+/?$ /public/menu.html?t=$1 last;
        }

        # WebSocket relay (igual que ProxyPass de Apache al servicio ws:8765)
        location ^~ /ws/ {
            proxy_pass http://ws:8765/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 600s;
        }

        # Scripts de desarrollo/diagnóstico: no accesibles por web (como .htaccess)
        location ~ ^/(repro_issue|test_cli_mail|test_consume_mode|test_mail_get)\.php$ { deny all; }
        # Config de IA propietaria protegida
        location ~ ^/api/ai/config\.php$ { deny all; }

        # --- SSE del carrito: raíles propios (TAB-25-X2 / P0-2) --------------
        # Un `location =` (match exacto) gana a la regex `\.php$` de abajo, así
        # que ESTE bloque es la ruta del SSE y hereda su propio juego de raíles.
        # Es defensa en profundidad: la autenticación del endpoint es otro
        # issue (TAB-25-X3); esto acota el daño si llega tráfico anónimo.
        #
        # Parámetros de operación (los dos números que se tocan, y por qué):
        #   limit_conn sse_session 2  — streams simultáneos por sesión de
        #     carrito. Un display legítimo tiene 1; 2 da sitio al solape de la
        #     reconexión del navegador (EventSource reconecta tras un corte) sin
        #     dejar amplificar. ESTE es el raíl que cierra el ataque de
        #     amplificación: mismo UUID, N streams.
        #   limit_conn sse_ip 24     — streams simultáneos por IP.
        #     Justificación: una tienda con varios puntos de servicio detrás de
        #     un NAT comparte IP, y tumbar el display legítimo es un daño mayor
        #     que el ataque. 24 cubre 24 puntos de servicio + reconexiones, y es
        #     exactamente el 50% de `pm.max_children = 48` (docker/fpm-tuning):
        #     ninguna IP sola puede dejar la instalación sin workers — como
        #     mucho ocupa la mitad del pool y la otra mitad sigue atendiendo.
        #   Cómo cambiarlos: si sube/baja `pm.max_children` en
        #   docker/fpm-tuning.conf, mueve sse_ip en la misma proporción
        #   (regla: sse_ip <= 50% del pool) y deja sse_session en 1–2. Si una
        #   tienda reporta 429 con uso legítimo, sube sse_ip; no quites el raíl.
        #
        # `limit_conn_status 429` (y no 503): el rechazo es del raíl, no del
        # backend, y el cliente puede reintentar como cualquier otro 429.
        location = /api/sales/cart_sse.php {
            limit_conn sse_session 2;
            limit_conn sse_ip 24;
            limit_conn_status 429;
            limit_conn_log_level warn;

            # Corte deliberado de la conexión (antes era el default de nginx,
            # 60s, que nadie eligió): el SSE sólo escribe cuando cambia el
            # carrito, así que un cliente que se va con el carrito quieto NO
            # dispara `connection_aborted()` (sólo cambia tras un intento de
            # escritura) y el worker seguiría ocupado. 300s acota esa ocupación
            # (el tope de 2h de cart_sse.php:43 nunca fue alcanzable aquí) y es
            # de sobra para el ciclo del loop (sleep de 1s). Subirlo sólo si un
            # cliente necesita más silencio: cada segundo extra es ocupación de
            # worker.
            fastcgi_read_timeout 300s;
            fastcgi_buffering off;

            include fastcgi_params;
            fastcgi_pass php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTP_X_WEBHOOK_SIGNATURE $http_x_webhook_signature;
            fastcgi_param HTTP_X_REQUEST_ID $request_id;
        }

        # PHP (API): SCRIPT_FILENAME bajo DocumentRoot
        # NOTA: NO usar try_files aquí — su internal redirect en Nginx pierde el
        # método POST (devuelve 405) en requests con body. La regex \.php$ ya
        # acota a archivos PHP reales. Se propaga Authorization y X-Webhook-Signature
        # para que funcionen API tokens (Bearer) y webhooks (como el .htaccess).
        # OJO: entre `location` con regex gana la PRIMERA que casa según el orden
        # del archivo, así que todo lo que deba negarse va ANTES que esta regla.
        location ~* ^/public/uploads/.*\.(?:php|phtml|phar|cgi|pl|py|sh|shtml)$ { deny all; }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
            fastcgi_param HTTP_X_WEBHOOK_SIGNATURE $http_x_webhook_signature;
            # Id de la petición para PHP (RequestContext lo lee y lo valida).
            # nginx sobreescribe lo que mande el cliente: es nuestro, no suyo.
            fastcgi_param HTTP_X_REQUEST_ID $request_id;
        }

        # js/css/html: NO cachear (decisión del repo en public/.htaccess).
        location ~* \.(?:js|css|html)$ {
            expires off;
            add_header Cache-Control "no-cache, must-revalidate";
            add_header X-Request-Id $request_id always;
            try_files $uri =404;
        }

        # Assets pesados (fuentes/imágenes/video): caché 7 días — gran bajada de
        # tiempo de carga, y no arriesgan versionado viejo de código.
        location ~* \.(?:svg|woff2?|ttf|otf|jpg|jpeg|png|gif|webp|ico|mp4|webm)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, must-revalidate";
            add_header X-Request-Id $request_id always;
            try_files $uri =404;
        }

        # Negar acceso a archivos/directorios sensibles (equivalente a .htaccess)
        location ~ ^/(config|includes|database|temp|cache|vendor|tests|docs|docker|logs|codi)/ { deny all; }
        location ~ /\. { deny all; }
        location ~* \.(?:sql|log|txt|md|htaccess|ini|bak)$ { deny all; }

        # Páginas y assets de public/ (HTML por defecto no-cache)
        location / {
            try_files $uri $uri/ =404;
            add_header Cache-Control "no-cache, must-revalidate";
            add_header X-Request-Id $request_id always;
        }
    }
}