; Configuración PHP - Tomodachi POS (Community Edition)
; Límites ajustados para el módulo de Pantallas Digitales:
; se permite subir imágenes de hasta 100MB y se comprimen en servidor (GD).

; Subida de archivos
upload_max_filesize = 100M
post_max_size = 100M
max_file_uploads = 20

; Memoria y tiempo (necesario para comprimir/redimensionar imágenes grandes con GD)
memory_limit = 256M
max_execution_time = 120
max_input_time = 120

; Sesiones persistentes (1 año, para "mantener sesión siempre")
session.gc_maxlifetime = 31536000
session.cookie_lifetime = 31536000

; ================================================================
; Rendimiento — OPcache
; ================================================================
; Compila y guarda los scripts PHP en memoria para evitar re-compilar
; en cada request. En producción: 4096 archivos acelerados, 256MB de
; caché, y validación de timestamps cada 60s (balance entre desarrollo
; y producción — los cambios del repo se ven en ≤60s). Se omite JIT
; a propósito: prioriza estabilidad en hardware modesto (Raspberry Pi).
; ================================================================
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 40000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
opcache.fast_shutdown = 1
opcache.max_wasted_percentage = 5
