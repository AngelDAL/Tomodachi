; supervisord principal - Tomodachi POS (nginx + php-fpm en un solo contenedor)
; Los logs del contenedor (errores de la app, de php-fpm y de nginx) tienen que
; llegar a `docker logs`: se escriben en el stdout del PID 1, que es el pipe que
; captura el log driver. Un logfile hacia el descarte no se ve por ningún lado y
; es exactamente lo que dejaba al operador a ciegas.
; stdout_logfile=/dev/stdout + stdout_logfile_maxbytes=0: supervisord no intenta
; rotar, así que nunca hace tell() sobre el pipe (no seekable) y no aparece el
; "Illegal seek" que justificaba el descarte. Con maxbytes > 0 sí habría rollover.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
; El error log del pool sale por stderr de php-fpm -> stdout del PID 1.
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
; nginx también loguea por stderr (error_log /dev/stderr en docker/nginx.conf).
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Consumidor de la cola de impresión ESC/POS (TAB-22). Mismo camino de logs que
; php-fpm y nginx: su salida es la que ve el operador en `docker logs` cuando un
; ticket no sale, así que no puede quedarse en un archivo dentro del contenedor.
;
; PENDIENTE DE VENTANA DE ORQUESTADOR: añadir este programa obliga a RECREAR el
; contenedor, y eso no lo hace un agente (regla del repo: contenedores, volúmenes
; y bases de datos son del orquestador). Coordinado con devops en TAB-22; hasta
; que se aplique, la cola funciona igual a mano:
;     php scripts/print-worker.php --verbose
[program:print-worker]
command=/usr/local/bin/php /var/www/html/scripts/print-worker.php
autostart=true
autorestart=true
; Un fallo de IMPRESORA no reinicia el proceso: la cola lo registra y el worker
; sigue con el siguiente job. `autorestart` es solo para que el proceso viva.
startsecs=3
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0