; supervisord principal - Tomodachi POS (nginx + php-fpm en un solo contenedor)
; Logs a /dev/null: /dev/stdout es un pipe (no seekable) y supervisord hace
; tell() para el rollover -> "Illegal seek". /dev/null sí es seekable.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/null
stderr_logfile=/dev/null