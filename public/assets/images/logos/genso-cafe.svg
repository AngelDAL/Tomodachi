<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Genso Cafe">
  <defs>
    <linearGradient id="cafe-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#143E3B"/>
      <stop offset="1" stop-color="#0B1A26"/>
    </linearGradient>
    <linearGradient id="cafe-cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FE0D8"/>
      <stop offset="1" stop-color="#35B6B0"/>
    </linearGradient>
  </defs>
  <!-- Fondo circular en la nueva paleta (marino -> teal profundo) -->
  <circle cx="128" cy="128" r="120" fill="url(#cafe-bg)"/>
  <!-- Aro interior cian de la marca -->
  <circle cx="128" cy="128" r="108" fill="none" stroke="#4FD2CB" stroke-width="4" opacity=".75"/>
  <!-- Taza (cuerpo) en cian/teal -->
  <path d="M84 105h78v48c0 26-18 43-39 43s-39-17-39-43v-48z" fill="url(#cafe-cup)"/>
  <!-- Asa en azul secundario -->
  <path d="M163 119h14c17 0 27 10 27 25s-10 25-27 25h-18" fill="none" stroke="#5B8DD9" stroke-width="12" stroke-linecap="round"/>
  <!-- Sonrisa/superficie en verde azulado profundo -->
  <path d="M105 127c11-12 35-12 46 0-9 12-33 12-46 0z" fill="none" stroke="#126E68" stroke-width="5" stroke-linecap="round"/>
  <!-- Vapor en cian claro -->
  <path d="M115 71c-10-12 8-22 0-34M136 71c-10-12 8-22 0-34M156 77c-8-10 7-18 0-28" fill="none" stroke="#A8E4E0" stroke-width="6" stroke-linecap="round"/>
  <!-- Texto en blanco azulado -->
  <text x="128" y="224" text-anchor="middle" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#DCEAF3" letter-spacing="2">GENSO</text>
</svg>