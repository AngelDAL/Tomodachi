<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Clientes - Tomodachi</title>
    <link rel="stylesheet" href="css/fonts.css?v=4">
    <link rel="stylesheet" href="lib/fontawesome/css/all.min.css?v=4">
    <link rel="stylesheet" href="css/main.css?v=4">
    <link rel="stylesheet" href="css/sidebar-modern.css?v=4">
    <link rel="stylesheet" href="css/mobile-nav.css?v=4">
    <link rel="stylesheet" href="css/dashboard.css?v=4">
    <link rel="stylesheet" href="css/inventory.css?v=4">
    <script src="js/theme-init.js"></script>
    <script src="js/format-utils.js"></script>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="sidebar-close" id="sidebarClose" aria-label="Cerrar menú"><i class="fas fa-times"></i></button>
                <h2>Tomodachi</h2>
            </div>
            <nav class="sidebar-nav">
                <!-- Navigation Loaded by js/sidebar-loader.js?v=3 -->
            </nav>
        </aside>

        <main class="main-content">
            <div class="inventory-container">
                <section class="inv-controls">
                    <div class="controls-top">
                        <div class="search-section">
                            <div class="search-header">
                                <h3><i class="fas fa-users"></i> Clientes</h3>
                            </div>
                            <div class="search-bar">
                                <div class="search-input-wrapper">
                                    <i class="fas fa-search search-icon"></i>
                                    <input type="text" id="customerSearchInput" placeholder="Buscar por nombre, teléfono o correo..." aria-label="Buscar clientes" class="search-input">
                                </div>
                            </div>
                            <div class="customer-filters" style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
                                <button class="customer-filter-btn active" data-status="" data-balance="" onclick="setCustomerFilter(this)">
                                    <i class="fas fa-users"></i> Todos
                                </button>
                                <button class="customer-filter-btn" data-status="active" data-balance="" onclick="setCustomerFilter(this)">
                                    <i class="fas fa-user-check"></i> Clientes
                                </button>
                                <button class="customer-filter-btn" data-status="" data-balance="with_balance" onclick="setCustomerFilter(this)">
                                    <i class="fas fa-hand-holding-dollar"></i> Apartados (con saldo)
                                </button>
                                <button class="customer-filter-btn" data-status="inactive" data-balance="" onclick="setCustomerFilter(this)">
                                    <i class="fas fa-user-slash"></i> Inactivos
                                </button>
                            </div>
                        </div>
                        <div class="inv-actions">
                            <button id="addCustomerBtn" class="btn btn-primary" style="padding: 0.7rem 1.4rem; border-radius: 8px;">
                                <i class="fas fa-user-plus"></i> Nuevo Cliente
                            </button>
                        </div>
                    </div>
                    <div class="customer-summary" style="display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px;">
                        <div class="summary-chip" style="background: var(--primary-lighter); border: 1px solid var(--primary-light); border-radius: 10px; padding: 8px 14px; font-size:0.9rem;">
                            <i class="fas fa-users" style="color: var(--primary-color);"></i> <strong id="totalCustomers">0</strong> clientes
                        </div>
                        <div class="summary-chip" style="background: var(--primary-lighter); border: 1px solid var(--primary-light); border-radius: 10px; padding: 8px 14px; font-size:0.9rem;">
                            <i class="fas fa-hand-holding-dollar" style="color: var(--warning-color);"></i> Apartado total: <strong id="totalBalance">$0.00</strong>
                        </div>
                    </div>
                </section>

                <section class="inv-table-section">
                    <div id="customersTableWrap">
                    <table class="inventory-table" id="customersTable" style="width:100%; border-collapse: collapse;">
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Teléfono</th>
                                <th>Saldo (apartado)</th>
                                <th>Límite</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="customersTableBody">
                            <tr><td colspan="6" style="text-align:center; padding:2rem; color:var(--text-muted);">
                                <i class="fas fa-spinner fa-spin"></i> Cargando clientes...
                            </td></tr>
                        </tbody>
                    </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <!-- Modal: Nuevo/Editar cliente -->
    <dialog id="customerModal" class="client-dialog" aria-label="Cliente">
        <div class="modal-content" style="max-width: 500px; border: none; border-radius: 14px; padding: 2.2rem; background: var(--bg-card, #fff);">
            <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.4rem;">
                <h2 id="customerModalTitle" style="margin:0; font-size:1.3rem; color: var(--text-color, #1a1a2e);"><i class="fas fa-user" style="color: var(--primary-color); margin-right: 8px;"></i>Nuevo Cliente</h2>
                <button id="customerModalClose" class="modal-close" aria-label="Cerrar" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color: var(--primary-color);">×</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="customerIdInput">
                <div class="form-group" style="margin-bottom: 16px;">
                    <label style="display:block; font-size:0.85rem; margin-bottom:6px; color: var(--text-medium);">Nombre completo *</label>
                    <input type="text" id="customerNameInput" class="form-input" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border-color); background: var(--bg-lightest); transition: border-color var(--transition-fast), box-shadow var(--transition-fast);" placeholder="Nombre del cliente">
                </div>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label style="display:block; font-size:0.85rem; margin-bottom:6px; color: var(--text-medium);">Teléfono</label>
                    <input type="text" id="customerPhoneInput" class="form-input" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border-color); background: var(--bg-lightest);" placeholder="555-1234">
                </div>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label style="display:block; font-size:0.85rem; margin-bottom:6px; color: var(--text-medium);">Email</label>
                    <input type="email" id="customerEmailInput" class="form-input" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border-color); background: var(--bg-lightest);" placeholder="cliente@correo.com">
                </div>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label style="display:block; font-size:0.85rem; margin-bottom:6px; color: var(--text-medium);">Dirección</label>
                    <input type="text" id="customerAddressInput" class="form-input" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border-color); background: var(--bg-lightest);" placeholder="Dirección (opcional)">
                </div>
                <div class="form-group" style="margin-bottom: 16px;">
                    <label style="display:block; font-size:0.85rem; margin-bottom:6px; color: var(--text-medium);">Límite de crédito (0 = sin límite)</label>
                    <input type="number" id="customerLimitInput" class="form-input" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border-color); background: var(--bg-lightest);" min="0" step="0.01" value="0">
                </div>
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display:block; font-size:0.85rem; margin-bottom:6px; color: var(--text-medium);">Notas</label>
                    <input type="text" id="customerNotesInput" class="form-input" style="width:100%; padding:10px 12px; border-radius:8px; border:1px solid var(--border-color); background: var(--bg-lightest);" placeholder="Notas (opcional)">
                </div>
                <div style="display:flex; gap:10px; justify-content:flex-end; margin-top: 8px;">
                    <button id="customerCancelBtn" class="btn" style="padding:10px 20px; border-radius:8px; background: var(--bg-light); border:1px solid var(--border-color); cursor:pointer; color: var(--text-medium); transition: background var(--transition-fast);">Cancelar</button>
                    <button id="customerSaveBtn" class="btn btn-primary" style="padding:10px 24px; border-radius:8px; background: var(--primary-color); color:#fff; border:none; cursor:pointer; box-shadow: var(--shadow-primary); transition: background var(--transition-fast), transform var(--transition-fast);">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </div>
        </div>
    </dialog>

    <!-- Modal: Detalle del cliente (historial + abono) -->
    <dialog id="customerDetailModal" class="client-dialog" aria-label="Detalle del cliente">
        <div class="modal-content" style="max-width: 660px; border: none; border-radius: 14px; padding: 2.2rem; background: var(--bg-card, #fff);">
            <div class="modal-header" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1.4rem;">
                <h2 id="customerDetailTitle" style="margin:0; font-size:1.3rem; color: var(--text-color, #1a1a2e);"><i class="fas fa-id-card" style="color: var(--primary-color); margin-right: 8px;"></i>Detalle del Cliente</h2>
                <button id="customerDetailClose" class="modal-close" aria-label="Cerrar" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color: var(--primary-color);">×</button>
            </div>
            <div class="modal-body" style="max-height: 68vh; overflow-y: auto;">
                <div id="customerDetailBody"></div>
            </div>
        </div>
    </dialog>

    <script src="js/sidebar-loader.js?v=3"></script>
    <script src="js/app.js"></script>
    <script>
        // Verificar sesión (modal de re-login si caducó y pidió sesión permanente)
        (async () => {
            const session = await checkSession();
            if (!session) {
                if (typeof requireSession === 'function') { requireSession(); }
                return;
            }
            initCustomers();
        })();

        let CUSTOMERS = [];
        let currentStatusFilter = '';
        let currentBalanceFilter = '';

        function fmtMXN(n) {
            // Delegar en FormatUtils (formato regional de la empresa).
            if (window.FormatUtils) return window.FormatUtils.currency(n);
            return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(Number(n) || 0);
        }

        function esc(s) {
            const d = document.createElement('div');
            d.textContent = String(s ?? '');
            return d.innerHTML;
        }

        async function initCustomers() {
            await loadCustomers();
            bindCustomerEvents();
        }

        async function loadCustomers(search, status, balance) {
            const body = document.getElementById('customersTableBody');
            try {
                const params = new URLSearchParams();
                if (search) params.set('search', search);
                if (status) params.set('status', status);
                if (balance) params.set('balance', balance);
                const qs = params.toString();
                let url = '../api/customers/customers.php' + (qs ? '?' + qs : '');
                const res = await fetch(url);
                const data = await res.json();
                if (!data.success) throw new Error(data.message);
                CUSTOMERS = data.data || [];
                renderCustomers(CUSTOMERS);
            } catch (e) {
                body.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:2rem; color: var(--danger-color);">Error: ${esc(e.message)}</td></tr>`;
            }
        }

        // Filtro por pestañas (Todos / Clientes / Apartados / Inactivos)
        function setCustomerFilter(btn) {
            document.querySelectorAll('.customer-filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const status = btn.getAttribute('data-status');
            const balance = btn.getAttribute('data-balance');
            currentStatusFilter = status;
            currentBalanceFilter = balance;
            loadCustomers(document.getElementById('customerSearchInput').value.trim(), status, balance);
        }

        function renderCustomers(list) {
            const body = document.getElementById('customersTableBody');
            document.getElementById('totalCustomers').textContent = list.length;
            const totalBal = list.reduce((s, c) => s + (Number(c.balance) || 0), 0);
            document.getElementById('totalBalance').textContent = fmtMXN(totalBal);

            if (!list.length) {
                body.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:2rem; color:var(--text-muted);">Sin clientes registrados. Crea el primero con "Nuevo Cliente".</td></tr>`;
                return;
            }
            body.innerHTML = list.map(c => `
                <tr style="cursor:pointer;" onclick="openCustomerDetail(${c.customer_id})" title="Ver historial y abonar">
                    <td data-label="Cliente"><strong>${esc(c.full_name)}</strong></td>
                    <td data-label="Teléfono">${esc(c.phone || '—')}</td>
                    <td data-label="Saldo" style="color: ${Number(c.balance) > 0 ? 'var(--warning-color)' : 'var(--success-color)'}; font-weight:600;">${fmtMXN(c.balance)}</td>
                    <td data-label="Límite">${Number(c.credit_limit) > 0 ? fmtMXN(c.credit_limit) : 'Sin límite'}</td>
                    <td data-label="Estado"><span style="color:${c.status === 'active' ? 'var(--success-color)' : 'var(--danger-color)'};">${c.status === 'active' ? 'Activo' : 'Inactivo'}</span></td>
                    <td data-label="Acciones">
                        <button class="btn btn-sm" onclick="event.stopPropagation(); openCustomerModal(${c.customer_id})" title="Editar" style="margin-right:6px; padding:4px 10px; border-radius:6px; border:none; background:var(--bg-light); cursor:pointer;"><i class="fas fa-edit"></i></button>
                        <button class="btn btn-sm" onclick="event.stopPropagation(); deleteCustomer(${c.customer_id})" title="Eliminar" style="padding:4px 10px; border-radius:6px; border:none; background:var(--danger-color); color:#fff; cursor:pointer;"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function bindCustomerEvents() {
            document.getElementById('customerSearchInput').addEventListener('input', debounce(e => {
                loadCustomers(e.target.value.trim(), currentStatusFilter, currentBalanceFilter);
            }, 350));

            document.getElementById('addCustomerBtn').addEventListener('click', () => openCustomerModal());
            document.getElementById('customerModalClose').addEventListener('click', closeCustomerModal);
            document.getElementById('customerCancelBtn').addEventListener('click', closeCustomerModal);
            document.getElementById('customerSaveBtn').addEventListener('click', saveCustomer);

            const detailModal = document.getElementById('customerDetailModal');
            document.getElementById('customerDetailClose').addEventListener('click', () => detailModal.close());
            detailModal.addEventListener('click', e => { if (e.target === detailModal) detailModal.close(); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape' && detailModal.open) detailModal.close(); });
        }

        function debounce(fn, ms) {
            let t;
            return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
        }

        function openCustomerModal(id) {
            document.getElementById('customerModalTitle').textContent = id ? 'Editar Cliente' : 'Nuevo Cliente';
            const c = id ? CUSTOMERS.find(x => x.customer_id === id) : null;
            document.getElementById('customerIdInput').value = c ? c.customer_id : '';
            document.getElementById('customerNameInput').value = c ? c.full_name : '';
            document.getElementById('customerPhoneInput').value = c ? (c.phone || '') : '';
            document.getElementById('customerEmailInput').value = c ? (c.email || '') : '';
            document.getElementById('customerAddressInput').value = c ? (c.address || '') : '';
            document.getElementById('customerLimitInput').value = c ? (c.credit_limit || 0) : 0;
            document.getElementById('customerNotesInput').value = c ? (c.notes || '') : '';
            document.getElementById('customerModal').showModal();
        }

        function closeCustomerModal() {
            document.getElementById('customerModal').close();
        }

        async function saveCustomer() {
            const id = document.getElementById('customerIdInput').value;
            const name = document.getElementById('customerNameInput').value.trim();
            if (!name) { alert('El nombre es requerido'); return; }
            const payload = {
                full_name: name,
                phone: document.getElementById('customerPhoneInput').value.trim(),
                email: document.getElementById('customerEmailInput').value.trim(),
                address: document.getElementById('customerAddressInput').value.trim(),
                credit_limit: parseFloat(document.getElementById('customerLimitInput').value) || 0,
                notes: document.getElementById('customerNotesInput').value.trim()
            };
            try {
                const res = await fetch('../api/customers/customers.php', {
                    method: id ? 'PUT' : 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(id ? { customer_id: Number(id), ...payload } : payload)
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.message);
                closeCustomerModal();
                loadCustomers(document.getElementById('customerSearchInput').value.trim(), currentStatusFilter, currentBalanceFilter);
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        async function deleteCustomer(id) {
            const c = CUSTOMERS.find(x => x.customer_id === id);
            if (!confirm(`¿Eliminar al cliente "${c ? c.full_name : ''}"? No se puede si tiene saldo pendiente.`)) return;
            try {
                const res = await fetch('../api/customers/customers.php', {
                    method: 'DELETE',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ customer_id: id })
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.message);
                loadCustomers(document.getElementById('customerSearchInput').value.trim(), currentStatusFilter, currentBalanceFilter);
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        async function openCustomerDetail(id) {
            try {
                const res = await fetch(`../api/customers/customers.php?id=${id}`);
                const data = await res.json();
                if (!data.success) throw new Error(data.message);
                const { customer, sales, payments } = data.data;
                document.getElementById('customerDetailTitle').textContent = customer.full_name;
                const body = document.getElementById('customerDetailBody');

                let salesRows = (sales || []).map(s => `
                    <tr>
                        <td data-label="Venta">#${s.sale_id}</td>
                        <td data-label="Fecha">${window.FormatUtils ? window.FormatUtils.date(s.sale_date) : new Date(s.sale_date).toLocaleString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</td>
                        <td data-label="Total" style="text-align:right;">${fmtMXN(s.total)}</td>
                        <td data-label="Pagado" style="text-align:right; color: var(--success-color);">${fmtMXN(s.amount_paid)}</td>
                        <td data-label="Estado">${s.status === 'completed' ? (Number(s.amount_paid) >= Number(s.total) ? 'Pagada' : 'Apartado') : s.status}</td>
                    </tr>`).join('') || '<tr><td colspan="5" style="text-align:center; color:var(--text-muted);">Sin ventas</td></tr>';

                let payRows = (payments || []).map(p => `
                    <tr>
                        <td data-label="Fecha">${window.FormatUtils ? window.FormatUtils.date(p.created_at) : new Date(p.created_at).toLocaleString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</td>
                        <td data-label="Monto" style="text-align:right; color: var(--success-color);">+${fmtMXN(p.amount)}</td>
                        <td data-label="Método">${p.payment_method || 'cash'}</td>
                        <td data-label="Notas">${esc(p.notes || '—')}</td>
                    </tr>`).join('') || '<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">Sin abonos</td></tr>';

                body.innerHTML = `
                    <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem;">
                        <div style="background: var(--primary-lighter); border-radius:10px; padding:10px 14px;">
                            <div style="font-size:0.8rem; color:var(--text-light);">SALDO PENDIENTE</div>
                            <div style="font-size:1.3rem; font-weight:800; color: var(--warning-color);">${fmtMXN(customer.balance)}</div>
                        </div>
                        <div style="background: var(--primary-lighter); border-radius:10px; padding:10px 14px;">
                            <div style="font-size:0.8rem; color:var(--text-light);">COMPRAS TOTALES</div>
                            <div style="font-size:1.3rem; font-weight:800; color: var(--success-color);">${customer.total_purchases || 0}</div>
                        </div>
                    </div>
                    <div style="display:flex; gap:10px; margin-bottom: 1.2rem;">
                        <input type="number" id="paymentAmountInput" min="0.01" step="0.01" placeholder="Monto del abono" style="flex:1; padding:9px; border-radius:8px; border:1px solid var(--border-color);">
                        <select id="paymentMethodInput" style="padding:9px; border-radius:8px; border:1px solid var(--border-color);">
                            <option value="cash">Efectivo</option>
                            <option value="card">Tarjeta</option>
                            <option value="transfer">Transferencia</option>
                        </select>
                        <button onclick="submitPayment(${customer.customer_id})" class="btn btn-primary" style="padding:9px 16px; border-radius:8px; background:var(--primary-color); color:#fff; border:none; cursor:pointer;">
                            <i class="fas fa-hand-holding-dollar"></i> Abonar
                        </button>
                    </div>
                    <h3 style="font-size:1rem; margin: 0 0 8px;"><i class="fas fa-receipt"></i> Historial de ventas</h3>
                    <table class="dashboard-table" style="width:100%; font-size:0.85rem; margin-bottom: 1.2rem;">
                        <thead><tr><th>Venta</th><th>Fecha</th><th style="text-align:right;">Total</th><th style="text-align:right;">Pagado</th><th>Estado</th></tr></thead>
                        <tbody>${salesRows}</tbody>
                    </table>
                    <h3 style="font-size:1rem; margin: 0 0 8px;"><i class="fas fa-coins"></i> Abonos</h3>
                    <table class="dashboard-table" style="width:100%; font-size:0.85rem;">
                        <thead><tr><th>Fecha</th><th style="text-align:right;">Monto</th><th>Método</th><th>Notas</th></tr></thead>
                        <tbody>${payRows}</tbody>
                    </table>
                `;
                document.getElementById('customerDetailModal').showModal();
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }

        async function submitPayment(customerId) {
            const amount = parseFloat(document.getElementById('paymentAmountInput').value);
            if (!amount || amount <= 0) { alert('Monto inválido'); return; }
            const payment_method = document.getElementById('paymentMethodInput').value;
            try {
                const res = await fetch('../api/customers/payments.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ customer_id: customerId, amount, payment_method })
                });
                const data = await res.json();
                if (!data.success) throw new Error(data.message);
                openCustomerDetail(customerId);
                loadCustomers(document.getElementById('customerSearchInput').value.trim(), currentStatusFilter, currentBalanceFilter);
            } catch (e) {
                alert('Error: ' + e.message);
            }
        }
    </script>
</body>
</html>
