<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pantallas Multi - Tomodachi</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; overflow:hidden; background:#111; }
        .loading { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#000; color:#fff; font-size:1.2rem; z-index:50; }
        .spinner { width:44px; height:44px; border:4px solid rgba(255,255,255,.2); border-top-color:#fff; border-radius:50%; animation:spin 1s linear infinite; margin-bottom:1rem; }
        @keyframes spin { to { transform:rotate(360deg); } }

        /* Contenedor del grid de pantallas */
        .group-stage { position:fixed; inset:0; display:block; }
        .group-screen {
            position:absolute;
            border:2px solid rgba(255,255,255,.12);
            overflow:hidden;
            background:#000;
        }
        .screen-label {
            position:absolute; top:6px; left:8px; z-index:20;
            font-size:11px; font-weight:700; color:rgba(255,255,255,.55);
            text-transform:uppercase; letter-spacing:.04em; pointer-events:none;
            text-shadow:0 1px 3px rgba(0,0,0,.8);
        }
        .group-slide { position:absolute; inset:0; }

        /* Reutiliza el render de presentacion del editor */
        .presentation-canvas { position:absolute; inset:0; }
        .presentation-element { position:absolute; }
        .presentation-bg { position:absolute; inset:0; width:100%; height:100%; }
        .presentation-bg.fit-fill { background-size:100% 100%; }
        .presentation-bg.fit-cover { background-size:cover; background-position:center; }
        .presentation-bg.fit-contain { background-size:contain; background-repeat:no-repeat; background-position:center; }
        .presentation-content { position:absolute; inset:0; display:flex; overflow:hidden; }
        .presentation-text { max-width:100%; overflow-wrap:anywhere; word-break:break-word; font-weight:700; line-height:1.2; text-shadow:0 2px 8px rgba(0,0,0,.6); }

        /* Animaciones */
        @keyframes fadeIn { from{opacity:0;transform:translateY(0);} to{opacity:1;transform:translateY(0);} }
        @keyframes slideUp { from{opacity:0;transform:translateY(50px);} to{opacity:1;transform:translateY(0);} }
        @keyframes scaleIn { from{opacity:0;transform:scale(.8);} to{opacity:1;transform:scale(1);} }
        @keyframes slideLeft { from{opacity:0;transform:translateX(60px);} to{opacity:1;transform:translateX(0);} }
        .anim-fade, .anim-fade-in { animation:fadeIn .8s ease-out; }
        .anim-slide-up { animation:slideUp .8s ease-out; }
        .anim-scale-in { animation:scaleIn .8s ease-out; }
        .anim-slide-left { animation:slideLeft .8s ease-out; }

        /* Transiciones entre diapositivas (por pantalla) */
        @keyframes tFade { from{opacity:0} to{opacity:1} }
        @keyframes tLeft { from{opacity:0;transform:translateX(60px)} to{opacity:1;transform:translateX(0)} }
        @keyframes tRight { from{opacity:0;transform:translateX(-60px)} to{opacity:1;transform:translateX(0)} }
        @keyframes tUp { from{opacity:0;transform:translateY(60px)} to{opacity:1;transform:translateY(0)} }
        @keyframes tZoom { from{opacity:0;transform:scale(.7)} to{opacity:1;transform:scale(1)} }
        .trans-fade { animation:tFade .6s ease-out; }
        .trans-slide_left { animation:tLeft .6s ease-out; }
        .trans-slide_right { animation:tRight .6s ease-out; }
        .trans-slide_up { animation:tUp .6s ease-out; }
        .trans-zoom { animation:tZoom .6s ease-out; }
        .trans-none { animation:none; }

        .error-box { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#000; color:#fff; text-align:center; padding:2rem; z-index:60; }
        .error-box h1 { font-size:3rem; margin-bottom:1rem; }
    </style>
    <link rel="stylesheet" href="css/design-system.css?v=6">
    <script src="lib/animejs/anime.min.js" defer></script>
    <script src="js/design-system.js?v=6" defer></script>
</head>
<body>
    <div class="loading" id="loading"><div class="spinner"></div><div>Cargando pantallas...</div></div>
    <div class="group-stage" id="stage" style="display:none;"></div>
    <script src="/public/lib/qrcodejs/qrcode.min.js"></script>
    <script>
        const API = '/api';
        const groupId = new URLSearchParams(location.search).get('group');
        let group = null;

        function esc(t){ const d=document.createElement('div'); d.textContent=t==null?'':t; return d.innerHTML; }
        function escapeHtml(t){ if(!t) return ''; const d=document.createElement('div'); d.textContent=t; return d.innerHTML; }

        function showError(msg){
            document.getElementById('loading').style.display='none';
            const el=document.createElement('div'); el.className='error-box';
            el.innerHTML=`<div style="font-size:3rem;margin-bottom:1rem;">⚠️</div><div style="font-size:1.4rem;">${escapeHtml(msg)}</div>`;
            document.body.appendChild(el);
        }

        // Renderiza un slide del editor de presentación (elementos con content.rect)
        function renderSlide(slide){
            const holder=document.createElement('div');
            holder.className='group-slide';
            const els=slide.elements||[];
            const hasPres=els.some(e=>e.content && e.content.rect);
            if(slide.background_color) holder.style.background=slide.background_color;
            else if(slide.background_image) holder.style.background=`url(${slide.background_image}) center/cover`;
            else if(!hasPres) holder.style.background='linear-gradient(135deg,#334,#112)';
            if(!hasPres) return holder;
            const canvas=document.createElement('div'); canvas.className='presentation-canvas';
            [...els].sort((a,b)=>(a.z_index||1)-(b.z_index||1)).forEach(element=>{
                const c=element.content||{}; const r=c.rect; if(!r) return;
                const item=document.createElement('div');
                item.className='presentation-element';
                item.style.left=`${r.x_pct||0}%`; item.style.top=`${r.y_pct||0}%`;
                item.style.width=`${r.w_pct||10}%`; item.style.height=`${r.h_pct||10}%`;
                item.style.zIndex=element.z_index||c.z_index||1;
                if(c.background_image){
                    const bg=document.createElement('div');
                    bg.className=`presentation-bg fit-${c.background_fit||'fill'}`;
                    bg.style.backgroundImage=`url('${c.background_image}')`;
                    item.appendChild(bg);
                } else if(c.background_color){
                    const bg=document.createElement('div'); bg.className='presentation-bg'; bg.style.background=c.background_color; item.appendChild(bg);
                }
                if(c.text){
                    const content=document.createElement('div');
                    content.className='presentation-content';
                    content.style.justifyContent={left:'flex-start',center:'center',right:'flex-end'}[c.text_pos_h]||'center';
                    content.style.alignItems={top:'flex-start',middle:'center',bottom:'flex-end'}[c.text_pos_v]||'center';
                    const text=document.createElement('div');
                    text.className='presentation-text';
                    text.textContent=c.text;
                    text.style.fontSize=`${c.text_size_pct||4}%`;
                    text.style.color=c.text_color||'#fff';
                    text.style.textAlign=c.text_pos_h||'center';
                    text.style.transform=`translate(${c.text_offset_x||0}px, ${c.text_offset_y||0}px)`;
                    content.appendChild(text);
                    item.appendChild(content);
                }
                // animación de entrada
                if(c.animation && c.animation!=='none') item.classList.add('anim-'+c.animation.replace('_','-'));
                canvas.appendChild(item);
            });
            holder.appendChild(canvas);
            return holder;
        }

        // Estado de rotación por pantalla
        let screenTimers = {};

        // Muestra la diapositiva `idx` de la pantalla `screen`
        function showScreenSlide(screen, idx){
            const shell = document.querySelector(`.group-screen[data-id="${screen.id}"]`);
            if(!shell) return;
            const slides = screen.slides || [];
            if(!slides.length){ shell.innerHTML = '<div class="screen-label">'+esc(screen.label||'')+'</div>'; return; }
            const current = idx % slides.length;
            const entry = slides[current];
            const trans = entry.transition || (slides[(current+slides.length-1)%slides.length]?.transition) || 'fade';
            shell.innerHTML = '';
            const label = document.createElement('div'); label.className='screen-label'; label.textContent=screen.label||''; shell.appendChild(label);
            if(entry && entry.slide){
                const holder = document.createElement('div');
                holder.style.position='absolute'; holder.style.inset='0';
                holder.classList.add('trans-'+trans);
                holder.appendChild(renderSlide(entry.slide));
                shell.appendChild(holder);
            }
            // programar siguiente para ESTA pantalla (rotación independiente + loop)
            clearTimeout(screenTimers[screen.id]);
            const dur = entry && entry.custom_duration ? entry.custom_duration : 8;
            screenTimers[screen.id] = setTimeout(()=>{ showScreenSlide(screen, current+1); }, dur*1000);
        }

        function start(){
            document.getElementById('loading').style.display='none';
            document.getElementById('stage').style.display='block';
            const stage=document.getElementById('stage');
            stage.style.background = group.bg_color || '#111';
            (group.screens||[]).forEach(screen=>{
                const shell=document.createElement('div');
                shell.className='group-screen';
                shell.dataset.id=screen.id;
                shell.style.left=screen.pos_x+'%';
                shell.style.top=screen.pos_y+'%';
                shell.style.width=screen.w_pct+'%';
                shell.style.height=screen.h_pct+'%';
                stage.appendChild(shell);
                showScreenSlide(screen, 0);
            });
        }

        async function init(){
            if(!groupId){ showError('Falta el identificador del grupo (parametro ?group=)'); return; }
            try{
                const res=await fetch(`${API}/display_groups/get_group.php?group_id=${groupId}`);
                const data=await res.json();
                if(!data.success){ showError(data.message||'No se pudo cargar el grupo'); return; }
                group=data.data;
                start();
            }catch(e){ console.error(e); showError('Error de conexión'); }
        }

        // fullscreen doble clic
        document.addEventListener('dblclick',()=>{
            if(!document.fullscreenElement) document.documentElement.requestFullscreen(); else document.exitFullscreen();
        });

        init();
    </script>
</body>
</html>
