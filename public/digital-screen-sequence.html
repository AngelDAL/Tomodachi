<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Composición de Pantalla - Tomodachi</title>
<link rel="stylesheet" href="css/fonts.css?v=4"><link rel="stylesheet" href="lib/fontawesome/css/all.min.css?v=4"><link rel="stylesheet" href="css/main.css?v=4"><script src="js/theme-init.js"></script>
    <link rel="icon" type="image/svg+xml" href="assets/images/logos/tomodachi-favicon.svg">
<style>
body{margin:0}.sequence-top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 1.25rem;background:var(--card-bg,#fff);border-bottom:1px solid var(--border-color,#ddd)}.sequence-top h1{font-size:1.05rem;margin:0}.btn{border:0;border-radius:6px;padding:.5rem .75rem;font:inherit;font-size:.85rem;font-weight:600;cursor:pointer}.btn-primary{background:var(--primary-color);color:#fff}.btn-secondary{background:var(--bg-secondary,#eee);color:var(--text-primary,#333)}.sequence-layout{display:grid;grid-template-columns:minmax(260px,1fr) minmax(320px,1.15fr);gap:1rem;padding:1rem;max-width:1280px;margin:auto}.panel{background:var(--card-bg,#fff);border:1px solid var(--border-color,#ddd);border-radius:10px;padding:1rem;min-height:calc(100vh - 90px)}.panel h2{font-size:1rem;margin:0 0 .3rem}.panel p{color:var(--text-muted,#667085);font-size:.85rem;margin:0 0 1rem}.slide-card{display:flex;align-items:center;gap:.7rem;padding:.75rem;border:1px solid var(--border-color,#ddd);border-radius:8px;margin:.55rem 0;background:var(--bg-primary,#fff)}.slide-card:hover{border-color:var(--primary-color)}.slide-card .icon{width:32px;height:32px;display:grid;place-items:center;border-radius:6px;background:var(--bg-secondary,#eef2f7);color:var(--primary-color)}.slide-card .info{flex:1;min-width:0}.slide-card .title{font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slide-card .meta{font-size:.75rem;color:var(--text-muted,#667085)}.icon-btn{width:34px;height:34px;border:1px solid var(--border-color,#ddd);border-radius:6px;background:var(--bg-primary,#fff);cursor:pointer;color:var(--text-primary,#333)}.icon-btn:hover{border-color:var(--primary-color);color:var(--primary-color)}.sequence-empty{padding:2rem;text-align:center;color:var(--text-muted,#667085);border:1px dashed var(--border-color,#ddd);border-radius:8px}.toast{position:fixed;right:1.25rem;bottom:1.25rem;background:#1e293b;color:#fff;padding:.75rem 1rem;border-radius:7px;transform:translateY(120px);opacity:0;transition:.2s;z-index:10}.toast.show{transform:translateY(0);opacity:1}.toast.error{background:var(--danger-color,#dc2626)}@media(max-width:760px){.sequence-layout{grid-template-columns:1fr;padding:.75rem}.panel{min-height:auto}.sequence-top h1{max-width:55vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slide-card{min-height:56px}.icon-btn{width:42px;height:42px}.btn{min-height:40px}}
</style>    <link rel="stylesheet" href="css/design-system.css?v=6">
    <script src="lib/animejs/anime.min.js" defer></script>
    <script src="js/design-system.js?v=6" defer></script>
</head>
<body>
<header class="sequence-top"><div style="display:flex;align-items:center;gap:.6rem"><button class="btn btn-secondary" id="back"><i class="fas fa-arrow-left"></i></button><h1 id="title">Composición de Pantalla</h1></div><button class="btn btn-primary" id="preview"><i class="fas fa-eye"></i> Ver</button></header>
<main class="sequence-layout"><section class="panel"><h2>Biblioteca de diapositivas</h2><p>Una diapositiva maestra puede usarse en varias pantallas. Editarla actualiza todos sus usos.</p><div id="library"></div></section><section class="panel"><h2>Secuencia de esta pantalla</h2><p>Usa los controles de orden para definir la rotación. No se duplican elementos.</p><div id="sequence"></div></section></main><div class="toast" id="toast"></div>
<script>
const API='../api',params=new URLSearchParams(location.search),boardId=parseInt(params.get('board')||'0');let board,library=[],items=[];const $=x=>document.getElementById(x);let tt;function toast(m,t=''){const e=$('toast');e.textContent=m;e.className='toast '+t+' show';clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('show'),2500)}async function call(u,o={}){const r=await fetch(`${API}/${u}`,{credentials:'include',...o});return r.json().catch(()=>({success:false,message:'Respuesta inválida'}))}function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}
async function init(){if(!boardId){location.href='digital-signage.html';return}const b=await call('digital_boards/read.php');board=b.data?.find(x=>x.board_id===boardId);if(!board){toast('Pantalla no disponible en la tienda activa','error');return}$('title').textContent=board.name;await Promise.all([loadLibrary(),loadSequence()])}async function loadLibrary(){const r=await call('slide_library/read.php');if(!r.success){toast(r.message||'No se pudo cargar la biblioteca','error');return}library=r.data;renderLibrary()}async function loadSequence(){const r=await call(`board_slide_assignments/read.php?board_id=${boardId}`);if(!r.success){toast(r.message||'No se pudo cargar la secuencia','error');return}items=r.data;renderSequence()}
function renderLibrary(){const used=new Set(items.map(x=>x.slide_id));$('library').innerHTML=library.length?library.map(s=>`<article class="slide-card"><div class="icon"><i class="fas fa-images"></i></div><div class="info"><div class="title">${esc(s.title||'Sin título')}</div><div class="meta">${s.element_count} elementos · ${esc(s.source_board_name)}</div></div><button class="icon-btn" title="Editar diapositiva" onclick="editSlide(${s.source_board_id},${s.slide_id})"><i class="fas fa-pen"></i></button><button class="icon-btn" ${used.has(s.slide_id)?'disabled':''} title="Agregar a esta pantalla" onclick="assignSlide(${s.slide_id})"><i class="fas fa-plus"></i></button></article>`).join(''):'<div class="sequence-empty">Todavía no hay diapositivas disponibles.</div>'}
function renderSequence(){ $('sequence').innerHTML=items.length?items.map((s,i)=>`<article class="slide-card"><div class="icon"><strong>${i+1}</strong></div><div class="info"><div class="title">${esc(s.title||'Sin título')}</div><div class="meta">${s.element_count} elementos</div></div><button class="icon-btn" ${i===0?'disabled':''} title="Subir" onclick="moveSlide(${i},-1)"><i class="fas fa-arrow-up"></i></button><button class="icon-btn" ${i===items.length-1?'disabled':''} title="Bajar" onclick="moveSlide(${i},1)"><i class="fas fa-arrow-down"></i></button><button class="icon-btn" title="Editar maestra" onclick="editSlide(${s.source_board_id||boardId},${s.slide_id})"><i class="fas fa-pen"></i></button><button class="icon-btn" title="Retirar de pantalla" onclick="removeSlide(${s.assignment_id})"><i class="fas fa-times"></i></button></article>`).join(''):'<div class="sequence-empty">Agrega diapositivas desde la biblioteca para formar esta pantalla.</div>';renderLibrary()}
async function assignSlide(id){const r=await call('board_slide_assignments/assign.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({board_id:boardId,source_slide_id:id})});if(!r.success){toast(r.message||'No se pudo agregar','error');return}toast('Diapositiva agregada');await loadSequence()}async function removeSlide(id){const r=await call('board_slide_assignments/remove.php',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assignment_id:id})});if(!r.success){toast(r.message||'No se pudo retirar','error');return}toast('Diapositiva retirada');await loadSequence()}async function moveSlide(i,d){const n=i+d;if(n<0||n>=items.length)return;[items[i],items[n]]=[items[n],items[i]];renderSequence();const r=await call('board_slide_assignments/reorder.php',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({board_id:boardId,assignment_ids:items.map(x=>x.assignment_id)})});if(!r.success){toast(r.message||'No se pudo ordenar','error');await loadSequence()}else toast('Orden actualizado')}function editSlide(source,slide){location.href=`digital-signage-editor.html?board=${source}&slide=${slide}`}$('back').onclick=()=>location.href='digital-signage.html';$('preview').onclick=()=>window.open(`/public/digital-signage-display.html?board=${boardId}`,'_blank');init();
</script></body></html>
