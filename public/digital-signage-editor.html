<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Editor de Pantalla - Tomodachi</title>
    <link rel="stylesheet" href="css/fonts.css?v=4">
    <link rel="stylesheet" href="lib/fontawesome/css/all.min.css?v=4">
    <link rel="stylesheet" href="css/main.css?v=4">
    <link rel="stylesheet" href="css/sidebar-modern.css?v=4">
    <link rel="stylesheet" href="css/mobile-nav.css?v=4">
    <script src="js/theme-init.js"></script>
    <style>
        * { box-sizing: border-box; }

        body { margin: 0; }

        /* ===== Topbar ===== */
        .editor-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 1.25rem;
            background: var(--card-bg, #fff);
            border-bottom: 1px solid var(--border-color, #e2e8f0);
            height: 56px;
        }
        .editor-topbar .br-title {
            font-size: 1.05rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            min-width: 0;
        }
        .br-title span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .topbar-actions { display: flex; gap: 0.5rem; align-items: center; }
        .topbar-actions button {
            padding: 0.45rem 1rem;
            border: none; border-radius: 6px;
            cursor: pointer; font-weight: 600; font-size: 0.85rem;
            display: flex; align-items: center; gap: 0.4rem;
            transition: all 0.15s;
        }
        .btn-save-top { background: var(--primary-color); color: #fff; }
        .btn-save-top:hover { background: var(--primary-dark, #005a9e); }
        .btn-back { background: var(--bg-secondary, #e5e5e5); color: var(--text-primary, #333); }
        .btn-back:hover { background: var(--bg-tertiary, #d5d5d5); }

        /* ===== Layout ===== */
        .editor-wrap { display: flex; height: calc(100vh - 56px); }

        /* ===== Panel izquierdo: tools ===== */
        .editor-tools {
            width: 220px;
            background: var(--card-bg, #fff);
            border-right: 1px solid var(--border-color, #e2e8f0);
            padding: 1rem;
            overflow-y: auto; flex-shrink: 0;
        }
        .editor-tools h3 {
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
            color: var(--text-muted, #64748b); margin: 0 0 0.8rem 0;
            padding-bottom: 0.4rem; border-bottom: 1px solid var(--border-color, #e2e8f0);
        }
        .tool-btn {
            width: 100%; padding: 0.6rem; margin-bottom: 0.5rem;
            border: 1px solid var(--border-color, #ddd); border-radius: 6px;
            background: var(--bg-primary, #fff); color: var(--text-primary, #333);
            cursor: pointer; font-size: 0.85rem; font-weight: 600;
            display: flex; align-items: center; gap: 0.5rem;
            transition: all 0.15s; text-align: left;
        }
        .tool-btn:hover { border-color: var(--primary-color); background: var(--primary-color); color: #fff; }
        .tool-btn i { width: 18px; text-align: center; }
        .tools-divider {
            height: 1px; background: var(--border-color, #e2e8f0);
            margin: 0.8rem 0;
        }
        .layer-list { list-style: none; padding: 0; margin: 0; }
        .layer-item {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.4rem 0.5rem; border-radius: 4px; cursor: pointer;
            font-size: 0.8rem; color: var(--text-primary, #333);
            transition: all 0.12s;
        }
        .layer-item:hover { background: var(--bg-secondary, #f5f5f5); }
        .layer-item.active { background: var(--primary-color); color: #fff; }
        .layer-item i { width: 14px; text-align: center; font-size: 0.75rem; }
        .layer-item .layer-name { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

        /* ===== Canvas ===== */
        .editor-canvas-wrap {
            flex: 1; background: linear-gradient(135deg, #1e293b, #0f172a);
            display: flex; align-items: center; justify-content: center;
            overflow: auto; position: relative;
        }
        .canvas-frame {
            position: relative;
            background: #fff;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            transform-origin: center;
            overflow: hidden;
        }
        /* Elemento absoluto dentro del canvas */
        .ppt-el {
            position: absolute;
            border: 1px solid transparent;
            cursor: move;
            user-select: none;
            -webkit-user-select: none;
        }
        .ppt-el.selected {
            border-color: #38bdf8;
            outline: 1px solid #38bdf8;
        }
        .ppt-el .resizer {
            position: absolute;
            width: 10px; height: 10px;
            background: #fff;
            border: 1px solid #38bdf8;
            z-index: 20;
        }
        .ppt-el .resizer.nw { top: -5px; left: -5px; cursor: nw-resize; }
        .ppt-el .resizer.n { top: -5px; left: 50%; margin-left: -5px; cursor: n-resize; }
        .ppt-el .resizer.ne { top: -5px; right: -5px; cursor: ne-resize; }
        .ppt-el .resizer.e { top: 50%; right: -5px; margin-top: -5px; cursor: e-resize; }
        .ppt-el .resizer.se { bottom: -5px; right: -5px; cursor: se-resize; }
        .ppt-el .resizer.s { bottom: -5px; left: 50%; margin-left: -5px; cursor: s-resize; }
        .ppt-el .resizer.sw { bottom: -5px; left: -5px; cursor: sw-resize; }
        .ppt-el .resizer.w { top: 50%; left: -5px; margin-top: -5px; cursor: w-resize; }
        .ppt-el .resizer { display: none; }
        .ppt-el.selected .resizer { display: block; }

        /* Contenido del elemento */
        .ppt-el .el-bg {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
        }
        .ppt-el .el-bg.bg-fill { background-size: 100% 100%; }
        .ppt-el .el-bg.bg-cover { background-size: cover; }
        .ppt-el .el-bg.bg-contain { background-size: contain; background-repeat: no-repeat; background-position: center; }
        .ppt-el .el-content {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            display: flex;
            overflow: hidden;
        }
        .ppt-el .el-text {
            font-weight: 700;
            line-height: 1.2;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }
        .ppt-el.placeholder-hint {
            background: rgba(255,255,255,0.08);
            border: 1px dashed rgba(255,255,255,0.3);
            color: #94a3b8;
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
            font-size: 0.9rem;
        }

        /* ===== Panel propiedades ===== */
        .editor-props {
            width: 280px;
            background: var(--card-bg, #fff);
            border-left: 1px solid var(--border-color, #e2e8f0);
            padding: 1rem; overflow-y: auto; flex-shrink: 0;
        }
        .editor-props h3 {
            font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
            color: var(--text-muted, #64748b); margin: 0 0 0.8rem 0;
            padding-bottom: 0.4rem; border-bottom: 1px solid var(--border-color, #e2e8f0);
        }
        .prop-section {
            margin-bottom: 1rem; padding-bottom: 0.8rem;
            border-bottom: 1px solid var(--border-color, #e2e8f0);
        }
        .tool-group { margin-bottom: 0.7rem; }
        .tool-group label {
            display: block; font-size: 0.75rem; font-weight: 600;
            color: var(--text-primary, #333); margin-bottom: 0.3rem;
        }
        .tool-group input[type="text"],
        .tool-group textarea,
        .tool-group input[type="number"],
        .tool-group select {
            width: 100%; padding: 0.45rem 0.6rem;
            border: 1px solid var(--border-color, #ddd); border-radius: 6px;
            font-size: 0.85rem; font-family: inherit;
            background: var(--bg-primary, #fff); color: var(--text-primary, #333);
        }
        .tool-group textarea { resize: vertical; min-height: 50px; }
        .tool-group input[type="color"] { width: 40px; height: 32px; padding: 2px; border: 1px solid var(--border-color); border-radius: 4px; }
        .tool-row { display: flex; gap: 0.5rem; }
        .tool-row .tool-group { flex: 1; }

        .img-preview {
            width: 100%; height: 60px; border-radius: 6px; margin-top: 0.35rem;
            background-size: cover; background-position: center;
            border: 1px solid var(--border-color, #ddd);
        }
        .empty-props {
            color: var(--text-muted, #666); font-size: 0.85rem; text-align: center;
            padding: 1.5rem 0;
        }
        .pos-hint {
            display: flex; gap: 0.3rem; flex-wrap: wrap;
        }
        .pos-btn {
            padding: 0.3rem 0.4rem; border: 1px solid var(--border-color, #ddd);
            border-radius: 4px; background: var(--bg-primary, #fff); cursor: pointer;
            font-size: 0.75rem; color: var(--text-primary, #333);
        }
        .pos-btn.active { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }

        /* Toast */
        .toast {
            position: fixed; bottom: 1.5rem; right: 1.5rem;
            background: #1e293b; color: #fff; padding: 0.85rem 1.25rem;
            border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.25);
            z-index: 10000; font-size: 0.9rem;
            display: flex; align-items: center; gap: 0.5rem;
            transform: translateY(100px); opacity: 0; transition: all 0.3s;
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: #10b981; }
        .toast.error { background: #ef4444; }

        @media (max-width: 900px) {
            .editor-wrap { flex-direction: column; }
            .editor-tools { width: 100%; border-right: none; border-bottom: 1px solid var(--border-color); }
            .editor-props { width: 100%; border-left: none; border-top: 1px solid var(--border-color); }
            .editor-canvas-wrap { min-height: 300px; }
        }
    </style>
</head>
<body>
    <div class="editor-topbar">
        <div class="br-title">
            <button class="btn-back" id="btnBack"><i class="fas fa-arrow-left"></i></button>
            <span id="boardTitle">Editor de Pantalla</span>
        </div>
        <div class="topbar-actions">
            <button class="btn-save-top" id="btnSave"><i class="fas fa-save"></i> Guardar</button>
        </div>
    </div>

    <div class="editor-wrap">
        <!-- Herramientas -->
        <aside class="editor-tools">
            <h3>Agregar elemento</h3>
            <button class="tool-btn" data-add="rect" id="addRect"><i class="fas fa-square"></i> Rectángulo</button>
            <button class="tool-btn" data-add="text"><i class="fas fa-font"></i> Texto</button>
            <button class="tool-btn" data-add="image"><i class="fas fa-image"></i> Imagen</button>

            <div class="tools-divider"></div>
            <h3>Capas</h3>
            <ul class="layer-list" id="layerList"></ul>
        </aside>

        <!-- Canvas -->
        <div class="editor-canvas-wrap" id="canvasWrap">
            <div class="canvas-frame" id="canvasFrame">
                <div class="placeholder-hint">Agrega un elemento para comenzar</div>
            </div>
        </div>

        <!-- Propiedades -->
        <aside class="editor-props" id="editorProps">
            <h3>Propiedades</h3>
            <div id="propsContent">
                <div class="empty-props">
                    <i class="fas fa-mouse-pointer" style="font-size:1.5rem; opacity:0.3; margin-bottom:0.5rem; display:block;"></i>
                    Selecciona un elemento para editarlo
                </div>
            </div>
        </aside>
    </div>

    <div class="toast" id="toast"></div>

    <script src="lib/interactjs/interact.min.js"></script>
    <script src="js/sidebar-loader.js?v=4"></script>
    <script>
        // ===== Config =====
        const API_BASE = '../api';
        const BOARD_ASPECT = 16 / 9;        // Relación del lienzo
        const BOARD_WIDTH = 1600;            // Ancho lógico del canvas
        const BOARD_HEIGHT = BOARD_WIDTH / BOARD_ASPECT;

        const urlParams = new URLSearchParams(window.location.search);
        const boardId = urlParams.get('board');

        // Estado
        let board = null;
        let slides = [];
        let currentSlide = 0;
        let elements = [];      // elementos actuales (local, no persistido)
        let selectedId = null;
        let seq = 0;

        // ===== Utilidades =====
        function $(id) { return document.getElementById(id); }
        function esc(t) { const d = document.createElement('div'); d.textContent = t == null ? '' : t; return d.innerHTML; }
        let _toastTimer;
        function notify(msg, type = 'success') {
            const t = $('toast');
            t.textContent = msg;
            t.className = `toast ${type} show`;
            clearTimeout(_toastTimer);
            _toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
        }
        async function api(url, opts = {}) {
            const res = await fetch(`${API_BASE}/${url}`, { credentials: 'include', ...opts });
            return res.json().catch(() => ({ success: false, message: 'Respuesta inválida' }));
        }
        function elTypeIcon(t) {
            return { rect: 'fa-square', text: 'fa-font', image: 'fa-image', video: 'fa-video' }[t] || 'fa-square';
        }
        function elTypeLabel(t) {
            return { rect: 'Rectángulo', text: 'Texto', image: 'Imagen', video: 'Video' }[t] || t;
        }
        function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

        // ===== Carga =====
        async function init() {
            if (!boardId) { notify('Falta ID de pantalla', 'error'); window.location.href = 'digital-signage.html'; return; }
            $('boardTitle').textContent = 'Cargando...';
            const data = await api('digital_boards/read.php');
            if (data.success) {
                board = data.data.find(b => b.board_id == boardId);
                if (board) $('boardTitle').textContent = board.name;
            }
            const slidesRes = await api(`board_slides/read.php?board_id=${boardId}`);
            slides = slidesRes.success ? (slidesRes.data || []) : [];
            if (slides.length === 0) {
                const created = await api('board_slides/create.php', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ board_id: boardId, title: 'Slide 1' })
                });
                if (created.success) {
                    slides = (await api(`board_slides/read.php?board_id=${boardId}`)).data || [];
                }
            }
            if (slides.length > 0) await loadElements();
            else notify('No se pudo crear el slide', 'error');
        }

        async function loadElements() {
            const slideId = slides[currentSlide].slide_id;
            const data = await api(`slide_elements/read.php?slide_id=${slideId}`);
            elements = (data.success ? data.data : []).map(el => normalizeEl(el));
            if (elements.length === 0) {
                // Demo: crear elementos de ejemplo si está vacío
                createDemo();
            }
            render();
        }

        // Normalizar elemento servidor a estructura local
        function normalizeEl(el) {
            const c = el.content && typeof el.content === 'object' ? el.content : {};
            // Los elementos del editor PowerPoint se distinguen por content.rect.
            // Los rectángulos se persisten como banner porque es un tipo válido de la tabla.
            let type = c.presentation_type || el.element_type;
            if (c.rect && el.element_type === 'banner') type = 'rect';
            // Campos de geometría en content
            const rect = c.rect || { x_pct: 30, y_pct: 30, w_pct: 20, h_pct: 20 };
            return {
                tempId: 'srv_' + el.element_id,
                element_id: el.element_id,
                type: type,
                background_image: c.background_image || '',
                background_fit: c.background_fit || 'fill',
                background_color: c.background_color || '',
                text: c.text || '',
                text_size_pct: c.text_size_pct || 4,
                text_color: c.text_color || '#ffffff',
                text_pos_h: c.text_pos_h || 'center',
                text_pos_v: c.text_pos_v || 'middle',
                text_offset_x: c.text_offset_x || 0,
                text_offset_y: c.text_offset_y || 0,
                animation: c.animation || el.animation || 'none',
                z_index: el.z_index || 1,
                rect: rect
            };
        }

        function createDemo() {
            elements = [
                {
                    tempId: 'tmp_demo_bg', type: 'rect',
                    background_image: 'https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1600&h=900&fit=crop',
                    background_fit: 'fill', background_color: '',
                    text: '', text_size_pct: 5, text_color: '#fff',
                    text_pos_h: 'center', text_pos_v: 'middle', text_offset_x: 0, text_offset_y: 0,
                    animation: 'none', z_index: 1,
                    rect: { x_pct: 0, y_pct: 0, w_pct: 100, h_pct: 100 }
                },
                {
                    tempId: 'tmp_demo_title', type: 'text',
                    background_image: '', background_fit: 'fill', background_color: 'rgba(0,0,0,0.5)',
                    text: 'BIENVENIDO A NUESTRO RESTAURANTE', text_size_pct: 5, text_color: '#ffffff',
                    text_pos_h: 'center', text_pos_v: 'middle', text_offset_x: 0, text_offset_y: -120,
                    animation: 'fade_in', z_index: 2,
                    rect: { x_pct: 20, y_pct: 15, w_pct: 60, h_pct: 15 }
                },
                {
                    tempId: 'tmp_demo_card', type: 'rect',
                    background_image: 'https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=800&h=600&fit=crop',
                    background_fit: 'cover', background_color: '',
                    text: 'HAMBURGUESA CLASICA\n$89', text_size_pct: 3.5, text_color: '#fff',
                    text_pos_h: 'center', text_pos_v: 'bottom', text_offset_x: 0, text_offset_y: -30,
                    animation: 'fade_in', z_index: 3,
                    rect: { x_pct: 8, y_pct: 55, w_pct: 38, h_pct: 35 }
                },
                {
                    tempId: 'tmp_demo_card2', type: 'rect',
                    background_image: 'https://images.unsplash.com/photo-1604068549290-dea0e4a3057e?w=800&h=600&fit=crop',
                    background_fit: 'cover', background_color: '',
                    text: 'PIZZA MARGHERITA\n$129', text_size_pct: 3.5, text_color: '#fff',
                    text_pos_h: 'center', text_pos_v: 'bottom', text_offset_x: 0, text_offset_y: -30,
                    animation: 'slide_up', z_index: 4,
                    rect: { x_pct: 54, y_pct: 55, w_pct: 38, h_pct: 35 }
                },
                {
                    tempId: 'tmp_demo_promo', type: 'text',
                    background_image: '', background_fit: 'fill', background_color: '#e11d48',
                    text: '2x1 EN BEBIDAS TODA LA SEMANA', text_size_pct: 3, text_color: '#fff',
                    text_pos_h: 'center', text_pos_v: 'middle', text_offset_x: 0, text_offset_y: 0,
                    animation: 'fade_in', z_index: 5,
                    rect: { x_pct: 10, y_pct: 93, w_pct: 80, h_pct: 6 }
                }
            ];
            selectedId = null;
        }

        // ===== Render =====
        function render() {
            renderCanvas();
            renderLayers();
            renderProps();
        }

        function renderCanvas() {
            const frame = $('canvasFrame');
            frame.innerHTML = '';
            const placeholder = document.createElement('div');
            placeholder.className = 'placeholder-hint';
            placeholder.textContent = 'Agrega un elemento para comenzar';
            frame.appendChild(placeholder);

            if (elements.length === 0) return;
            placeholder.style.display = 'none';

            // Ordenar por z_index
            const sorted = [...elements].sort((a, b) => a.z_index - b.z_index);
            sorted.forEach(el => {
                const div = buildElementDiv(el);
                frame.appendChild(div);
            });
            attachInteract();
        }

        function buildElementDiv(el) {
            const div = document.createElement('div');
            div.className = 'ppt-el' + (selectedId === el.tempId ? ' selected' : '');
            div.dataset.id = el.tempId;
            div.style.zIndex = el.z_index;
            const r = el.rect;
            div.style.left = r.x_pct + '%';
            div.style.top = r.y_pct + '%';
            div.style.width = r.w_pct + '%';
            div.style.height = r.h_pct + '%';

            let html = '';
            // Fondo
            if (el.background_image) {
                html += `<div class="el-bg bg-${el.background_fit}" style="background-image:url('${esc(el.background_image)}');"></div>`;
            }
            if (el.background_color && !el.background_image) {
                html += `<div class="el-bg" style="background:${esc(el.background_color)};"></div>`;
            }
            // Contenido (texto)
            html += `<div class="el-content" style="justify-content:${hJustify(el.text_pos_h)}; align-items:${vAlign(el.text_pos_v)}; padding:0;">`;
            if (el.type === 'text' || el.type === 'rect') {
                if (el.text) {
                    const sizePx = (el.text_size_pct / 100) * BOARD_HEIGHT;
                    html += `<div class="el-text" style="font-size:${sizePx}px; color:${esc(el.text_color)}; transform:translate(${el.text_offset_x}px, ${el.text_offset_y}px); white-space:pre-line; text-align:${el.text_pos_h};">${esc(el.text)}</div>`;
                } else if (el.type === 'text') {
                    html += `<div class="el-text" style="font-size:24px; color:${esc(el.text_color)};">Texto</div>`;
                }
            }
            html += `</div>`;
            // Resizers
            const dirs = ['nw','n','ne','e','se','s','sw','w'];
            html += dirs.map(d => `<div class="resizer ${d}" data-dir="${d}"></div>`).join('');
            div.innerHTML = html;
            return div;
        }

        function hJustify(h) { return { left: 'flex-start', center: 'center', right: 'flex-end' }[h] || 'center'; }
        function vAlign(v) { return { top: 'flex-start', middle: 'center', bottom: 'flex-end' }[v] || 'center'; }

        // ===== Interact.js: drag & resize =====
        function attachInteract() {
            // Limpiar interacciones previas
            interact('#canvasFrame .ppt-el').unset();

            interact('#canvasFrame .ppt-el')
                .draggable({
                    listeners: {
                        move: (event) => {
                            const id = event.target.dataset.id;
                            const el = elements.find(e => e.tempId === id);
                            if (!el) return;
                            const frame = $('canvasFrame');
                            const fw = frame.clientWidth;
                            const fh = frame.clientHeight;
                            el.rect.x_pct = clamp(el.rect.x_pct + (event.dx / fw * 100), 0, 100 - el.rect.w_pct);
                            el.rect.y_pct = clamp(el.rect.y_pct + (event.dy / fh * 100), 0, 100 - el.rect.h_pct);
                            event.target.style.left = el.rect.x_pct + '%';
                            event.target.style.top = el.rect.y_pct + '%';
                        },
                        end: () => { renderProps(); }
                    }
                })
                .resizable({
                    edges: { left: true, right: true, bottom: true, top: true },
                    listeners: {
                        move: (event) => {
                            const target = event.target;
                            const id = target.dataset.id;
                            const el = elements.find(e => e.tempId === id);
                            if (!el) return;
                            const frame = $('canvasFrame');
                            const fw = frame.clientWidth;
                            const fh = frame.clientHeight;
                            const rect = el.rect;
                            // Nuevo ancho/alto en %
                            let w = (event.rect.width / fw) * 100;
                            let h = (event.rect.height / fh) * 100;
                            // event.rect is viewport-relative; convert it to canvas-relative coordinates
                            const frameBox = frame.getBoundingClientRect();
                            let x = ((event.rect.left - frameBox.left) / fw) * 100;
                            let y = ((event.rect.top - frameBox.top) / fh) * 100;
                            if (w < 2) w = 2;
                            if (h < 2) h = 2;
                            rect.w_pct = w;
                            rect.h_pct = h;
                            rect.x_pct = clamp(x, 0, 100 - w);
                            rect.y_pct = clamp(y, 0, 100 - h);
                            // Aplicar
                            target.style.width = w + '%';
                            target.style.height = h + '%';
                            target.style.left = rect.x_pct + '%';
                            target.style.top = rect.y_pct + '%';
                        },
                        end: () => { renderProps(); }
                    }
                });
        }

        // ===== Selección =====
        $('canvasFrame').addEventListener('mousedown', (e) => {
            const ppt = e.target.closest('.ppt-el');
            if (ppt) {
                selectedId = ppt.dataset.id;
                render();
            } else {
                selectedId = null;
                render();
            }
        });

        // ===== Capas =====
        function renderLayers() {
            const list = $('layerList');
            const sorted = [...elements].sort((a, b) => a.z_index - b.z_index);
            list.innerHTML = sorted.map(el => `
                <li class="layer-item ${selectedId === el.tempId ? 'active' : ''}" data-id="${el.tempId}">
                    <i class="fas ${elTypeIcon(el.type)}"></i>
                    <span class="layer-name">${esc(el.text.split('\n')[0] || elTypeLabel(el.type))}</span>
                </li>
            `).join('');
            list.querySelectorAll('.layer-item').forEach(li => {
                li.addEventListener('click', () => { selectedId = li.dataset.id; renderCanvas(); renderProps(); renderLayers(); });
            });
        }

        // ===== Agregar elemento =====
        document.querySelectorAll('[data-add]').forEach(btn => {
            btn.addEventListener('click', () => addElement(btn.dataset.add));
        });

        function addElement(type) {
            seq++;
            const el = {
                tempId: 'tmp_' + seq,
                type: type,
                background_image: '', background_fit: 'fill', background_color: '',
                text: type === 'text' ? 'Nuevo texto' : (type === 'image' ? '' : ''),
                text_size_pct: 5, text_color: '#ffffff',
                text_pos_h: 'center', text_pos_v: 'middle', text_offset_x: 0, text_offset_y: 0,
                animation: 'none', z_index: (elements.length ? Math.max(...elements.map(e => e.z_index)) : 0) + 1,
                rect: { x_pct: 30, y_pct: 30, w_pct: 20, h_pct: 20 }
            };
            if (type === 'rect') el.background_color = '#2563eb';
            if (type === 'image') { el.background_color = '#334155'; }
            elements.push(el);
            selectedId = el.tempId;
            render();
        }

        // ===== Propiedades =====
        function renderProps() {
            const container = $('propsContent');
            if (!selectedId) {
                container.innerHTML = `<div class="empty-props">Selecciona un elemento para editarlo</div>`;
                return;
            }
            const el = elements.find(e => e.tempId === selectedId);
            if (!el) { container.innerHTML = ''; return; }

            let html = '';
            // Encabezado
            html += `<div class="prop-section">
                <div style="display:flex; align-items:center; gap:0.5rem;">
                    <i class="fas ${elTypeIcon(el.type)}" style="color:var(--primary-color);"></i>
                    <strong>${elTypeLabel(el.type)}</strong>
                </div>
            </div>`;

            // Tamaño y posición
            html += `<div class="prop-section">
                <div class="tool-row">
                    <div class="tool-group"><label>X (%)</label><input type="number" id="pf-x" value="${Math.round(el.rect.x_pct)}" min="0" step="0.5"></div>
                    <div class="tool-group"><label>Y (%)</label><input type="number" id="pf-y" value="${Math.round(el.rect.y_pct)}" min="0" step="0.5"></div>
                </div>
                <div class="tool-row">
                    <div class="tool-group"><label>Ancho (%)</label><input type="number" id="pf-w" value="${Math.round(el.rect.w_pct)}" min="2" step="0.5"></div>
                    <div class="tool-group"><label>Alto (%)</label><input type="number" id="pf-h" value="${Math.round(el.rect.h_pct)}" min="2" step="0.5"></div>
                </div>
            </div>`;

            // Fondo
            if (el.type === 'rect' || el.type === 'image' || el.type === 'text') {
                html += `<div class="prop-section">
                    <div class="tool-group"><label>Imagen de fondo (URL)</label>
                        <input type="text" id="pf-bgimg" value="${esc(el.background_image)}">
                        <div class="img-preview" id="pf-bgprev" style="${el.background_image ? `background-image:url('${esc(el.background_image)}')` : 'display:none;'}"></div>
                    </div>
                    <div class="tool-group"><label>Ajuste de imagen</label>
                        <select id="pf-bgfit">
                            <option value="fill" ${el.background_fit==='fill'?'selected':''}>Llenar (fill)</option>
                            <option value="cover" ${el.background_fit==='cover'?'selected':''}>Cubrir (cover)</option>
                            <option value="contain" ${el.background_fit==='contain'?'selected':''}>Contener (contain)</option>
                        </select>
                    </div>
                    <div class="tool-group"><label>Color de fondo</label>
                        <input type="text" id="pf-bgcolor" value="${el.background_color}" placeholder="#000000">
                    </div>
                </div>`;
            }

            // Texto
            if (el.type === 'text' || el.type === 'rect') {
                html += `<div class="prop-section">
                    <div class="tool-group"><label>Texto</label>
                        <textarea id="pf-text">${esc(el.text)}</textarea>
                    </div>
                    <div class="tool-group"><label>Tamaño de texto (%) <span id="pf-sizeval" style="color:var(--text-muted);">${el.text_size_pct}</span></label>
                        <input type="range" id="pf-textsize" min="1" max="20" step="0.5" value="${el.text_size_pct}">
                    </div>
                    <div class="tool-row">
                        <div class="tool-group"><label>Color</label><input type="text" id="pf-textcolor" value="${esc(el.text_color)}" placeholder="#ffffff"></div>
                    </div>
                    <div class="tool-group"><label>Posición del texto</label>
                        <div class="pos-hint">
                            ${[['center','center','CC'],['left','center','LC'],['right','center','RC'],['center','top','CT'],['center','bottom','CB']].map(([h,v,l]) =>
                                `<button class="pos-btn ${el.text_pos_h===h && el.text_pos_v===v?'active':''}" data-ph="${h}" data-pv="${v}">${l}</button>`
                            ).join('')}
                        </div>
                    </div>
                    <div class="tool-row">
                        <div class="tool-group"><label>Offset X</label><input type="number" id="pf-texoffx" value="${el.text_offset_x}"></div>
                        <div class="tool-group"><label>Offset Y</label><input type="number" id="pf-texoffy" value="${el.text_offset_y}"></div>
                    </div>
                </div>`;
            }

            // Animación
            html += `<div class="prop-section">
                <div class="tool-group"><label>Animación</label>
                    <select id="pf-anim">
                        <option value="none" ${el.animation==='none'?'selected':''}>Ninguna</option>
                        <option value="fade_in" ${el.animation==='fade_in'?'selected':''}>Aparecer</option>
                        <option value="slide_up" ${el.animation==='slide_up'?'selected':''}>Subir</option>
                        <option value="slide_left" ${el.animation==='slide_left'?'selected':''}>Deslizar izq</option>
                        <option value="scale_in" ${el.animation==='scale_in'?'selected':''}>Escalar</option>
                    </select>
                </div>
            </div>`;

            container.innerHTML = html;

            // Bind events
            bindProp('pf-text', el, (v, e) => { e.text = v; renderCanvas(); renderLayers(); });
            bindPropNum('pf-x', el, (v, e) => { e.rect.x_pct = v; renderCanvas(); });
            bindPropNum('pf-y', el, (v, e) => { e.rect.y_pct = v; renderCanvas(); });
            bindPropNum('pf-w', el, (v, e) => { e.rect.w_pct = v; renderCanvas(); });
            bindPropNum('pf-h', el, (v, e) => { e.rect.h_pct = v; renderCanvas(); });
            bindProp('pf-bgimg', el, (v, e) => { e.background_image = v; const p=$('pf-bgprev'); if(v){p.style.backgroundImage=`url('${v}')`;p.style.display='';}else{p.style.display='none';} renderCanvas(); });
            $('pf-bgfit') && $('pf-bgfit').addEventListener('change', (ev) => { el.background_fit = ev.target.value; renderCanvas(); });
            bindProp('pf-bgcolor', el, (v, e) => { e.background_color = v; if(!e.background_image) renderCanvas(); });
            bindProp('pf-textcolor', el, (v, e) => { e.text_color = v; renderCanvas(); });
            $('pf-textsize') && $('pf-textsize').addEventListener('input', (ev) => { el.text_size_pct = parseFloat(ev.target.value); $('pf-sizeval').textContent = parseFloat(ev.target.value); renderCanvas(); });
            bindPropNum('pf-texoffx', el, (v, e) => { e.text_offset_x = v; renderCanvas(); });
            bindPropNum('pf-texoffy', el, (v, e) => { e.text_offset_y = v; renderCanvas(); });
            $('pf-anim') && $('pf-anim').addEventListener('change', (ev) => { el.animation = ev.target.value; });
            // Posicion
            container.querySelectorAll('[data-ph]').forEach(btn => {
                btn.addEventListener('click', () => {
                    el.text_pos_h = btn.dataset.ph;
                    el.text_pos_v = btn.dataset.pv;
                    renderCanvas();
                    renderProps();
                });
            });
        }

        function bindProp(id, el, apply) {
            const inp = $(id);
            if (!inp) return;
            inp.addEventListener('input', (e) => apply(e.target.value, el));
        }
        function bindPropNum(id, el, apply) {
            const inp = $(id);
            if (!inp) return;
            inp.addEventListener('change', (e) => {
                let v = parseFloat(e.target.value);
                if (isNaN(v)) v = 0;
                apply(v, el);
            });
        }

        // ===== Guardar =====
        $('btnSave').addEventListener('click', save);
        $('btnBack').addEventListener('click', () => window.location.href = 'digital-signage.html');

        async function save() {
            if (!slides[currentSlide]) { notify('No hay slide', 'error'); return; }
            const slideId = slides[currentSlide].slide_id;
            notify('Guardando...', 'success');

            // Borrar existentes
            const existing = await api(`slide_elements/read.php?slide_id=${slideId}`);
            if (existing.success) {
                for (const el of existing.data) {
                    await api('slide_elements/delete.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ element_id: el.element_id })
                    });
                }
            }

            // Guardar cada elemento
            let ok = 0;
            for (const el of elements) {
                const content = {
                    presentation_type: el.type,
                    rect: el.rect,
                    background_image: el.background_image,
                    background_fit: el.background_fit,
                    background_color: el.background_color,
                    text: el.text,
                    text_size_pct: el.text_size_pct,
                    text_color: el.text_color,
                    text_pos_h: el.text_pos_h,
                    text_pos_v: el.text_pos_v,
                    text_offset_x: el.text_offset_x,
                    text_offset_y: el.text_offset_y,
                    animation: el.animation,
                    z_index: el.z_index
                };
                // La tabla usa tipos existentes: rectángulos se almacenan como banner.
                const storageType = el.type === 'rect' ? 'banner' : (el.type === 'video' ? 'image' : el.type);
                const res = await api('slide_elements/create.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        slide_id: slideId,
                        element_type: storageType,
                        grid_col: 1, grid_row: 1, col_span: 1, row_span: 1,
                        z_index: el.z_index,
                        content: content,
                        animation: el.animation === 'none' ? 'fade_in' : el.animation,
                        animation_delay: 0
                    })
                });
                if (res.success) ok++;
            }
            notify(`Guardados ${ok} elementos`, ok === elements.length ? 'success' : 'error');
        }

        // Escalar canvas al viewport manteniendo relación
        function fitCanvas() {
            const wrap = $('canvasWrap');
            const frame = $('canvasFrame');
            const availW = wrap.clientWidth - 60;
            const availH = wrap.clientHeight - 60;
            const scale = Math.min(availW / BOARD_WIDTH, availH / BOARD_HEIGHT);
            frame.style.width = (BOARD_WIDTH * scale) + 'px';
            frame.style.height = (BOARD_HEIGHT * scale) + 'px';
        }
        window.addEventListener('resize', fitCanvas);

        init();
        setTimeout(fitCanvas, 100);
    </script>
</body>
</html>
