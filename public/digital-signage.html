<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Pantallas Digitales - Tomodachi</title>
    <link rel="stylesheet" href="css/fonts.css?v=4">
    <link rel="stylesheet" href="lib/fontawesome/css/all.min.css?v=4">
    <link rel="stylesheet" href="css/main.css?v=4">
    <link rel="stylesheet" href="css/sidebar-modern.css?v=4">
    <link rel="stylesheet" href="css/mobile-nav.css?v=4">
    <script src="js/theme-init.js"></script>
    <style>
        :root {
            --ds-primary: #6366f1;
            --ds-primary-dark: #4f46e5;
            --ds-success: #10b981;
            --ds-warning: #f59e0b;
            --ds-danger: #ef4444;
            --ds-bg: #f8fafc;
            --ds-card: #ffffff;
            --ds-border: #e2e8f0;
            --ds-text: #1e293b;
            --ds-text-muted: #64748b;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            background: var(--ds-bg);
        }
        
        .ds-studio {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: calc(100vh - 64px);
            gap: 0;
        }
        
        /* Panel Izquierdo - Lista de Boards */
        .ds-sidebar {
            background: var(--ds-card);
            border-right: 1px solid var(--ds-border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .ds-sidebar-header {
            padding: 1.5rem;
            border-bottom: 1px solid var(--ds-border);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .ds-sidebar-header h2 {
            margin: 0 0 0.5rem 0;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .ds-sidebar-header p {
            margin: 0;
            font-size: 0.85rem;
            opacity: 0.9;
        }
        
        .ds-boards-list {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }
        
        .ds-board-item {
            background: var(--ds-bg);
            border: 2px solid transparent;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .ds-board-item:hover {
            border-color: var(--ds-primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.15);
        }
        
        .ds-board-item.active {
            border-color: var(--ds-primary);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.05), rgba(118, 75, 162, 0.05));
        }
        
        .ds-board-item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 0.5rem;
        }
        
        .ds-board-item-title {
            font-weight: 600;
            font-size: 1rem;
            color: var(--ds-text);
            margin: 0;
        }
        
        .ds-board-item-status {
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        
        .ds-status-active {
            background: var(--ds-success);
            color: white;
        }
        
        .ds-status-inactive {
            background: var(--ds-text-muted);
            color: white;
        }
        
        .ds-board-item-meta {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: var(--ds-text-muted);
        }
        
        .ds-board-item-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }
        
        .ds-board-item-actions button {
            flex: 1;
            padding: 0.4rem;
            border: none;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-edit {
            background: var(--ds-primary);
            color: white;
        }
        
        .btn-preview {
            background: #8b5cf6;
            color: white;
        }
        
        .btn-delete {
            background: var(--ds-danger);
            color: white;
        }
        
        .ds-new-board-btn {
            margin: 1rem;
            padding: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }
        
        .ds-new-board-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }
        
        /* Panel Derecho - Editor */
        .ds-editor {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .ds-editor-header {
            padding: 1.5rem 2rem;
            background: var(--ds-card);
            border-bottom: 1px solid var(--ds-border);
        }
        
        .ds-editor-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--ds-text);
            margin: 0 0 0.5rem 0;
        }
        
        .ds-editor-desc {
            color: var(--ds-text-muted);
            margin: 0;
        }
        
        .ds-editor-content {
            flex: 1;
            overflow-y: auto;
            padding: 2rem;
        }
        
        .ds-empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--ds-text-muted);
        }
        
        .ds-empty-state i {
            font-size: 5rem;
            margin-bottom: 1.5rem;
            opacity: 0.3;
        }
        
        .ds-empty-state h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
            color: var(--ds-text);
        }
        
        /* Modal Mejorado */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            z-index: 10000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 0;
            max-width: 700px;
            width: 90%;
            max-height: 90vh;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: modalSlideIn 0.3s ease-out;
        }
        
        @keyframes modalSlideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        
        .modal-close {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        
        .modal-body {
            padding: 2rem;
            overflow-y: auto;
            max-height: calc(90vh - 200px);
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--ds-text);
            font-size: 0.9rem;
        }
        
        .form-label i {
            margin-right: 0.5rem;
            color: var(--ds-primary);
        }
        
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 2px solid var(--ds-border);
            border-radius: 8px;
            background: white;
            color: var(--ds-text);
            font-size: 1rem;
            transition: all 0.2s;
        }
        
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--ds-primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }
        
        .form-textarea {
            resize: vertical;
            min-height: 80px;
            font-family: inherit;
        }
        
        .form-checkbox {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: var(--ds-bg);
            border-radius: 8px;
        }
        
        .form-checkbox input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        
        .form-checkbox label {
            cursor: pointer;
            font-weight: 500;
        }
        
        .form-hint {
            display: block;
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: var(--ds-text-muted);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }
        
        .modal-footer {
            padding: 1.5rem 2rem;
            background: var(--ds-bg);
            border-top: 1px solid var(--ds-border);
            display: flex;
            gap: 1rem;
        }
        
        .btn-cancel {
            flex: 1;
            padding: 0.85rem;
            background: white;
            color: var(--ds-text);
            border: 2px solid var(--ds-border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn-cancel:hover {
            background: var(--ds-bg);
            border-color: var(--ds-text-muted);
        }
        
        .btn-save {
            flex: 1;
            padding: 0.85rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
        }
        
        /* Responsive */
        @media (max-width: 1024px) {
            .ds-studio {
                grid-template-columns: 1fr;
            }
            
            .ds-sidebar {
                max-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="sidebar-close" id="sidebarClose"><i class="fas fa-times"></i></button>
                <h2>Tomodachi</h2>
            </div>
            <nav class="sidebar-nav"></nav>
        </aside>
        
        <main class="main-content">
            <div class="ds-studio">
                <!-- Panel Izquierdo - Lista de Boards -->
                <aside class="ds-sidebar">
                    <div class="ds-sidebar-header">
                        <h2><i class="fas fa-tv"></i> Mis Pantallas</h2>
                        <p>Gestiona tus pantallas digitales</p>
                    </div>
                    
                    <div class="ds-boards-list" id="boardsList">
                        <!-- Boards cargados dinámicamente -->
                    </div>
                    
                    <button class="ds-new-board-btn" id="btnCreateBoard">
                        <i class="fas fa-plus-circle"></i> Nueva Pantalla
                    </button>
                </aside>
                
                <!-- Panel Derecho - Editor -->
                <section class="ds-editor">
                    <div id="editorContent">
                        <div class="ds-empty-state">
                            <i class="fas fa-tv"></i>
                            <h3>Selecciona una pantalla para editar</h3>
                            <p>O crea una nueva pantalla para comenzar</p>
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>
    
    <!-- Modal Crear/Editar Board -->
    <div class="modal-overlay" id="boardModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">
                    <i class="fas fa-magic"></i>
                    <span id="modalTitle">Nueva Pantalla</span>
                </h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            
            <form id="boardForm">
                <div class="modal-body">
                    <input type="hidden" id="boardId">
                    
                    <div class="form-group">
                        <label class="form-label" for="boardName">
                            <i class="fas fa-heading"></i> Nombre de la Pantalla
                        </label>
                        <input type="text" id="boardName" class="form-input" required maxlength="100" placeholder="Ej: Menú Principal, Ofertas del Día">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="boardDesc">
                            <i class="fas fa-align-left"></i> Descripción
                        </label>
                        <textarea id="boardDesc" class="form-textarea" placeholder="Describe el propósito de esta pantalla..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="boardTemplate">
                            <i class="fas fa-th-large"></i> Plantilla
                        </label>
                        <select id="boardTemplate" class="form-select">
                            <option value="">Personalizado</option>
                            <option value="restaurant">🍽 Restaurante / Cafetería</option>
                            <option value="retail">🛒 Tienda / Autoservicio</option>
                            <option value="pharmacy">💊 Farmacia</option>
                            <option value="clothing">👕 Tienda de Ropa</option>
                            <option value="entertainment">🎬 Entretenimiento</option>
                        </select>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="boardOrientation">
                                <i class="fas fa-mobile-alt"></i> Orientación
                            </label>
                            <select id="boardOrientation" class="form-select">
                                <option value="auto">🔄 Auto (detectar)</option>
                                <option value="horizontal">📺 Horizontal (TV)</option>
                                <option value="vertical">📱 Vertical</option>
                            </select>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="boardDuration">
                                <i class="fas fa-clock"></i> Duración (segundos)
                            </label>
                            <input type="number" id="boardDuration" class="form-input" min="3" max="300" value="10">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="boardTransition">
                            <i class="fas fa-exchange-alt"></i> Transición entre Slides
                        </label>
                        <select id="boardTransition" class="form-select">
                            <option value="fade">✨ Difuminado (fade)</option>
                            <option value="slide_left">← Deslizar Izquierda</option>
                            <option value="slide_up">↑ Deslizar Arriba</option>
                            <option value="zoom">🔍 Zoom</option>
                            <option value="none">⚡ Sin transición</option>
                        </select>
                    </div>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="form-label" for="boardStart">
                                <i class="fas fa-calendar-check"></i> Activación Programada
                            </label>
                            <input type="datetime-local" id="boardStart" class="form-input">
                            <small class="form-hint">Dejar vacío para activar manualmente</small>
                        </div>
                        
                        <div class="form-group">
                            <label class="form-label" for="boardEnd">
                                <i class="fas fa-calendar-times"></i> Desactivación Programada
                            </label>
                            <input type="datetime-local" id="boardEnd" class="form-input">
                            <small class="form-hint">Dejar vacío para mantener activo</small>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="form-checkbox">
                            <input type="checkbox" id="boardShowQr" checked>
                            <label for="boardShowQr">
                                <i class="fas fa-qrcode"></i> Mostrar código QR en pantalla
                            </label>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="form-checkbox">
                            <input type="checkbox" id="boardActive">
                            <label for="boardActive">
                                <i class="fas fa-power-off"></i> Activar inmediatamente
                            </label>
                        </div>
                    </div>
                </div>
                
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn-save">
                        <i class="fas fa-save"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="js/sidebar-loader.js?v=4"></script>
    <script>
        const API_BASE = '../api';
        let boards = [];
        let selectedBoard = null;
        
        async function loadBoards() {
            try {
                const response = await fetch(`${API_BASE}/digital_boards/read.php`, {
                    credentials: 'include'
                });
                const data = await response.json();
                
                if (data.success) {
                    boards = data.data;
                    renderBoardsList();
                } else {
                    alert('Error al cargar pantallas: ' + data.message);
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error de conexión');
            }
        }
        
        function renderBoardsList() {
            const list = document.getElementById('boardsList');
            
            if (boards.length === 0) {
                list.innerHTML = `
                    <div style="text-align: center; padding: 2rem; color: var(--ds-text-muted);">
                        <i class="fas fa-inbox" style="font-size: 3rem; opacity: 0.3; margin-bottom: 1rem;"></i>
                        <p>No hay pantallas creadas</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = boards.map(board => {
                const statusClass = board.is_active == 1 ? 'ds-status-active' : 'ds-status-inactive';
                const statusText = board.is_active == 1 ? 'Activa' : 'Inactiva';
                const isActive = selectedBoard && selectedBoard.board_id === board.board_id;
                
                return `
                    <div class="ds-board-item ${isActive ? 'active' : ''}" onclick="selectBoard(${board.board_id})">
                        <div class="ds-board-item-header">
                            <h3 class="ds-board-item-title">${escapeHtml(board.name)}</h3>
                            <span class="ds-board-item-status ${statusClass}">${statusText}</span>
                        </div>
                        <p style="margin: 0 0 0.5rem 0; font-size: 0.85rem; color: var(--ds-text-muted);">
                            ${escapeHtml(board.description || 'Sin descripción')}
                        </p>
                        <div class="ds-board-item-meta">
                            <span><i class="fas fa-mobile-alt"></i> ${getOrientationLabel(board.orientation)}</span>
                            <span><i class="fas fa-clock"></i> ${board.slide_duration}s</span>
                        </div>
                        <div class="ds-board-item-actions">
                            <button class="btn-edit" onclick="event.stopPropagation(); editBoard(${board.board_id})">
                                <i class="fas fa-edit"></i> Editar
                            </button>
                            <button class="btn-preview" onclick="event.stopPropagation(); previewBoard(${board.board_id})">
                                <i class="fas fa-eye"></i> Ver
                            </button>
                            <button class="btn-delete" onclick="event.stopPropagation(); deleteBoard(${board.board_id})">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        function selectBoard(boardId) {
            selectedBoard = boards.find(b => b.board_id === boardId);
            renderBoardsList();
            renderEditor();
        }
        
        function renderEditor() {
            const editor = document.getElementById('editorContent');
            
            if (!selectedBoard) {
                editor.innerHTML = `
                    <div class="ds-empty-state">
                        <i class="fas fa-tv"></i>
                        <h3>Selecciona una pantalla para editar</h3>
                        <p>O crea una nueva pantalla para comenzar</p>
                    </div>
                `;
                return;
            }
            
            editor.innerHTML = `
                <div class="ds-editor-header">
                    <h1 class="ds-editor-title">${escapeHtml(selectedBoard.name)}</h1>
                    <p class="ds-editor-desc">${escapeHtml(selectedBoard.description || 'Sin descripción')}</p>
                </div>
                <div class="ds-editor-content">
                    <div style="background: white; padding: 2rem; border-radius: 12px; margin-bottom: 1.5rem;">
                        <h3 style="margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
                            <i class="fas fa-info-circle" style="color: var(--ds-primary);"></i>
                            Configuración de la Pantalla
                        </h3>
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem;">
                            <div>
                                <div style="font-size: 0.85rem; color: var(--ds-text-muted); margin-bottom: 0.25rem;">Orientación</div>
                                <div style="font-weight: 600;">${getOrientationLabel(selectedBoard.orientation)}</div>
                            </div>
                            <div>
                                <div style="font-size: 0.85rem; color: var(--ds-text-muted); margin-bottom: 0.25rem;">Duración</div>
                                <div style="font-weight: 600;">${selectedBoard.slide_duration} segundos</div>
                            </div>
                            <div>
                                <div style="font-size: 0.85rem; color: var(--ds-text-muted); margin-bottom: 0.25rem;">Transición</div>
                                <div style="font-weight: 600;">${getTransitionLabel(selectedBoard.transition_animation)}</div>
                            </div>
                            <div>
                                <div style="font-size: 0.85rem; color: var(--ds-text-muted); margin-bottom: 0.25rem;">Código QR</div>
                                <div style="font-weight: 600;">${selectedBoard.show_qr == 1 ? 'Sí' : 'No'}</div>
                            </div>
                        </div>
                    </div>
                    
                    <div style="background: white; padding: 2rem; border-radius: 12px;">
                        <h3 style="margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
                            <i class="fas fa-layer-group" style="color: var(--ds-primary);"></i>
                            Slides y Elementos
                        </h3>
                        <p style="color: var(--ds-text-muted); margin-bottom: 1.5rem;">
                            Aquí podrás agregar slides y elementos a tu pantalla. Esta funcionalidad estará disponible próximamente.
                        </p>
                        <div style="text-align: center; padding: 3rem; background: var(--ds-bg); border-radius: 8px;">
                            <i class="fas fa-tools" style="font-size: 3rem; opacity: 0.3; margin-bottom: 1rem;"></i>
                            <p style="color: var(--ds-text-muted);">Editor visual de slides en desarrollo</p>
                        </div>
                    </div>
                </div>
            `;
        }
        
        function getOrientationLabel(val) {
            const labels = {
                'auto': '🔄 Automática',
                'horizontal': '📺 Horizontal',
                'vertical': '📱 Vertical'
            };
            return labels[val] || val;
        }
        
        function getTransitionLabel(val) {
            const labels = {
                'fade': '✨ Difuminado',
                'slide_left': '← Deslizar Izq',
                'slide_up': '↑ Deslizar Arr',
                'zoom': '🔍 Zoom',
                'none': '⚡ Sin transición'
            };
            return labels[val] || val;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text || '';
            return div.innerHTML;
        }
        
        function openModal(board = null) {
            const modal = document.getElementById('boardModal');
            const form = document.getElementById('boardForm');
            const title = document.getElementById('modalTitle');
            
            form.reset();
            
            if (board) {
                title.textContent = 'Editar Pantalla';
                document.getElementById('boardId').value = board.board_id;
                document.getElementById('boardName').value = board.name || '';
                document.getElementById('boardDesc').value = board.description || '';
                document.getElementById('boardTemplate').value = board.template || '';
                document.getElementById('boardOrientation').value = board.orientation || 'auto';
                document.getElementById('boardDuration').value = board.slide_duration || 10;
                document.getElementById('boardTransition').value = board.transition_animation || 'fade';
                document.getElementById('boardStart').value = board.scheduled_start ? board.scheduled_start.slice(0, 16) : '';
                document.getElementById('boardEnd').value = board.scheduled_end ? board.scheduled_end.slice(0, 16) : '';
                document.getElementById('boardShowQr').checked = board.show_qr == 1;
                document.getElementById('boardActive').checked = board.is_active == 1;
            } else {
                title.textContent = 'Nueva Pantalla';
                document.getElementById('boardId').value = '';
            }
            
            modal.classList.add('active');
        }
        
        function closeModal() {
            document.getElementById('boardModal').classList.remove('active');
        }
        
        function editBoard(boardId) {
            const board = boards.find(b => b.board_id === boardId);
            if (board) openModal(board);
        }
        
        async function deleteBoard(boardId) {
            const board = boards.find(b => b.board_id === boardId);
            if (!board) return;
            
            if (!confirm(`¿Eliminar la pantalla "${board.name}"? Esta acción no se puede deshacer.`)) return;
            
            try {
                const response = await fetch(`${API_BASE}/digital_boards/delete.php`, {
                    method: 'POST',
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ board_id: boardId })
                });
                
                const data = await response.json();
                if (data.success) {
                    if (selectedBoard && selectedBoard.board_id === boardId) {
                        selectedBoard = null;
                    }
                    await loadBoards();
                    renderEditor();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                alert('Error de conexión');
            }
        }
        
        function previewBoard(boardId) {
            window.open(`/public/digital-signage-display.html?board=${boardId}`, '_blank');
        }
        
        document.getElementById('boardForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const boardId = document.getElementById('boardId').value;
            const data = {
                name: document.getElementById('boardName').value,
                description: document.getElementById('boardDesc').value,
                template: document.getElementById('boardTemplate').value || null,
                orientation: document.getElementById('boardOrientation').value,
                slide_duration: parseInt(document.getElementById('boardDuration').value),
                transition_animation: document.getElementById('boardTransition').value,
                scheduled_start: document.getElementById('boardStart').value || null,
                scheduled_end: document.getElementById('boardEnd').value || null,
                show_qr: document.getElementById('boardShowQr').checked ? 1 : 0,
                is_active: document.getElementById('boardActive').checked ? 1 : 0
            };
            
            try {
                const url = boardId ? `${API_BASE}/digital_boards/update.php` : `${API_BASE}/digital_boards/create.php`;
                const method = boardId ? 'PUT' : 'POST';
                
                if (boardId) data.board_id = boardId;
                
                const response = await fetch(url, {
                    method: method,
                    credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                const result = await response.json();
                if (result.success) {
                    closeModal();
                    await loadBoards();
                    if (result.data && result.data.board_id) {
                        selectBoard(result.data.board_id);
                    } else if (boardId) {
                        selectBoard(boardId);
                    }
                } else {
                    alert('Error: ' + result.message);
                }
            } catch (error) {
                alert('Error de conexión');
            }
        });
        
        document.getElementById('btnCreateBoard').addEventListener('click', () => openModal());
        
        loadBoards();
    </script>
</body>
</html>
