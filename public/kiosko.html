<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosko - Tomodachi</title>
    <link rel="stylesheet" href="lib/fontawesome/css/all.min.css?v=4">
    <link rel="stylesheet" href="css/fonts.css?v=4">
    <link rel="stylesheet" href="css/variables.css?v=6">
    <script src="js/theme-init.js?v=5"></script>
    <link rel="icon" type="image/svg+xml" href="assets/app-icons/tomodachi-favicon.svg">
    <link rel="manifest" href="manifest.json">
    <script src="js/format-utils.js"></script>
    <script src="js/ws-realtime.js"></script>
    <script src="lib/qrcodejs/qrcode.min.js"></script>
    <style>
        :root {
            /* El mismo inicio que el resto: theme-init/themeConfig lo reemplazan por la tienda. */
            --primary-color: #39C5BB;
            --bg-body: #10141a;
            --bg-card: #1a2027;
            --bg-light: #232a33;
            --text-color: #ecf0f3;
            --text-muted: #9aa4b0;
            --border-color: #2c343e;
            --success-color: #34c07a;
            --warning-color: #e2a03f;
            --danger-color: #e05b4d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body); color: var(--text-color);
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        button { font-family: inherit; cursor: pointer; }

        /* Cabecera: pensada para leerla de lejos. */
        .k-top {
            display: flex; align-items: center; gap: 18px;
            padding: 18px 26px; background: var(--bg-card); border-bottom: 1px solid var(--border-color);
            flex: 0 0 auto;
        }
        .k-top h1 { font-size: 1.5rem; font-weight: 700; }
        .k-top .k-cuenta { font-size: 1.1rem; color: var(--text-muted); }
        .k-top .k-cuenta strong { color: var(--primary-color); font-size: 1.6rem; margin-right: 4px; }
        .k-full {
            margin-left: auto; border: 1px solid var(--border-color); background: none;
            color: var(--text-muted); font-size: 1rem; padding: 10px 16px; border-radius: 10px;
            display: inline-flex; align-items: center; gap: 8px;
        }
        .k-full:hover { color: var(--primary-color); border-color: var(--primary-color); }

        /* Lista de pedidos: rejilla grande, legible de lejos. */
        .k-lista { flex: 1 1 auto; overflow-y: auto; padding: 20px 26px; display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; align-content: start; }
        .k-tarjeta {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px;
            padding: 18px; display: flex; flex-direction: column; gap: 12px;
        }
        .k-tarjeta.k-ready { border-left: 5px solid var(--success-color); }
        .k-tarjeta-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
        .k-folio { font-size: 1.7rem; font-weight: 800; color: var(--primary-color); }
        .k-nombre { font-size: 1.15rem; font-weight: 600; overflow-wrap: anywhere; }
        .k-estado { font-size: .85rem; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: var(--bg-light); }
        .k-ready .k-estado { background: var(--success-color); color: #06251a; }
        .k-items { display: flex; flex-direction: column; gap: 6px; }
        .k-item { display: flex; justify-content: space-between; gap: 8px; font-size: 1.05rem; color: var(--text-muted); }
        .k-item b { color: var(--text-color); }
        .k-pie { display: flex; align-items: center; justify-content: space-between; border-top: 1px dashed var(--border-color); padding-top: 10px; }
        .k-total { font-size: 1.5rem; font-weight: 800; }
        .k-tiempo { color: var(--text-muted); font-size: 1rem; }
        .k-tiempo i { margin-right: 5px; }

        /* Pedido destacado: una sola cosa en pantalla, todo el alto. */
        .k-pedido {
            flex: 1 1 auto; display: flex; flex-direction: column;
            padding: 22px 30px; gap: 14px; overflow-y: auto;
        }
        .k-pedido.hidden { display: none; }
        .k-volver { align-self: flex-start; border: 1px solid var(--border-color); background: none;
            color: var(--text-muted); font-size: 1rem; padding: 9px 14px; border-radius: 10px; display: inline-flex; gap: 8px; align-items: center; }
        .k-pedido-vivo {
            display: grid; grid-template-columns: minmax(0, 1fr) auto;
            gap: 24px; align-items: center; background: var(--bg-card);
            border: 1px solid var(--border-color); border-radius: 18px; padding: 24px 30px;
        }
        .k-pedido-info { display: flex; flex-direction: column; gap: 10px; }
        .k-pedido-info h2 { font-size: 1.6rem; }
        .k-pedido-folio { font-size: 2.6rem; font-weight: 800; color: var(--primary-color); }
        .k-pedido-estado { font-size: 1.15rem; font-weight: 700; }
        .k-pedido-tiempo { font-size: 1.3rem; color: var(--text-muted); }
        .k-pedido-tiempo strong { color: var(--text-color); font-variant-numeric: tabular-nums; }
        /* El QR con su marco blanco: lo escanea el cliente para entrar a su página. */
        .k-qr { background: #fff; padding: 14px; border-radius: 18px; }
        .k-qr.demasiado-grande { display: flex; justify-content: center; }
        .k-qr canvas, .k-qr img { max-width: 100%; height: auto; }
        .k-pedido-cuerpo { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 24px; }
        .k-pedido-cuerpo .k-items { font-size: 1.25rem; gap: 10px; }
        .k-pedido-cuerpo .k-item .k-precio { font-variant-numeric: tabular-nums; }
        .k-resumen { display: flex; flex-direction: column; gap: 10px; min-width: 260px; }
        .k-fila { display: flex; justify-content: space-between; font-size: 1.2rem; color: var(--text-muted); }
        .k-fila b { color: var(--text-color); }
        .k-fila.k-final { border-top: 1px dashed var(--border-color); padding-top: 12px; font-size: 1.5rem; }
        .k-fila.k-final b { color: var(--primary-color); }
        .k-pago { font-size: 1.1rem; padding: 10px 14px; border-radius: 10px; background: var(--bg-light); }
        .k-pago i { margin-right: 6px; }

        /* Hueco para el contenido en reposo (promociones, video, imágenes): se implementará
           después. Hasta entonces la pantalla simplemente queda con el fondo. */
        .k-reposo { flex: 1 1 auto; display: none; }
        .k-reposo.activo { display: flex; align-items: center; justify-content: center; }

        .k-vacio { flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 12px; color: var(--text-muted); font-size: 1.4rem; }
        .k-vacio i { font-size: 3rem; color: var(--border-color); }

        @media (max-width: 700px) {
            .k-pedido-vivo { grid-template-columns: 1fr; }
            .k-pedido-cuerpo { grid-template-columns: 1fr; }
            .k-resumen { min-width: 0; }
        }
    </style>
</head>
<body class="kiosko">
    <!-- Cabecera: cuántos esperan y cómo salir/entrar de pantalla completa. -->
    <header class="k-top">
        <h1><i class="fas fa-utensils" style="margin-right:10px; color:var(--primary-color);"></i>Tomodachi</h1>
        <span class="k-cuenta"><strong id="kCuenta">0</strong> esperando</span>
        <button type="button" id="kFullscreen" class="k-full"><i class="fas fa-expand"></i> <span>Pantalla completa</span></button>
    </header>

    <main id="kLista" class="k-lista"></main>

    <!-- Pedido destacado: la cajera lo manda y aparece aquí en grande, con su QR. -->
    <main id="kPedido" class="k-pedido hidden">
        <button type="button" id="kVolver" class="k-volver"><i class="fas fa-arrow-left"></i> Volver a la lista</button>
        <section class="k-pedido-vivo">
            <div class="k-pedido-info">
                <div class="k-pedido-folio" id="kFolio"></div>
                <h2 id="kNombre"></h2>
                <div class="k-pedido-estado" id="kEstado"></div>
                <div class="k-pedido-tiempo"><i class="fas fa-clock"></i> Lleva <strong id="kTiempo">—</strong></div>
            </div>
            <div class="k-qr" id="kQr"></div>
        </section>
        <section class="k-pedido-cuerpo">
            <div class="k-items" id="kItems"></div>
            <div class="k-resumen" id="kResumen"></div>
        </section>
        <div class="k-pago" id="kPago"></div>
    </main>

    <!-- Contenido en reposo (pendiente de implementar). -->
    <div id="kReposo" class="k-reposo"></div>

    <script src="js/kiosko.js?v=3"></script>
</body>
</html>
