<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiosko - Tomodachi</title>
    <link rel="stylesheet" href="lib/fontawesome/css/all.min.css?v=4">
    <link rel="stylesheet" href="css/fonts.css?v=4">
    <link rel="stylesheet" href="css/variables.css?v=6">
    <script src="js/theme-init.js?v=5"></script>
    <link rel="icon" type="image/svg+xml" href="assets/app-icons/tomodachi-favicon.svg">
    <link rel="manifest" href="manifest.json">
    <script src="js/format-utils.js"></script>
    <script src="js/ws-realtime.js?v=2"></script>
    <script src="lib/qrcodejs/qrcode.min.js"></script>
    <style>
        :root {
            --primary-color: #39C5BB;
            --bg-body: #10141a;
            --bg-card: #1a2027;
            --bg-light: #232a33;
            --text-color: #ecf0f3;
            --text-muted: #9aa4b0;
            --border-color: #2c343e;
            --success-color: #34c07a;
            --warning-color: #e2a03f;
            --danger-color: #e05b4d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'Google Sans Flex', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-body); color: var(--text-color);
            display: flex; flex-direction: column; overflow: hidden;
        }
        button { font-family: inherit; cursor: pointer; }

        /* Barra mínima: sólo la rueda de configuración (no está el nombre de la app,
           ni cuántos esperan, ni pantalla completa: aquí solo se ve lo que pide el cliente). */
        .k-top {
            position: fixed; top: 0; right: 0; z-index: 20;
            padding: 12px 16px; display: flex; justify-content: flex-end;
        }
        .k-ajustes {
            width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--border-color);
            background: rgba(0,0,0,.25); color: var(--text-muted); font-size: 1.15rem;
            display: inline-flex; align-items: center; justify-content: center; opacity: .55;
            transition: opacity .2s;
        }
        .k-ajustes:hover { opacity: 1; color: var(--primary-color); border-color: var(--primary-color); }
        /* Mientras se muestra el pedido no hay controles a la vista (igual que el monitor del POS). */
        .kiosko.k-pedido-visible .k-top { display: none; }

        /* El pedido del cliente: una sola tarjeta, centrada en la pantalla (como el monitor del POS). */
        .k-pedido {
            flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
            height: 100vh; padding: 24px 40px;
        }
        .k-pedido.hidden { display: none; }
        .k-pedido-caja {
            background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 22px;
            padding: 30px 36px; max-width: 760px; width: 100%;
            display: flex; flex-direction: column; gap: 20px;
        }
        .k-pedido-folio { font-size: 2.8rem; font-weight: 800; color: var(--primary-color); text-align: center; }
        .k-pedido-fila { display: flex; gap: 28px; align-items: center; justify-content: center; }
        .k-articulos { flex: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
        .k-items { display: flex; flex-direction: column; gap: 10px; }
        .k-item {
            display: flex; justify-content: space-between; gap: 14px; align-items: flex-start;
            border-bottom: 1px dashed var(--border-color); padding: 8px 2px; font-size: 1.35rem;
        }
        .k-izq { display: flex; align-items: baseline; gap: 10px; }
        .k-cant { font-weight: 800; color: var(--primary-color); }
        .k-nombre-item { overflow-wrap: anywhere; }
        .k-precio { font-variant-numeric: tabular-nums; white-space: nowrap; display: flex; align-items: baseline; gap: 8px; }
        .k-precio-orig { color: var(--text-muted); text-decoration: line-through; font-size: 1.05rem; }
        .k-resumen { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--border-color); padding-top: 12px; }
        .k-fila { display: flex; justify-content: space-between; font-size: 1.25rem; color: var(--text-muted); }
        .k-fila b { color: var(--text-color); }
        .k-fila.k-final { font-size: 1.7rem; }
        .k-fila.k-final b { color: var(--primary-color); }
        .k-pago { font-size: 1.05rem; padding: 9px 14px; border-radius: 10px; background: var(--bg-light);
            display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--border-color); }
        .k-qr { background: #fff; padding: 14px; border-radius: 18px; flex: 0 0 auto; }
        .k-qr canvas, .k-qr img { width: 200px; height: 200px; display: block; }

        /* Reposo: carrusel de imágenes/videos configurados, o pantalla limpia en espera. */
        .k-reposo { flex: 1 1 auto; position: relative; overflow: hidden; height: 100vh; display: none;
            align-items: center; justify-content: center; }
        .k-reposo.activo { display: flex; }
        .kr-slide { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
        .kr-slide img, .kr-slide video { width: 100%; height: 100%; object-fit: contain; }
        .kr-slide.oculto { opacity: 0; }
        .kr-fade { transition: opacity .9s ease; }
        .kr-sin { flex: 1 1 auto; display: flex; align-items: center; justify-content: center; }
        .kr-sin div { text-align: center; color: var(--text-muted); font-size: 1.6rem; display: flex; flex-direction: column; gap: 16px; align-items: center; }
        .kr-sin i { font-size: 3.4rem; color: var(--border-color); }

        /* Panel de configuración (tres puntos). */
        .k-panel { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.55);
            display: none; align-items: center; justify-content: center; padding: 20px; }
        .k-panel.abierto { display: flex; }
        .k-panel-caja {
            background: var(--bg-light); border: 1px solid var(--border-color); border-radius: 18px;
            max-width: 520px; width: 100%; max-height: 92vh; overflow-y: auto; padding: 22px;
            display: flex; flex-direction: column; gap: 16px;
        }
        .k-panel-titulo { display: flex; align-items: center; justify-content: space-between; }
        .k-panel-titulo h3 { font-size: 1.4rem; }
        .k-campo { display: flex; flex-direction: column; gap: 6px; }
        .k-campo label { font-size: .95rem; color: var(--text-muted); font-weight: 600; }
        .k-campo input, .k-campo select {
            background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-color);
            border-radius: 10px; padding: 11px 13px; font-size: 1rem; font-family: inherit;
        }
        .k-help { font-size: .85rem; color: var(--text-muted); }
        .k-assets { display: flex; flex-direction: column; gap: 8px; }
        .k-asset { display: flex; align-items: center; gap: 10px; background: var(--bg-card);
            border: 1px solid var(--border-color); border-radius: 10px; padding: 8px 10px; }
        .k-asset img, .k-asset video { width: 54px; height: 40px; object-fit: cover; border-radius: 8px; background: #000; }
        .k-asset .k-asset-url { flex: 1; font-size: .8rem; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .k-asset button { background: none; border: none; color: var(--danger-color); font-size: 1.1rem; }
        .k-add { display: flex; gap: 8px; }
        .k-add input { flex: 1; }
        .k-add .k-tipo { width: 96px; }
        .k-btn { border: none; border-radius: 12px; padding: 13px 16px; font-size: 1.05rem; font-weight: 700; }
        .k-btn-primario { background: var(--primary-color); color: #06231f; }
        .k-btn-fantasma { background: none; border: 1px solid var(--border-color); color: var(--text-muted); font-size: 1rem; padding: 10px 14px; }
        .k-panel-fila { display: flex; gap: 10px; justify-content: flex-end; }
        .k-guardar-estado { font-size: .9rem; color: var(--success-color); display: none; }

        @media (max-width: 700px) {
            .k-pedido-vivo, .k-pedido-cuerpo { grid-template-columns: 1fr; }
            .k-resumen { min-width: 0; }
        }
    </style>
</head>
<body class="kiosko">
    <!-- Rueda de configuración: la única cosa del personal en esta pantalla. -->
    <div class="k-top">
        <button type="button" id="kAjustes" class="k-ajustes" title="Configuración del kiosko" aria-label="Configurar">
            <i class="fas fa-ellipsis-v"></i>
        </button>
    </div>

    <!-- El pedido del cliente: una tarjeta centrada, igual que el monitor del POS. -->
    <main id="kPedido" class="k-pedido hidden">
        <div class="k-pedido-caja">
            <div class="k-pedido-folio" id="kFolio"></div>
            <div class="k-pedido-fila">
                <div class="k-articulos">
                    <div class="k-items" id="kItems"></div>
                    <div class="k-resumen" id="kResumen"></div>
                    <div class="k-pago" id="kPago"></div>
                </div>
                <div class="k-qr" id="kQr"></div>
            </div>
        </div>
    </main>

    <!-- Reposo: carrusel o espera limpia. -->
    <div id="kReposo" class="k-reposo"></div>

    <!-- Panel de configuración del kiosko. -->
    <div id="kPanel" class="k-panel">
        <div class="k-panel-caja">
            <div class="k-panel-titulo">
                <h3><i class="fas fa-tv"></i> Configuración del kiosko</h3>
                <button type="button" id="kCerrarPanel" class="k-btn-fantasma"><i class="fas fa-times"></i></button>
            </div>

            <div class="k-campo">
                <label for="kReposoTiempo">Tiempo en reposo antes del carrusel</label>
                <input type="number" id="kReposoTiempo" min="5" max="3600" step="5">
                <div class="k-help">Segundos con el kiosko sin pedido a la vista antes de mostrar el carrusel.</div>
            </div>

            <div class="k-campo">
                <label for="kTransicion">Animación de transición</label>
                <select id="kTransicion">
                    <option value="fade">Fundido</option>
                    <option value="slide">Deslizar</option>
                    <option value="none">Sin animación</option>
                </select>
            </div>

            <div class="k-campo">
                            <label for="kMensaje">Mensaje cuando no hay pedido a la vista</label>
                            <input type="text" id="kMensaje" maxlength="60" placeholder="Bienvenidos">
                            <div class="k-help">El letrero que se ve en reposo mientras el carrusel no esté en uso.</div>
                        </div>

                        <div class="k-campo">
                            <label>Contenido del carrusel (en reposo)</label>
                            <div class="k-help">Sube imágenes o videos (promociones, el menú, lo que quieras mostrar).</div>
                            <div class="k-assets" id="kAssetList"></div>
                            <div class="k-add">
                                <input type="file" id="kAssetFile" accept="image/*,video/*" multiple>
                                <button type="button" id="kSubirAsset" class="k-btn k-btn-primario"><i class="fas fa-upload"></i> Subir</button>
                            </div>
                        </div>

            <div class="k-panel-fila">
                <span class="k-guardar-estado" id="kGuardado"><i class="fas fa-check"></i> Guardado</span>
                <button type="button" id="kGuardarCfg" class="k-btn k-btn-primario">Guardar</button>
            </div>
        </div>
    </div>

    <script src="js/kiosko.js?v=6"></script>
</body>
</html>
