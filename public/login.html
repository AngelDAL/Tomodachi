<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Tomodachi</title>
    <!-- Local Fonts -->
    <link rel="stylesheet" href="css/fonts.css?v=4">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="lib/fontawesome/css/all.min.css?v=4">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/login.css?v=5">
    <link rel="stylesheet" href="css/design-system.css?v=6">
    <script src="lib/animejs/anime.min.js" defer></script>
    <script src="js/design-system.js?v=6" defer></script>
</head>

<body>

    <div class="split-screen">
        <!-- Left Side: Image & Branding -->
        <div class="left-pane">
            <div class="bg-image" style="background-image: url('assets/images/backgrounds/Portada1.jpg');"></div>
            <div class="overlay"></div>
            <div class="brand-content">
                <div class="brand-logo-circle">
                    <svg class="logo-svg" viewBox="0 0 978 978" version="1.1" xmlns="http://www.w3.org/2000/svg" style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
                        <g transform="matrix(1,0,0,1,-640.505536,-1753.937008)">
                            <g transform="matrix(3.479065,0,0,3.479065,-4010.290738,-1296.905436)">
                                <path d="M1439.144,903.435C1445.042,887.496 1460.24,876.915 1477.235,876.915C1494.231,876.915 1509.429,887.496 1515.327,903.435L1535.807,958.783L1591.155,979.263C1607.094,985.161 1617.676,1000.36 1617.676,1017.355C1617.676,1034.35 1607.094,1049.548 1591.155,1055.446L1535.807,1075.927L1515.327,1131.275C1509.429,1147.214 1494.231,1157.795 1477.235,1157.795C1460.24,1157.795 1445.042,1147.214 1439.144,1131.275L1418.663,1075.927L1363.316,1055.446C1347.377,1049.548 1336.795,1034.35 1336.795,1017.355C1336.795,1000.36 1347.377,985.161 1363.316,979.263L1418.663,958.783L1439.144,903.435ZM1477.235,958.616C1444.817,958.616 1418.497,984.936 1418.497,1017.355C1418.497,1049.774 1444.817,1076.093 1477.235,1076.093C1509.654,1076.093 1535.974,1049.774 1535.974,1017.355C1535.974,984.936 1509.654,958.616 1477.235,958.616ZM1477.235,987.986C1493.445,987.986 1506.605,1001.145 1506.605,1017.355C1506.605,1033.564 1493.445,1046.724 1477.235,1046.724C1461.026,1046.724 1447.866,1033.564 1447.866,1017.355C1447.866,1001.145 1461.026,987.986 1477.235,987.986Z" style="fill:white;"/>
                            </g>
                        </g>
                    </svg>
                </div>
                <h1>Tomodachi</h1>
                <p class="tagline">Gestiona tu negocio de una forma simple y organizada.</p>
            </div>
            
            <!-- Decorative SVG Waves -->
            <div class="waves-container">
                <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
                    viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
                    <defs>
                        <path id="gentle-wave"
                            d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z" />
                    </defs>
                    <g class="parallax">
                        <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.7)" />
                        <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.5)" />
                        <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.3)" />
                        <use xlink:href="#gentle-wave" x="48" y="7" fill="#fff" />
                    </g>
                </svg>
            </div>
        </div>

        <!-- Right Side: Login Form -->
        <div class="right-pane">
            <div class="login-wrapper">
                <div class="mobile-header">
                    <h2>Tomodachi</h2>
                </div>

                <div class="form-header">
                    <h3>Bienvenido</h3>
                    <p>Ingresa tus credenciales para acceder</p>
                </div>

                <form id="loginForm" class="modern-form">
                    <div class="input-group">
                        <div class="icon-wrapper">
                            <i class="fas fa-user"></i>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" id="username" name="username" required autocomplete="username"
                                placeholder=" ">
                            <label for="username">Usuario</label>
                        </div>
                    </div>

                    <div class="input-group">
                        <div class="icon-wrapper">
                            <i class="fas fa-lock"></i>
                        </div>
                        <div class="input-wrapper">
                            <input type="password" id="password" name="password" required
                                autocomplete="current-password" placeholder=" ">
                            <label for="password">Contraseña</label>
                            <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="form-actions">
                        <label class="remember-me">
                            <input type="checkbox" name="remember">
                            <span>Recordarme</span>
                        </label>
                        <a href="forgot_password.html" class="forgot-password">¿Olvidaste tu contraseña?</a>
                    </div>

                    <div id="errorMessage" class="error-message">
                        <i class="fas fa-exclamation-circle"></i>
                        <span>Error message here</span>
                    </div>

                    <button type="submit" class="btn-login">
                        <span>Iniciar Sesión</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </form>

                <div class="login-footer">
                    <p>¿No tienes una cuenta? <a href="register.html">Regístrate ahora</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Limpiar tema anterior
        localStorage.removeItem('pos_theme_config');

        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const icon = document.querySelector('.toggle-password i');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Animation feedback
            const btn = loginForm.querySelector('.btn-login');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Procesando...';
            btn.disabled = true;

            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const remember = document.querySelector('input[name="remember"]').checked;

            try {
                const response = await fetch('../api/auth/login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({ username, password, remember })
                });
                const data = await response.json();

                if (data.success) {
                    // Guardar preferencia de sesión persistente
                    if (remember) {
                        localStorage.setItem('tomodachi_keep_session', '1');
                    } else {
                        localStorage.removeItem('tomodachi_keep_session');
                    }
                    btn.innerHTML = '<i class="fas fa-check"></i> ¡Éxito!';
                    btn.style.background = '#48bb78';
                    setTimeout(() => {
                        if (data.data.user.role === 'super_admin') {
                            window.location.href = 'super_admin.html';
                        } else {
                            window.location.href = 'dashboard.html';
                        }
                    }, 500);
                } else {
                    showError(data.message);
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                    btn.style.background = '';
                }
            } catch (error) {
                showError('Error de conexión. Intente nuevamente.');
                btn.innerHTML = originalContent;
                btn.disabled = false;
            }
        });

        function showError(message) {
            const span = errorMessage.querySelector('span');
            span.textContent = message;
            errorMessage.classList.add('show');

            // Shake animation
            errorMessage.style.animation = 'none';
            errorMessage.offsetHeight; /* trigger reflow */
            errorMessage.style.animation = 'shake 0.5s';

            setTimeout(() => {
                errorMessage.classList.remove('show');
            }, 5000);
        }
    </script>
</body>

</html>
