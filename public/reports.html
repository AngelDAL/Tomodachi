<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Reportes - Tomodachi</title>
    <!-- Local Fonts -->
    <link rel="stylesheet" href="css/fonts.css?v=4">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="lib/fontawesome/css/all.min.css?v=4">
    <link rel="stylesheet" href="css/main.css?v=4">
    <link rel="stylesheet" href="css/design-system.css?v=5">
    <link rel="stylesheet" href="css/sidebar-modern.css?v=4">
    <link rel="stylesheet" href="css/mobile-nav.css?v=4">
    <link rel="stylesheet" href="css/dashboard.css?v=4">
    <script src="js/theme-init.js"></script>
    <script src="js/format-utils.js"></script>
    <script src="lib/qrcodejs/qrcode.min.js"></script>
</head>

<body>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="sidebar-close" id="sidebarClose" aria-label="Cerrar menú"><i class="fas fa-times"></i></button>
                <h2>Tomodachi</h2>
            </div>

            <nav class="sidebar-nav">
                <!-- Navigation Loaded by js/sidebar-loader.js?v=3 -->
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div class="dashboard-content">
                <div class="reports-container">
                    <div class="reports-header">
                        <h2>Generador de Reportes</h2>
                    </div>

                    <!-- Grid de Tarjetas de Reportes -->
                    <div class="report-cards-grid" id="reportCardsGrid">
                        <div class="report-card" onclick="selectReport('sales', 'Historial de Ventas', 'fa-chart-line')">
                            <div class="report-card-icon"><i class="fas fa-chart-line"></i></div>
                            <div class="report-card-title">Historial de Ventas</div>
                        </div>
                        <div class="report-card" onclick="selectReport('inventory', 'Valoración de Inventario', 'fa-boxes')">
                            <div class="report-card-icon"><i class="fas fa-boxes"></i></div>
                            <div class="report-card-title">Valoración de Inventario</div>
                        </div>
                        <div class="report-card" onclick="selectReport('top_products', 'Productos Más Vendidos', 'fa-trophy')">
                            <div class="report-card-icon"><i class="fas fa-trophy"></i></div>
                            <div class="report-card-title">Productos Más Vendidos</div>
                        </div>
                        <div class="report-card" onclick="selectReport('inventory_movements', 'Movimientos de Inventario', 'fa-dolly')">
                            <div class="report-card-icon"><i class="fas fa-dolly"></i></div>
                            <div class="report-card-title">Movimientos de Inventario</div>
                        </div>
                        <div class="report-card" onclick="selectReport('cash_registers', 'Historial de Cajas', 'fa-cash-register')">
                            <div class="report-card-icon"><i class="fas fa-cash-register"></i></div>
                            <div class="report-card-title">Historial de Cajas</div>
                        </div>
                        <div class="report-card" onclick="selectReport('cash_movements', 'Movimientos de Efectivo', 'fa-money-bill-wave')">
                            <div class="report-card-icon"><i class="fas fa-money-bill-wave"></i></div>
                            <div class="report-card-title">Movimientos de Efectivo</div>
                        </div>
                        <div class="report-card" onclick="selectReport('qr_labels', 'Impresión de Etiquetas QR', 'fa-qrcode')">
                            <div class="report-card-icon"><i class="fas fa-qrcode"></i></div>
                            <div class="report-card-title">Etiquetas QR</div>
                        </div>
                        <div class="report-card" onclick="selectReport('close_z', 'Cierre Z / Auditoría', 'fa-receipt')">
                            <div class="report-card-icon"><i class="fas fa-receipt"></i></div>
                            <div class="report-card-title">Cierre Z / Auditoría</div>
                        </div>
                    </div>

                    <!-- Contenedor de Selección y Filtros (Oculto inicialmente) -->
                    <div class="report-selection-container" id="reportSelectionContainer">
                        <div class="report-selection-header">
                            <button class="btn-back-floating" onclick="showReportGrid()">
                                <i class="fas fa-arrow-left"></i> Regresar
                            </button>
                            <div class="report-selection-title">
                                <i id="selectedReportIcon" class="fas fa-chart-bar"></i>
                                <span id="selectedReportTitle">Reporte Seleccionado</span>
                            </div>
                            <div id="reportCompanyBadge" class="report-company-badge" style="display:none;">
                                <span style="display:inline-flex; width:34px; height:34px; border-radius:50%; overflow:hidden; background:#fff; border:1px solid var(--border-color); flex:0 0 auto;">
                                    <img id="reportCompanyLogo" src="" alt="Logo" style="width:100%; height:100%; object-fit:cover; display:block;">
                                </span>
                                <span id="reportCompanyName" style="font-size:0.9rem; font-weight:600; color: var(--text-color);"></span>
                            </div>
                        </div>

                        <div class="report-filters">
                            <input type="hidden" id="reportType">
                            
                            <div class="filter-group date-group" id="startDateGroup">
                                <label>Desde</label>
                                <input type="datetime-local" id="startDate" class="form-control">
                            </div>
                            <div class="filter-group date-group" id="endDateGroup">
                                <label>Hasta</label>
                                <input type="datetime-local" id="endDate" class="form-control">
                            </div>
                            <div class="filter-group" style="flex: 0 0 auto;" id="generateBtnGroup">
                                <label>&nbsp;</label>
                                <button class="btn-primary" onclick="generateReport()">
                                    <i class="fas fa-search"></i> Generar Reporte
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="report-actions" style="display:none;" id="exportButtons">
                        <button class="btn-secondary" onclick="exportExcel()">
                            <i class="fas fa-file-excel"></i> Excel
                        </button>
                        <button class="btn-secondary" onclick="exportPDF()">
                            <i class="fas fa-file-pdf"></i> PDF
                        </button>
                    </div>

                    <div class="report-results" id="reportResults">
                        <div class="empty-state">
                            <i class="fas fa-chart-pie"></i>
                            <p>Seleccione un tipo de reporte y genere los resultados</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal: Detalle de venta -->
    <dialog id="saleDetailModal" class="sale-detail-dialog" aria-label="Detalle de venta">
        <div class="modal-content" style="max-width: 560px; border: none;">
            <div class="modal-header">
                <h2 id="saleDetailTitle">Detalle de Venta</h2>
                <button type="button" class="modal-close" id="saleDetailClose" aria-label="Cerrar">&times;</button>
            </div>
            <div class="modal-body" id="saleDetailBody" style="max-height: 60vh; overflow-y: auto;">
                <!-- Contenido inyectado por JS -->
            </div>
        </div>
    </dialog>

    <script src="js/sidebar-loader.js?v=3"></script>
    <script src="js/app.js"></script>
    <script src="lib/xlsx/xlsx.full.min.js"></script>
    <script src="lib/html2pdf/html2pdf.bundle.min.js"></script>
    <script src="lib/jspdf/jspdf.umd.min.js"></script>
    <script src="lib/jspdf/jspdf.plugin.autotable.min.js"></script>
    <script>
        let currentUser = null;
        let currentReportData = null;
        let currentReportType = '';

        // Carga defensiva de la sesión: si DOMContentLoaded aún no terminó
        // (o la sesión expiró), obtiene los datos del usuario antes de usarlos.
        async function ensureCurrentUser() {
            if (currentUser) return currentUser;
            try {
                const session = await checkSession();
                if (session) currentUser = session;
            } catch (e) { /* noop */ }
            return currentUser;
        }

        // Muestra el logo y nombre de la empresa en el encabezado del reporte
        async function updateReportCompanyBadge() {
            const badge = document.getElementById('reportCompanyBadge');
            if (!badge) return;
            try {
                const user = await ensureCurrentUser() || {};
                const logoImg = document.getElementById('reportCompanyLogo');
                const nameEl = document.getElementById('reportCompanyName');
                if (nameEl) nameEl.textContent = user.store_name || 'Mi Negocio';
                const logoUrl = getRelativeImagePath(user.logo_url) || 'assets/images/default-logo.png';
                if (logoImg && logoUrl && logoUrl !== 'assets/images/default-logo.png') {
                    logoImg.src = logoUrl;
                    logoImg.style.display = 'inline-block';
                    badge.style.display = 'flex';
                } else {
                    // Sin logo: mostrar solo el nombre
                    logoImg.style.display = 'none';
                    badge.style.display = 'flex';
                }
            } catch (e) {
                badge.style.display = 'none';
            }
        }

        function toLocalISOString(date) {
            const offset = date.getTimezoneOffset() * 60000;
            return (new Date(date - offset)).toISOString().slice(0, 16);
        }

        document.addEventListener('DOMContentLoaded', async () => {
            const session = await checkSession();
            if (!session) { requireSession(); return; }
            currentUser = session;

            // document.getElementById('userName').textContent = session.full_name;
            // document.getElementById('userRole').textContent = session.role.toUpperCase();
            
            // Set default dates (current month) with time
            const now = new Date();
            const firstDay = new Date(now.getFullYear(), now.getMonth(), 1, 0, 0, 0);
            const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0, 23, 59, 0);
            
            document.getElementById('startDate').value = toLocalISOString(firstDay);
            document.getElementById('endDate').value = toLocalISOString(lastDay);
        });

        // Logout: el sidebar-loader.js ya adjunta sus propios listeners al
        // inyectar el sidebar; aquí solo añadimos el nuestro si el botón ya
        // existe (evita TypeError si aún no fue generado).
        const logoutBtnEl = document.getElementById('logoutBtn');
        if (logoutBtnEl) {
            logoutBtnEl.addEventListener('click', async (e) => {
                e.preventDefault();
                await logout();
            });
        }

        function selectReport(type, title, iconClass) {
            currentReportType = type;
            document.getElementById('reportType').value = type;
            document.getElementById('selectedReportTitle').textContent = title;
            
            // Fix icon class if it already has 'fas' or not
            const icon = document.getElementById('selectedReportIcon');
            icon.className = iconClass.includes('fa-') ? (iconClass.includes('fas') ? iconClass : 'fas ' + iconClass) : 'fas ' + iconClass;

            // Mostrar logo y nombre de la empresa en el encabezado del reporte
            updateReportCompanyBadge();
            
            // Hide grid, show selection container
            document.getElementById('reportCardsGrid').style.display = 'none';
            document.getElementById('reportSelectionContainer').style.display = 'block';
            
            // Configure filters based on type
            const showDates = (type !== 'inventory' && type !== 'qr_labels');
            document.getElementById('startDateGroup').style.display = showDates ? 'block' : 'none';
            document.getElementById('endDateGroup').style.display = showDates ? 'block' : 'none';
            
            // Clear previous results
            document.getElementById('reportResults').innerHTML = '<div class="empty-state"><i class="fas fa-chart-pie"></i><p>Presione "Generar Reporte" para ver los resultados</p></div>';
            document.getElementById('exportButtons').style.display = 'none';

            // Auto-generate for inventory (no dates needed)
            if (type === 'inventory') {
                generateReport();
            } else if (type === 'qr_labels') {
                document.getElementById('generateBtnGroup').style.display = 'none'; // Hide generate button for QR
                renderQRLabelGenerator();
            } else {
                document.getElementById('generateBtnGroup').style.display = 'block';
            }
        }

        function showReportGrid() {
            document.getElementById('reportCardsGrid').style.display = 'grid';
            document.getElementById('reportSelectionContainer').style.display = 'none';
            document.getElementById('reportResults').innerHTML = '';
            document.getElementById('exportButtons').style.display = 'none';
            currentReportData = null;
        }

        async function generateReport() {
            const type = document.getElementById('reportType').value;
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const resultsDiv = document.getElementById('reportResults');
            const exportBtns = document.getElementById('exportButtons');

            if (type === 'qr_labels') {
                renderQRLabelGenerator();
                return;
            }

            // Cierre Z: endpoint dedicado (estructura distinta a los reportes de lista)
            if (type === 'close_z') {
                resultsDiv.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Generando auditoría...</p></div>';
                exportBtns.style.display = 'none';
                const date = (startDate || '').slice(0, 10);
                try {
                    const resp = await fetch(`../api/reports/close_z.php?date=${date || new Date().toISOString().slice(0,10)}`);
                    const result = await resp.json();
                    if (!result.success) throw new Error(result.message || 'Error al generar auditoría');
                    currentReportData = result.data;
                    currentReportType = type;
                    renderCloseZ(result.data);
                    exportBtns.style.display = 'none'; // el cierre Z se imprime con Ctrl+P (estructura propia)
                } catch (error) {
                    console.error(error);
                    resultsDiv.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error: ${error.message}</p></div>`;
                    currentReportData = null;
                }
                return;
            }

            resultsDiv.innerHTML = '<div class="empty-state"><i class="fas fa-spinner fa-spin"></i><p>Generando reporte...</p></div>';
            exportBtns.style.display = 'none';

            try {
                let url = `../api/reports/dashboard_stats.php?type=${type}`;
                if (type !== 'inventory') {
                    url += `&start_date=${startDate}&end_date=${endDate}`;
                }

                const response = await fetch(url);
                const result = await response.json();

                if (!result.success) throw new Error(result.message);

                if (!result.data || result.data.length === 0) {
                    resultsDiv.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><p>No se encontraron datos para el periodo seleccionado</p></div>';
                    currentReportData = null;
                    return;
                }

                currentReportData = result.data;
                currentReportType = type;
                renderTable(type, result.data);
                exportBtns.style.display = 'flex';

            } catch (error) {
                console.error(error);
                resultsDiv.innerHTML = `<div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Error: ${error.message}</p></div>`;
                currentReportData = null;
            }
        }

        function renderTable(type, data) {
            let html = '<table class="dashboard-table" id="reportTable"><thead><tr>';
            
            if (type === 'sales') {
                html += `
                    <th>ID Venta</th>
                    <th>Fecha</th>
                    <th>Usuario</th>
                    <th>Método Pago</th>
                    <th>Total</th>
                    <th>Ganancia</th>
                </tr></thead><tbody>`;
                
                let totalSales = 0;
                let totalProfit = 0;

                data.forEach(row => {
                    totalSales += parseFloat(row.total);
                    totalProfit += parseFloat(row.profit);
                    html += `
                        <tr style="cursor: pointer;" title="Clic para ver detalle de la venta #${row.sale_id}" onclick="showSaleDetail(${row.sale_id})">
                            <td data-label="ID Venta">#${row.sale_id}</td>
                            <td data-label="Fecha">${(window.FormatUtils ? window.FormatUtils.date(row.sale_date) : new Date(row.sale_date).toLocaleString())}</td>
                            <td data-label="Usuario">${row.username}</td>
                            <td data-label="Método Pago">${formatPaymentMethod(row.payment_method)}</td>
                            <td data-label="Total">${window.FormatUtils ? window.FormatUtils.currency(parseFloat(row.total)) : `$${parseFloat(row.total).toFixed(2)}`}</td>
                            <td data-label="Ganancia" style="color: ${row.profit >= 0 ? 'green' : 'red'}">${window.FormatUtils ? window.FormatUtils.currency(parseFloat(row.profit)) : `$${parseFloat(row.profit).toFixed(2)}`}</td>
                        </tr>
                    `;
                });
                
                // Footer row
                html += `
                    <tr style="background-color: var(--bg-light); font-weight: bold;">
                        <td colspan="4" style="text-align: right;">TOTALES:</td>
                        <td>${window.FormatUtils ? window.FormatUtils.currency(totalSales) : `$${totalSales.toFixed(2)}`}</td>
                        <td>${window.FormatUtils ? window.FormatUtils.currency(totalProfit) : `$${totalProfit.toFixed(2)}`}</td>
                    </tr>
                `;

            } else if (type === 'inventory') {
                html += `
                    <th>Producto</th>
                    <th>Código</th>
                    <th>Stock</th>
                    <th>Costo Unit.</th>
                    <th>Precio Unit.</th>
                    <th>Valor Costo</th>
                    <th>Valor Venta</th>
                </tr></thead><tbody>`;
                
                let totalCostVal = 0;
                let totalPriceVal = 0;

                data.forEach(row => {
                    totalCostVal += parseFloat(row.total_cost_value);
                    totalPriceVal += parseFloat(row.total_price_value);
                    html += `
                        <tr>
                            <td data-label="Producto">${row.product_name}</td>
                            <td data-label="Código">${row.barcode || '-'}</td>
                            <td data-label="Stock">${row.current_stock}</td>
                            <td data-label="Costo">${window.FormatUtils ? window.FormatUtils.currency(parseFloat(row.cost)) : `$${parseFloat(row.cost).toFixed(2)}`}</td>
                            <td data-label="Precio">${window.FormatUtils ? window.FormatUtils.currency(parseFloat(row.price)) : `$${parseFloat(row.price).toFixed(2)}`}</td>
                            <td data-label="Valor Costo">${window.FormatUtils ? window.FormatUtils.currency(parseFloat(row.total_cost_value)) : `$${parseFloat(row.total_cost_value).toFixed(2)}`}</td>
                            <td data-label="Valor Venta">${window.FormatUtils ? window.FormatUtils.currency(parseFloat(row.total_price_value)) : `$${parseFloat(row.total_price_value).toFixed(2)}`}</td>
                        </tr>
                    `;
                });

                html += `
                    <tr style="background-color: var(--bg-light); font-weight: bold;">
                        <td colspan="5" style="text-align: right;">TOTALES:</td>
                        <td>${window.FormatUtils ? window.FormatUtils.currency(totalCostVal) : `$${totalCostVal.toFixed(2)}`}</td>
                        <td>${window.FormatUtils ? window.FormatUtils.currency(totalPriceVal) : `$${totalPriceVal.toFixed(2)}`}</td>
                    </tr>
                `;

            } else if (type === 'top_products') {
                html += `
                    <th>Producto</th>
                    <th>Código</th>
                    <th>Unidades Vendidas</th>
                    <th>Ingresos</th>
                    <th>Ganancia</th>
                </tr></thead><tbody>`;

                data.forEach(row => {
                    html += `
                        <tr>
                            <td data-label="Producto">${row.product_name}</td>
                            <td data-label="Código">${row.barcode || '-'}</td>
                            <td data-label="Unidades">${row.total_sold}</td>
                            <td data-label="Ingresos">${window.FormatUtils ? window.FormatUtils.currency(parseFloat(row.revenue)) : `$${parseFloat(row.revenue).toFixed(2)}`}</td>
                            <td data-label="Ganancia">${window.FormatUtils ? window.FormatUtils.currency(parseFloat(row.profit)) : `$${parseFloat(row.profit).toFixed(2)}`}</td>
                        </tr>
                    `;
                });
            } else if (type === 'cash_registers') {
                html += `
                    <th>ID</th>
                    <th>Apertura</th>
                    <th>Cierre</th>
                    <th>Terminal</th>
                    <th>Usuario</th>
                    <th>Inicial</th>
                    <th>Final</th>
                    <th>Diferencia</th>
                    <th>Estado</th>
                </tr></thead><tbody>`;

                data.forEach(row => {
                    const diff = parseFloat(row.difference || 0);
                    const diffColor = diff < 0 ? 'red' : (diff > 0 ? 'green' : 'inherit');
                    
                    html += `
                        <tr>
                            <td data-label="ID">#${row.register_id}</td>
                            <td data-label="Apertura">${(window.FormatUtils ? window.FormatUtils.date(row.opening_date) : new Date(row.opening_date).toLocaleString())}</td>
                            <td data-label="Cierre">${row.closing_date ? (window.FormatUtils ? window.FormatUtils.date(row.closing_date) : new Date(row.closing_date).toLocaleString()) : '-'}</td>
                            <td data-label="Terminal">${row.terminal_name || 'General'}</td>
                            <td data-label="Usuario">${row.username}</td>
                            <td data-label="Inicial">${window.FormatUtils ? window.FormatUtils.currency(parseFloat(row.initial_amount)) : `$${parseFloat(row.initial_amount).toFixed(2)}`}</td>
                            <td data-label="Final">${row.final_amount !== null ? (window.FormatUtils ? window.FormatUtils.currency(row.final_amount) : '$' + parseFloat(row.final_amount).toFixed(2)) : '-'}</td>
                            <td data-label="Diferencia" style="color: ${diffColor}">${row.difference !== null ? (window.FormatUtils ? window.FormatUtils.currency(diff) : '$' + diff.toFixed(2)) : '-'}</td>
                            <td data-label="Estado"><span class="badge ${row.status === 'open' ? 'badge-success' : 'badge-secondary'}">${row.status === 'open' ? 'Abierta' : 'Cerrada'}</span></td>
                        </tr>
                    `;
                });
            } else if (type === 'cash_movements') {
                html += `
                    <th>Fecha</th>
                    <th>Terminal</th>
                    <th>Usuario</th>
                    <th>Tipo</th>
                    <th>Monto</th>
                    <th>Descripción</th>
                </tr></thead><tbody>`;

                data.forEach(row => {
                    let typeLabel = row.movement_type;
                    let typeClass = '';
                    if (row.movement_type === 'entry') { typeLabel = 'Entrada'; typeClass = 'text-success'; }
                    else if (row.movement_type === 'withdrawal') { typeLabel = 'Retiro'; typeClass = 'text-danger'; }
                    else if (row.movement_type === 'sale') { typeLabel = 'Venta'; }

                    html += `
                        <tr>
                            <td data-label="Fecha">${(window.FormatUtils ? window.FormatUtils.date(row.created_at) : new Date(row.created_at).toLocaleString())}</td>
                            <td data-label="Terminal">${row.terminal_name || 'General'}</td>
                            <td data-label="Usuario">${row.username}</td>
                            <td data-label="Tipo" class="${typeClass}">${typeLabel}</td>
                            <td data-label="Monto">${window.FormatUtils ? window.FormatUtils.currency(parseFloat(row.amount)) : `$${parseFloat(row.amount).toFixed(2)}`}</td>
                            <td data-label="Descripción">${row.description || '-'}</td>
                        </tr>
                    `;
                });
            } else if (type === 'inventory_movements') {
                html += `
                    <th>Fecha</th>
                    <th>Producto</th>
                    <th>Tipo</th>
                    <th>Cant.</th>
                    <th>Stock Ant.</th>
                    <th>Stock Nuevo</th>
                    <th>Usuario</th>
                    <th>Notas</th>
                </tr></thead><tbody>`;

                data.forEach(row => {
                    html += `
                        <tr>
                            <td data-label="Fecha">${(window.FormatUtils ? window.FormatUtils.date(row.created_at) : new Date(row.created_at).toLocaleString())}</td>
                            <td data-label="Producto">${row.product_name}</td>
                            <td data-label="Tipo">${formatMovementType(row.movement_type)}</td>
                            <td data-label="Cant.">${window.FormatUtils ? window.FormatUtils.qty(row.quantity) : row.quantity}</td>
                            <td data-label="Stock Ant.">${window.FormatUtils ? window.FormatUtils.qty(row.previous_stock) : row.previous_stock}</td>
                            <td data-label="Stock Nuevo">${window.FormatUtils ? window.FormatUtils.qty(row.new_stock) : row.new_stock}</td>
                            <td data-label="Usuario">${row.username}</td>
                            <td data-label="Notas">${row.notes || '-'}</td>
                        </tr>
                    `;
                });
            }

            html += '</tbody></table>';
            document.getElementById('reportResults').innerHTML = html;
        }

        function formatPaymentMethod(method) {
            const map = {
                'cash': 'Efectivo',
                'card': 'Tarjeta',
                'transfer': 'Transferencia',
                'mixed': 'Mixto'
            };
            return map[method] || method;
        }

        function formatMovementType(type) {
            const map = {
                'entry': 'Entrada',
                'exit': 'Salida',
                'adjustment': 'Ajuste',
                'sale': 'Venta',

        function getReportSummary() {
            let summary = {};
            if (currentReportType === 'sales') {
                let totalSales = 0;
                let totalProfit = 0;
                currentReportData.forEach(row => {
                    totalSales += parseFloat(row.total);
                    totalProfit += parseFloat(row.profit);
                });
                summary = {
                    'Total Ventas': (window.FormatUtils ? window.FormatUtils.currency(totalSales) : '$' + totalSales.toFixed(2)),
                    'Total Ganancia': (window.FormatUtils ? window.FormatUtils.currency(totalProfit) : '$' + totalProfit.toFixed(2)),
                    'Cantidad de Transacciones': currentReportData.length
                };
            } else if (currentReportType === 'inventory') {
                let totalItems = currentReportData.length;
                let totalStock = 0;
                let totalCostVal = 0;
                let totalPriceVal = 0;
                currentReportData.forEach(row => {
                    totalStock += parseInt(row.current_stock);
                    totalCostVal += parseFloat(row.total_cost_value);
                    totalPriceVal += parseFloat(row.total_price_value);
                });
                summary = {
                    'Total Productos (Items)': totalItems,
                    'Total Unidades en Stock': totalStock,
                    'Valor Total Costo': (window.FormatUtils ? window.FormatUtils.currency(totalCostVal) : '$' + totalCostVal.toFixed(2)),
                    'Valor Total Venta': (window.FormatUtils ? window.FormatUtils.currency(totalPriceVal) : '$' + totalPriceVal.toFixed(2))
                };
            } else if (currentReportType === 'cash_registers') {
                let totalDiff = 0;
                let closedCount = 0;
                currentReportData.forEach(row => {
                    if (row.status === 'closed') {
                        totalDiff += parseFloat(row.difference || 0);
                        closedCount++;
                    }
                });
                summary = {
                    'Total Registros': currentReportData.length,
                    'Cajas Cerradas': closedCount,
                    'Diferencia Acumulada': (window.FormatUtils ? window.FormatUtils.currency(totalDiff) : '$' + totalDiff.toFixed(2))
                };
            } else if (currentReportType === 'cash_movements') {
                let totalIn = 0;
                let totalOut = 0;
                currentReportData.forEach(row => {
                    if (row.movement_type === 'entry' || row.movement_type === 'sale') {
                        totalIn += parseFloat(row.amount);
                    } else if (row.movement_type === 'withdrawal') {
                        totalOut += parseFloat(row.amount);
                    }
                });
                summary = {
                    'Total Movimientos': currentReportData.length,
                    'Total Entradas (Inc. Ventas)': (window.FormatUtils ? window.FormatUtils.currency(totalIn) : '$' + totalIn.toFixed(2)),
                    'Total Retiros': (window.FormatUtils ? window.FormatUtils.currency(totalOut) : '$' + totalOut.toFixed(2)),
                    'Flujo Neto': (window.FormatUtils ? window.FormatUtils.currency(totalIn - totalOut) : '$' + (totalIn - totalOut).toFixed(2))
                };
            } else if (currentReportType === 'top_products') {
                let totalRevenue = 0;
                let totalProfit = 0;
                currentReportData.forEach(row => {
                    totalRevenue += parseFloat(row.revenue);
                    totalProfit += parseFloat(row.profit);
                });
                summary = {
                    'Total Ingresos (Top)': (window.FormatUtils ? window.FormatUtils.currency(totalRevenue) : '$' + totalRevenue.toFixed(2)),
                    'Total Ganancia (Top)': (window.FormatUtils ? window.FormatUtils.currency(totalProfit) : '$' + totalProfit.toFixed(2))
                };
            } else if (currentReportType === 'inventory_movements') {
                let totalMoves = currentReportData.length;
                let entries = 0;
                let exits = 0;
                currentReportData.forEach(row => {
                    if (['entry', 'return'].includes(row.movement_type)) {
                        entries += parseInt(row.quantity);
                    } else {
                        exits += parseInt(row.quantity);
                    }
                });
                summary = {
                    'Total Movimientos': totalMoves,
                    'Total Unidades Entrantes': entries,
                    'Total Unidades Salientes': exits
                };
            }
            return summary;
        }

        function getThemeColors() {
            const savedTheme = localStorage.getItem('pos_theme_config');
            if (savedTheme) {
                try {
                    return JSON.parse(savedTheme);
                } catch (e) {
                    console.error('Error parsing theme config:', e);
                }
            }
            return null;
        }

        function getContrastColor(hexColor) {
            // Convert hex to RGB
            const r = parseInt(hexColor.substr(1, 2), 16);
            const g = parseInt(hexColor.substr(3, 2), 16);
            const b = parseInt(hexColor.substr(5, 2), 16);
            
            // Calculate luminance
            const yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            
            // Return black or white based on luminance
            return (yiq >= 128) ? '#000000' : '#FFFFFF';
        }

            // ============================================================

            // A diferencia de html2canvas (que rasteriza a imagen y corta

            // con paginación automática: las filas nunca se cortan a la
            // mitad y el contenido se reparte limpiamente entre hojas.
            // ============================================================

            // Configurar cabeceras y filas según el tipo de reporte
            let tableHead = [];

            const money = (v) => window.FormatUtils ? window.FormatUtils.currency(v) : '$' + (parseFloat(v) || 0).toFixed(2);

            switch (currentReportType) {

                        formatPaymentMethod(r.payment_method),
                        money(r.total),
                        money(r.profit)
                    ]);
                    break;
                case 'inventory':
                    tableHead = [['Producto', 'Código', 'Stock', 'Costo', 'Precio', 'V. Costo', 'V. Venta']];
                    tableRows = currentReportData.map(r => [
                        r.product_name,
                        r.barcode || '-',
                        r.current_stock,
                        money(r.cost),
                        money(r.price),
                        money(r.total_cost_value),
                        money(r.total_price_value)
                    ]);
                    break;
                case 'top_products':
                    tableHead = [['Producto', 'Código', 'Unidades', 'Ingresos', 'Ganancia']];
                    tableRows = currentReportData.map(r => [
                        r.product_name,
                        r.barcode || '-',
                        r.total_sold,
                        money(r.revenue),
                        money(r.profit)
                    ]);
                    break;
                case 'inventory_movements':
                    tableHead = [['Fecha', 'Producto', 'Tipo', 'Cant.', 'Stock Ant.', 'Stock Nuevo', 'Usuario', 'Notas']];
                    tableRows = currentReportData.map(r => [
                        (window.FormatUtils ? window.FormatUtils.date(r.created_at) : new Date(r.created_at).toLocaleString()),
                        r.product_name,
                        formatMovementType(r.movement_type),
                        r.quantity,
                        r.previous_stock,
                        r.new_stock,
                        r.username || '-',
                        r.notes || '-'
                    ]);
                    break;
                case 'cash_registers':
                    tableHead = [['ID', 'Apertura', 'Cierre', 'Terminal', 'Usuario', 'Inicial', 'Final', 'Diferencia', 'Estado']];
                    tableRows = currentReportData.map(r => {
                        const diff = parseFloat(r.difference || 0);
                        return [
                            '#' + r.register_id,
                            (window.FormatUtils ? window.FormatUtils.date(r.opening_date) : new Date(r.opening_date).toLocaleString()),
                            r.closing_date ? (window.FormatUtils ? window.FormatUtils.date(r.closing_date) : new Date(r.closing_date).toLocaleString()) : '-',
                            r.terminal_name || 'General',
                            r.username || '-',
                            money(r.initial_amount),
                            r.final_amount !== null ? money(r.final_amount) : '-',
                            r.difference !== null ? money(diff) : '-',
                            r.status === 'open' ? 'Abierta' : 'Cerrada'
                        ];
                    });
                    break;
                case 'cash_movements':
                    tableHead = [['Fecha', 'Terminal', 'Usuario', 'Tipo', 'Monto', 'Descripción']];
                    tableRows = currentReportData.map(r => {
                        let typeLabel = r.movement_type;
                        if (r.movement_type === 'entry') typeLabel = 'Entrada';
                        else if (r.movement_type === 'withdrawal') typeLabel = 'Retiro';
                        else if (r.movement_type === 'sale') typeLabel = 'Venta';
                        return [
                            (window.FormatUtils ? window.FormatUtils.date(r.created_at) : new Date(r.created_at).toLocaleString()),
                            r.terminal_name || 'General',
                            r.username || '-',
                            typeLabel,
                            money(r.amount),
                            r.description || '-'
                        ];
                    });
                    break;
                default:
                    // Reporte genérico: volcar columnas del primer registro
                    if (currentReportData.length > 0) {
                        tableHead = [Object.keys(currentReportData[0])];
                        tableRows = currentReportData.map(r => Object.values(r).map(v => v === null || v === undefined ? '-' : String(v)));
                    }
            }

            if (tableHead.length === 0 || tableRows.length === 0) {
                showNotification('No hay datos para exportar a PDF', 'warning');
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();
            const margin = 14;
            const contentWidth = pageWidth - (margin * 2);

            // Parsear el color primario del negocio a RGB
            const hexToRgb = (hex) => {
                const h = hex.replace('#', '');
                return [parseInt(h.substr(0, 2), 16), parseInt(h.substr(2, 2), 16), parseInt(h.substr(4, 2), 16)];
            };
            const primaryRGB = hexToRgb(primaryColor);
            // Versión oscura del primario (para la banda superior degradada)
            const darken = (rgb, f) => rgb.map(v => Math.max(0, Math.round(v * f)));
            const primaryDarkRGB = darken(primaryRGB, 0.78);

            // Cargar el logo (si existe) a dataURL para poder insertarlo
            let logoDataUrl = null;
            try {
                if (logoUrl && logoUrl !== 'assets/images/default-logo.png') {
                    const imgResp = await fetch(logoUrl);
                    if (imgResp.ok) {
                        const blob = await imgResp.blob();
                        logoDataUrl = await new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onload = () => resolve(reader.result);
                            reader.onerror = () => resolve(null);
                            reader.readAsDataURL(blob);
                        });
                    }
                }
            } catch (e) { logoDataUrl = null; }

            // Periodo del reporte (si aplica)
            let periodStr = '';
            try {
                const sd = document.getElementById('startDate');
                const ed = document.getElementById('endDate');
                if (sd && sd.value) {
                    const s = new Date(sd.value);
                    const e = ed && ed.value ? new Date(ed.value) : new Date();
                    periodStr = (window.FormatUtils ? window.FormatUtils.dateOnly(s) : s.toLocaleDateString()) + ' - ' + (ed && ed.value ? (window.FormatUtils ? window.FormatUtils.dateOnly(e) : e.toLocaleDateString()) : 'Hoy');
                }
            } catch (e) { periodStr = ''; }

            const dateStrFull = (window.FormatUtils ? window.FormatUtils.dateLong(now) : now.toLocaleDateString('es-MX', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }));
            const timeStr = window.FormatUtils ? window.FormatUtils.timeOnly(now) : now.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });

            // ============================================================
            // ENCABEZADO: banda de color primario con logo y nombre
            // ============================================================
            const headerH = 46;
            // Banda principal (color primario)
            doc.setFillColor(primaryRGB[0], primaryRGB[1], primaryRGB[2]);
            doc.rect(0, 0, pageWidth, headerH, 'F');
            // Franja inferior más oscura (detalle de diseño)
            doc.setFillColor(primaryDarkRGB[0], primaryDarkRGB[1], primaryDarkRGB[2]);
            doc.rect(0, headerH - 2.5, pageWidth, 2.5, 'F');

            // Texto del encabezado: contraste sobre el primario
            const headerTextRGB = getContrastColor(primaryColor) === '#000000' ? [30, 30, 46] : [255, 255, 255];

            // Logo a la izquierda (dentro de un CÍRCULO blanco, imagen contenida sin distorsión)
            let logoX = margin, logoY = 8, logoD = 24; // diámetro del círculo
            if (logoDataUrl) {
                // Círculo blanco de fondo
                doc.setFillColor(255, 255, 255);
                doc.circle(logoX + logoD / 2, logoY + logoD / 2, logoD / 2, 'F');
                try {
                    // Obtener dimensiones reales de la imagen para contenerla (object-fit: contain)
                    let iw = logoD, ih = logoD;
                    try { const ip = doc.getImageProperties(logoDataUrl); if (ip && ip.width && ip.height) { iw = ip.width; ih = ip.height; } } catch (e2) {}
                    const r = iw / ih;
                    let dw = logoD, dh = logoD;
                    // contain: ajustar al interior del círculo conservando proporción,
                    // con un pequeño margen para que no toque el borde.
                    const pad = 0.78;
                    if (r >= 1) { dw = logoD * pad; dh = dw / r; } else { dh = logoD * pad; dw = dh * r; }
                    doc.addImage(logoDataUrl, 'PNG', logoX + (logoD - dw) / 2, logoY + (logoD - dh) / 2, dw, dh, undefined, 'FAST');
                } catch (e) {
                    try { doc.addImage(logoDataUrl, 'JPEG', logoX + (logoD - logoD * 0.78) / 2, logoY + (logoD - logoD * 0.78) / 2, logoD * 0.78, logoD * 0.78, undefined, 'FAST'); }
                    catch (e2) { /* sin logo */ }
                }
            } else {
                // Sin logo: icono de tienda (círculo con inicial)
                doc.setFillColor(255, 255, 255);
                doc.circle(logoX + logoD / 2, logoY + logoD / 2, logoD / 2 + 1, 'F');
                doc.setTextColor(primaryRGB[0], primaryRGB[1], primaryRGB[2]);
                doc.setFont('helvetica', 'bold');
                doc.setFontSize(22);
                doc.text((storeName || 'T').charAt(0).toUpperCase(), logoX + logoD / 2, logoY + logoD / 2 + 7, { align: 'center' });
            }

            // Nombre del negocio a la derecha del logo

            doc.setFont('helvetica', 'bold');
            doc.setFontSize(19);
            doc.text(storeName, textX, 20);

            // Título del reporte (debajo del nombre)

            doc.setFontSize(11);
            doc.setTextColor(headerTextRGB[0], headerTextRGB[1], headerTextRGB[2]);
            doc.text(reportTitle, textX, 28);

            // Línea blanca decorativa

            doc.setLineWidth(0.3);
            doc.setLineDashPattern([1, 1], 0);
            doc.line(textX, 32, pageWidth - margin, 32);
            doc.setLineDashPattern([], 0);

            // ============================================================
            // TARJETA DE INFORMACIÓN (fecha, generado por, periodo)
            // ============================================================
            let y = headerH + 8;
            const infoCardH = 22;
            doc.setFillColor(245, 245, 245);
            doc.roundedRect(margin, y, contentWidth, infoCardH, 2, 2, 'F');
            doc.setDrawColor(primaryRGB[0], primaryRGB[1], primaryRGB[2]);
            doc.setLineWidth(0.6);
            doc.line(margin, y, margin, y + infoCardH);

            doc.setFontSize(8.5);
            doc.setTextColor(120, 120, 120);
            doc.setFont('helvetica', 'bold');
            doc.text('FECHA DE CREACIÓN', margin + 4, y + 6);
            doc.text('GENERADO POR', margin + 4 + contentWidth * 0.32, y + 6);
            doc.text('PERIODO', margin + 4 + contentWidth * 0.62, y + 6);

            doc.setFontSize(9.5);
            doc.text(`${dateStrFull}`, margin + 4, y + 12);
            doc.text(`${timeStr} hrs`, margin + 4, y + 17);
            doc.text(userName, margin + 4 + contentWidth * 0.32, y + 12);
            doc.text(user.role ? user.role.charAt(0).toUpperCase() + user.role.slice(1) : '', margin + 4 + contentWidth * 0.32, y + 17);
            doc.text(periodStr || 'Todos los datos', margin + 4 + contentWidth * 0.62, y + 12);

            // Separadores verticales de la tarjeta
            doc.setDrawColor(210, 210, 210);
            doc.setLineWidth(0.2);
            doc.line(margin + contentWidth * 0.31, y + 2, margin + contentWidth * 0.31, y + infoCardH - 2);
            doc.line(margin + contentWidth * 0.61, y + 2, margin + contentWidth * 0.61, y + infoCardH - 2);

            // ============================================================
            // RESUMEN (si hay)
            // ============================================================
            const summary = getReportSummary();
            let yStart = y + infoCardH + 8;
            const summaryKeys = Object.keys(summary);
            if (summaryKeys.length > 0) {
                // Tarjeta de resumen con borde superior de color
                const sumH = 10 + (summaryKeys.length * 5);
                doc.setFillColor(250, 250, 250);
                doc.roundedRect(margin, yStart - 2, contentWidth, sumH, 2, 2, 'F');
                doc.setDrawColor(primaryRGB[0], primaryRGB[1], primaryRGB[2]);
                doc.setLineWidth(0.8);
                doc.line(margin, yStart - 2, margin, yStart - 2 + sumH);

                doc.setFont('helvetica', 'bold');
                doc.setFontSize(10);
                doc.setTextColor(30, 30, 46);
                doc.text('Resumen', margin + 4, yStart + 4);
                doc.setFont('helvetica', 'normal');

                let sy = yStart + 10;
                summaryKeys.forEach(k => {
                    doc.setFontSize(9);
                    doc.text(`- ${k}: ${summary[k]}`, margin + 4, sy);
                    sy += 5;
                });
                yStart = yStart + sumH + 8;
            }


            // Tabla real con autoTable (paginación automática, filas intactas)
            const headerRGB = [
                parseInt(primaryColor.substr(1, 2), 16),
                parseInt(primaryColor.substr(3, 2), 16),
                parseInt(primaryColor.substr(5, 2), 16)
            ];
            const headerTextRGBTable = getContrastColor(primaryColor) === '#000000' ? [0, 0, 0] : [255, 255, 255];

            doc.autoTable({
                head: tableHead,
                body: tableRows,
                startY: yStart,
                margin: { left: margin, right: margin, top: 40, bottom: 20 },
                styles: {
                    font: 'helvetica',
                    fontSize: 8,
                    cellPadding: 2,
                    textColor: [26, 26, 46],
                    lineColor: [204, 204, 204],
                    lineWidth: 0.15,
                    overflow: 'linebreak',
                    valign: 'middle'
                },
                headStyles: {
                    fillColor: headerRGB,
                    textColor: headerTextRGBTable,
                    fontStyle: 'bold',
                    fontSize: 8.5
                },
                alternateRowStyles: {
                    fillColor: [245, 245, 245]
                },
                didDrawPage: (data) => {
                    // Pie de página: número de página
                    const pageCount = doc.internal.getNumberOfPages();
                    doc.setFontSize(8);
                    doc.setTextColor(120, 120, 120);
                    doc.text(`Página ${doc.internal.getCurrentPageInfo().pageNumber} de ${pageCount}`, pageWidth / 2, doc.internal.pageSize.getHeight() - 8, { align: 'center' });
                    // Título corto en cabecera de páginas siguientes
                    if (doc.internal.getCurrentPageInfo().pageNumber > 1) {
                        doc.setFontSize(8);
                        doc.setTextColor(85, 85, 85);
                        doc.text(`${storeName} - ${reportTitle}`, margin, 12);
                        doc.setDrawColor(headerRGB[0], headerRGB[1], headerRGB[2]);
                        doc.setLineWidth(0.6);
                        doc.line(margin, 14, pageWidth - margin, 14);
                    }
                }
            });

            doc.save(`Reporte_${currentReportType}_${now.toISOString().split('T')[0]}.pdf`);
        }

        function renderProductGrid(products) {
            const grid = document.getElementById('qrProductGrid');
            if (!grid) return;

            if (products.length === 0) {
                grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 20px; color: var(--text-muted);">No se encontraron productos</div>';
                return;
            }

            grid.innerHTML = products.map(p => {
                const hasCode = p.barcode || p.qr_code;
                const rawImg = p.image_path || p.image_url;
                const imgPath = getRelativeImagePath(rawImg);
                
                const imgHtml = imgPath 
                    ? `<img src="${imgPath}" class="qr-product-img" alt="${p.product_name}" onerror="this.outerHTML='<div class=\\'qr-product-img\\' style=\\'display:flex;align-items:center;justify-content:center;background:var(--bg-light);color:var(--text-muted);font-size:2rem;\\'><i class=\\'fas fa-box\\'></i></div>'">`
                    : `<div class="qr-product-img" style="display:flex;align-items:center;justify-content:center;background:var(--bg-light);color:var(--text-muted);font-size:2rem;"><i class="fas fa-box"></i></div>`;

                const stock = p.current_stock !== null ? p.current_stock : 0;
                
                return `
                    <div class="qr-product-card ${!hasCode ? 'no-qr' : ''}" onclick="${hasCode ? `addToQRListFromGrid(${p.product_id})` : `openAssignQRModal(${p.product_id})`}">
                        ${!hasCode ? '<span class="qr-status-badge">Sin QR asignado</span>' : ''}
                        ${imgHtml}
                        <div class="qr-product-name" title="${p.product_name}">${p.product_name}</div>
                        <div class="qr-product-stock">Stock: ${stock}</div>
                    </div>
                `;
            }).join('');
        }

        function filterProductGrid(term) {
            term = term.toLowerCase().trim();
            if (!term) {
                renderProductGrid(allProducts);
                return;
            }
            
            const filtered = allProducts.filter(p => 
                p.product_name.toLowerCase().includes(term) || 
                (p.barcode && p.barcode.toLowerCase().includes(term)) ||
                (p.qr_code && p.qr_code.toLowerCase().includes(term))
            );
            renderProductGrid(filtered);
        }

        function updateGlobalSize(val) {
            currentQRSize = parseFloat(val);
        }

        function addToQRListFromGrid(productId) {
            const product = allProducts.find(p => p.product_id == productId);
            if (!product) return;

            const codeToUse = product.barcode || product.qr_code;
            if (!codeToUse) return;

            // Check if already in list
            const existingItem = qrLabelList.find(item => item.product.product_id == product.product_id);
            
            if (existingItem) {
                existingItem.quantity++;
                showNotification(`Cantidad aumentada: ${product.product_name}`, 'info');
            } else {
                qrLabelList.push({
                    id: Date.now(),
                    product: product,
                    code: codeToUse,
                    sizeCm: currentQRSize,
                    quantity: 1
                });
                showNotification(`Agregado: ${product.product_name}`, 'success');
            }
            
            updateQRListTable();
        }

        function updateItemQuantity(id, newQty) {
            const item = qrLabelList.find(i => i.id === id);
            if (item) {
                item.quantity = parseInt(newQty);
                if (item.quantity < 1) item.quantity = 1;
            }
        }

        function removeFromQRList(id) {
            qrLabelList = qrLabelList.filter(item => item.id !== id);
            updateQRListTable();
        }

        function clearQRList() {
            qrLabelList = [];
            updateQRListTable();
            showNotification('Lista limpiada', 'info');
        }

                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted);">Seleccione productos del grid para agregar a la lista</td></tr>';

        // --- Assign QR Modal Logic ---
        function openAssignQRModal(productId) {
            const product = allProducts.find(p => p.product_id == productId);
            if (!product) return;

            document.getElementById('assignQRProductId').value = productId;
            document.getElementById('assignQRProductName').textContent = product.product_name;
            document.getElementById('assignQRInput').value = '';
            
            const modal = document.getElementById('assignQRModal');
            modal.classList.add('show');
            
            setTimeout(() => document.getElementById('assignQRInput').focus(), 100);
        }

        function closeAssignQRModal() {
            document.getElementById('assignQRModal').classList.remove('show');
        }

        async function saveProductQR() {
            const productId = document.getElementById('assignQRProductId').value;
            const code = document.getElementById('assignQRInput').value.trim();
            
            if (!code) {
                showNotification('Por favor ingrese un código', 'warning');
                return;
            }

            const product = allProducts.find(p => p.product_id == productId);
            if (!product) return;

            // Prepare update data (we need to send all required fields or the API might complain if it expects full object)
            // Based on inventory.js, it sends a full object. Let's try to construct it from existing data.
            const updateData = {
                product_id: product.product_id,
                product_name: product.product_name,
                description: product.description || '',
                category_id: product.category_id,
                status: product.status || 'active',
                barcode: code, // Updating this
                qr_code: product.qr_code || code, // Also update QR code field if empty
                price: parseFloat(product.price),
                cost: parseFloat(product.cost),
                min_stock: parseInt(product.min_stock || 0)
            };

            try {
                const response = await fetch('../api/inventory/products.php', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updateData)
                });

                const result = await response.json();

                if (result.success) {
                    showNotification('Código asignado correctamente', 'success');
                    
                    // Update local data
                    product.barcode = code;
                    if (!product.qr_code) product.qr_code = code;
                    
                    // Refresh grid
                    const searchTerm = document.getElementById('qrProductSearch').value;
                    filterProductGrid(searchTerm);
                    
                    closeAssignQRModal();
                } else {
                    throw new Error(result.message || 'Error al guardar');
                }
            } catch (error) {
                console.error(error);
                showNotification('Error: ' + error.message, 'error');
            }
        }

        function printQRLabels() {
            if (qrLabelList.length === 0) {
                showNotification('Agregue productos a la lista primero.', 'warning');
                return;
            }

            const printArea = document.getElementById('printArea');
            printArea.innerHTML = '';
            
            const printContainer = document.createElement('div');
            printContainer.style.width = '100%';
            printContainer.style.display = 'flex';
            printContainer.style.flexWrap = 'wrap';
            printContainer.style.gap = '0';
            
            qrLabelList.forEach(item => {
                // Generamos el QR con alta resolución interna
                const qrResolution = 256; 

                for (let i = 0; i < item.quantity; i++) {
                    const label = document.createElement('div');
                    label.className = 'qr-label';
                    
                    // Dimensiones exactas dadas por el usuario
                    label.style.width = `${item.sizeCm}cm`;
                    label.style.height = `${item.sizeCm}cm`;
                    
                    // Layout Flexbox para ocupar todo el espacio
                    label.style.display = 'flex';
                    label.style.flexDirection = 'column';
                    label.style.alignItems = 'center';
                    label.style.justifyContent = 'center';
                    label.style.boxSizing = 'border-box';
                    label.style.padding = '2px';
                    label.style.border = '1px dotted var(--border-color)'; // Guía de corte
                    label.style.pageBreakInside = 'avoid';
                    label.style.overflow = 'hidden';
                    label.style.margin = '0'; // Sin margen externo para aprovechar hoja

                    // Contenedor QR - Ocupa el espacio disponible
                    const qrDiv = document.createElement('div');
                    qrDiv.className = 'qr-code-container';
                    qrDiv.style.flex = '1';
                    qrDiv.style.width = '100%';
                    qrDiv.style.display = 'flex';
                    qrDiv.style.alignItems = 'center';
                    qrDiv.style.justifyContent = 'center';
                    qrDiv.style.overflow = 'hidden';
                    qrDiv.style.minHeight = '0'; // Importante para flexbox anidado
                    
                    new QRCode(qrDiv, {
                        text: item.code,
                        width: qrResolution,
                        height: qrResolution,
                        correctLevel : QRCode.CorrectLevel.H
                    });

                    // Contenedor Texto - Fijo abajo
                    const textDiv = document.createElement('div');
                    textDiv.style.textAlign = 'center';
                    textDiv.style.fontSize = '8px'; // Letra pequeña
                    textDiv.style.width = '100%';
                    textDiv.style.whiteSpace = 'nowrap';
                    textDiv.style.overflow = 'hidden';
                    textDiv.style.textOverflow = 'ellipsis';
                    textDiv.style.marginTop = '1px';
                    textDiv.style.flexShrink = '0'; // No encoger el texto
                    textDiv.innerText = item.product.product_name;

                    label.appendChild(qrDiv);
                    label.appendChild(textDiv);
                    printContainer.appendChild(label);
                }
            });

            printArea.appendChild(printContainer);

            // Esperar a que se generen los QR
            setTimeout(() => {
                // Limpiar duplicados (canvas + img) que genera la librería qrcode.js
                const qrContainers = printContainer.querySelectorAll('.qr-code-container');
                
                qrContainers.forEach(container => {
                    const canvas = container.querySelector('canvas');
                    // Si hay canvas, creamos una imagen limpia desde él y borramos todo lo demás
                    if (canvas) {
                        const img = document.createElement('img');
                        img.src = canvas.toDataURL();
                        img.style.width = '100%';
                        img.style.height = '100%';
                        img.style.objectFit = 'contain';
                        img.style.display = 'block';
                        
                        container.innerHTML = ''; // Borra canvas y posible img oculta duplicada
                        container.appendChild(img);
                    } else {
                        // Si no hay canvas, buscamos la imagen generada
                        const img = container.querySelector('img');
                        if (img) {
                            img.style.width = '100%';
                            img.style.height = '100%';
                            img.style.objectFit = 'contain';
                            img.style.display = 'block';
                        }
                    }
                });
                
                const printWindow = window.open('', '', 'height=600,width=800');
                printWindow.document.write('<html><head><title>Imprimir Etiquetas QR</title>');
                printWindow.document.write('<style>');
                printWindow.document.write(`
                    body { margin: 0; padding: 10px; font-family: sans-serif; }
                    .qr-label { 
                        float: left;
                        box-sizing: border-box;
                        page-break-inside: avoid;
                    }
                    @media print {
                        @page { margin: 0.5cm; }
                        .qr-label { 
                            border: 1px dotted var(--border-color); 
                        }
                    }
                `);
                printWindow.document.write('</style></head><body>');
                printWindow.document.write(printContainer.innerHTML);
                printWindow.document.write('</body></html>');
                printWindow.document.close();
                printWindow.focus();
                setTimeout(() => {
                    printWindow.print();
                }, 500);
            }, 500);
        }

        /* ============================================================
         * Modal de detalle de venta (reportes)
         * ============================================================ */
        function formatCurrency(n) {
            // Delegar en FormatUtils (formato regional de la empresa).
            if (window.FormatUtils) return window.FormatUtils.currency(n);
            return new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(Number(n) || 0);
        }

        function formatQuantity(qty) {
            if (window.FormatUtils) return window.FormatUtils.qty(qty);
            const n = Number(qty);
            if (Number.isNaN(n)) return String(qty ?? '');
            return Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/\.?0+$/, '');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = String(str ?? '');
            return div.innerHTML;
        }

        async function showSaleDetail(saleId) {
            const modal = document.getElementById('saleDetailModal');
            const body = document.getElementById('saleDetailBody');
            const title = document.getElementById('saleDetailTitle');
            if (!modal || !body) return;

            title.textContent = `Venta #${saleId}`;
            body.innerHTML = (typeof saleDetailSkeletonHTML === 'function')
                ? saleDetailSkeletonHTML()
                : '<div style="text-align:center; padding: 2rem;"><i class="fas fa-spinner fa-spin" style="font-size: 1.5rem; color: var(--text-muted);"></i><p>Cargando detalle...</p></div>';
            if (typeof modal.showModal === 'function') {
                modal.showModal();
            } else {
                modal.classList.add('show');
            }

            try {
                const resp = await fetch(`../api/sales/sale_details.php?sale_id=${saleId}`);
                const data = await resp.json();
                if (!data.success || !data.data) {
                    throw new Error(data.message || 'No se pudo cargar el detalle');
                }
                const d = data.data;

                const fecha = window.FormatUtils ? window.FormatUtils.date(new Date(d.sale_date + ' UTC')) : new Date(d.sale_date + ' UTC').toLocaleString('es-MX', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
                const metodo = { cash: 'Efectivo', card: 'Tarjeta', transfer: 'Transferencia', mixed: 'Mixto' }[d.payment_method] || d.payment_method;

                let html = `
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1rem; background: var(--bg-light); border-radius: 10px; padding: 0.9rem 1rem; margin-bottom: 1rem; font-size: 0.9rem;">
                        <div><strong>Fecha:</strong> ${fecha}</div>
                        <div><strong>Método:</strong> ${metodo}</div>
                        <div><strong>Subtotal:</strong> ${formatCurrency(d.subtotal)}</div>
                        <div><strong>Total:</strong> ${formatCurrency(d.total)}</div>
                        ${d.discount > 0 ? `<div><strong>Descuento:</strong> -${formatCurrency(d.discount)}</div>` : ''}
                        ${d.tax > 0 ? `<div><strong>Impuesto:</strong> ${formatCurrency(d.tax)}</div>` : ''}
                    </div>
                    <table class="dashboard-table" style="width:100%; font-size: 0.9rem;">
                        <thead>
                            <tr>
                                <th>Producto</th>
                                <th style="text-align:center;">Cant.</th>
                                <th style="text-align:right;">P. Unit.</th>
                                <th style="text-align:right;">Total</th>
                            </tr>
                        </thead>
                        <tbody>
                `;
                if (d.items && d.items.length) {
                    d.items.forEach(it => {
                        html += `
                            <tr>
                                <td data-label="Producto"><strong>${escapeHtml(it.product_name || 'Producto')}</strong>${it.category_name ? `<br><small style="color:var(--text-muted);">${escapeHtml(it.category_name)}</small>` : ''}</td>
                                <td data-label="Cant." style="text-align:center;">${formatQuantity(it.quantity)}</td>
                                <td data-label="P. Unit." style="text-align:right;">${formatCurrency(it.unit_price)}</td>
                                <td data-label="Total" style="text-align:right; font-weight:bold;">${formatCurrency(it.total)}</td>
                            </tr>
                        `;
                    });
                } else {
                    html += '<tr><td colspan="4" style="text-align:center; padding:1rem;">Sin productos registrados</td></tr>';
                }
                html += `</tbody></table>`;
                body.innerHTML = html;
            } catch (error) {
                console.error('Error cargando detalle de venta:', error);
                body.innerHTML = `<div style="text-align:center; padding: 2rem; color: var(--danger-color);"><i class="fas fa-exclamation-triangle"></i><p>${escapeHtml(error.message)}</p></div>`;
            }
        }

        // Cerrar modal (botón X, clic fuera, Escape)
        document.addEventListener('DOMContentLoaded', () => {
            const modal = document.getElementById('saleDetailModal');
            if (!modal) return;
            const closeBtn = document.getElementById('saleDetailClose');
            const closeModal = () => {
                if (typeof modal.close === 'function') {
                    modal.close();
                } else {
                    modal.classList.remove('show');
                }
            };
            if (closeBtn) {
                closeBtn.addEventListener('click', closeModal);
            }
            // Clic fuera del contenido cierra el diálogo
            modal.addEventListener('click', (e) => {
                if (e.target === modal) closeModal();
            });
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modal.open) closeModal();
            });
        });

        /* ============================================================
         * Cierre Z / Auditoría diaria
         * ============================================================ */
        function methodLabel(m) {
            return { cash: 'Efectivo', card: 'Tarjeta', transfer: 'Transferencia', mixed: 'Mixto' }[m] || m;
        }

        function renderCloseZ(d) {
            const resultsDiv = document.getElementById('reportResults');
            if (!d) {
                resultsDiv.innerHTML = '<div class="empty-state"><i class="fas fa-search"></i><p>No se encontraron datos para la fecha seleccionada</p></div>';
                return;
            }
            const s = d.summary || {};
            const fmt = n => window.FormatUtils ? window.FormatUtils.currency(n) : new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(Number(n) || 0);

            let methodRows = '';
            (d.by_payment_method || []).forEach(m => {
                methodRows += `
                    <tr>
                        <td data-label="Método">${methodLabel(m.payment_method)}</td>
                        <td data-label="Ventas" style="text-align:center;">${m.count}</td>
                        <td data-label="Total" style="text-align:right;">${fmt(m.total)}</td>
                    </tr>`;
            });
            if (!methodRows) {
                methodRows = '<tr><td colspan="3" style="text-align:center; padding: 1rem;">Sin ventas en el periodo</td></tr>';
            }

            const cm = d.cash_movements || {};

            resultsDiv.innerHTML = `
                <div style="display:grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 1.2rem;">
                    <div class="closez-card" style="background: var(--info-color); color:#fff; border-radius:12px; padding:0.9rem 1rem;">
                        <div style="font-size:0.8rem; color: var(--text-light);">VENTAS</div>
                        <div style="font-size:1.3rem; font-weight:800; color: var(--text-color);">${fmt(s.total_sales)}</div>
                        <div style="font-size:0.75rem; color: var(--text-muted);">${s.total_transactions || 0} transacciones</div>
                    </div>
                    <div class="closez-card" style="background: var(--success-color); color:#fff; border-radius:12px; padding:0.9rem 1rem;">
                        <div style="font-size:0.8rem; color: var(--text-light);">GANANCIA</div>
                        <div style="font-size:1.3rem; font-weight:800; color: var(--success-color);">${fmt(s.total_profit)}</div>
                        <div style="font-size:0.75rem; color: var(--text-muted);">Ticket prom. ${fmt(s.avg_ticket)}</div>
                    </div>
                    <div class="closez-card" style="background: var(--warning-color); color:#fff; border-radius:12px; padding:0.9rem 1rem;">
                        <div style="font-size:0.8rem; color: var(--text-light);">DEVOLUCIONES</div>
                        <div style="font-size:1.3rem; font-weight:800; color: var(--warning-color);">${fmt(d.refunds?.total)}</div>
                        <div style="font-size:0.75rem; color: var(--text-muted);">${d.refunds?.count || 0} devoluciones</div>
                    </div>
                    <div class="closez-card" style="background: var(--danger-color); color:#fff; border-radius:12px; padding:0.9rem 1rem;">
                        <div style="font-size:0.8rem; color: var(--text-light);">CANCELADAS</div>
                        <div style="font-size:1.3rem; font-weight:800; color: var(--danger-color);">${fmt(d.cancelled?.total)}</div>
                        <div style="font-size:0.75rem; color: var(--text-muted);">${d.cancelled?.count || 0} cancelaciones</div>
                    </div>
                    <div class="closez-card" style="background: var(--primary-color); color:#fff; border-radius:12px; padding:0.9rem 1rem; grid-column: span 2;">
                        <div style="font-size:0.8rem; color: var(--text-light);">EFECTIVO ESPERADO EN CAJA</div>
                        <div style="font-size:1.5rem; font-weight:800; color: var(--primary-color);">${fmt(d.expected_cash)}</div>
                        <div style="font-size:0.75rem; color: var(--text-muted);">Inicial + ventas efectivo − retiros + entradas − devoluciones</div>
                    </div>
                </div>

                <h3 style="margin: 1rem 0 0.5rem; font-size: 1rem;"><i class="fas fa-credit-card"></i> Ventas por método de pago</h3>
                <table class="dashboard-table" style="width:100%; font-size:0.9rem; margin-bottom: 1.2rem;">
                    <thead><tr><th>Método</th><th style="text-align:center;">Ventas</th><th style="text-align:right;">Total</th></tr></thead>
                    <tbody>${methodRows}</tbody>
                </table>

                <h3 style="margin: 1rem 0 0.5rem; font-size: 1rem;"><i class="fas fa-coins"></i> Movimientos de caja</h3>
                <table class="dashboard-table" style="width:100%; font-size:0.9rem;">
                    <thead><tr><th>Concepto</th><th style="text-align:right;">Monto</th></tr></thead>
                    <tbody>
                        <tr><td data-label="Concepto">Ventas en efectivo</td><td data-label="Monto" style="text-align:right;">${fmt(cm.cash_sales)}</td></tr>
                        <tr><td data-label="Concepto">Retiros</td><td data-label="Monto" style="text-align:right; color: var(--danger-color);">− ${fmt(cm.withdrawals)}</td></tr>
                        <tr><td data-label="Concepto">Entradas / gastos registrados</td><td data-label="Monto" style="text-align:right; color: var(--success-color);">+ ${fmt(cm.entries)}</td></tr>
                    </tbody>
                </table>

                <div style="margin-top: 1rem; font-size: 0.8rem; color: var(--text-muted); text-align:center;">
                    Auditoría del ${d.date} · Cierre Z · Tomodachi POS
                </div>
            `;
        }
    </script>
    <script src="lib/animejs/anime.min.js"></script>
    <script src="js/design-system.js?v=5"></script>
</body>

</html>
