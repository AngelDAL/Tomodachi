<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#39C5BB">
    <title>Mi pedido - Tomodachi</title>
    <link rel="stylesheet" href="css/fonts.css?v=4">
    <link rel="stylesheet" href="lib/fontawesome/css/all.min.css?v=4">
    <link rel="stylesheet" href="css/variables.css?v=6">
    <link rel="stylesheet" href="css/design-system.css?v=10">
    <style>
        /* Los colores del NEGOCIO y del DISPOSITIVO llegan por JS; esto es el respaldo claro. */
        :root {
            --cta-primary: #39C5BB;
            --cta-primary-2: #61C2E8;
            --cta-bg: #f4f7f6;
            --cta-card: #ffffff;
            --cta-text: #1a1a2e;
            --cta-muted: #66707a;
            --cta-border: #e3e8ec;
            --cta-ok: #2E7D32;
            --cta-warn: #B45309;
            --cta-alto: #D32F2F;
            color-scheme: light;
        }
        .hidden { display: none !important; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            font-family: var(--font-body, system-ui, -apple-system, sans-serif);
            background: var(--cta-bg);
            color: var(--cta-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 12px 12px 28px;
            transition: background-color .35s ease;
            -webkit-text-size-adjust: 100%;
        }
        /* Cuando el pedido está listo, toda la página se tiñe: que se note. */
        body.pedido-listo { background: color-mix(in srgb, var(--cta-ok) 14%, var(--cta-bg)); }
        @supports not (background: color-mix(in srgb, red 10%, blue)) {
            body.pedido-listo { background: var(--cta-bg); }
        }
        .wrap { width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 10px; }

        /* ── Barra superior: marca + folio, en una sola línea ── */
        .barra { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 4px; }
        .barra-marca { display: flex; align-items: center; gap: 7px; font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--cta-muted); }
        .barra-marca i { color: var(--cta-primary); }
        .barra-folio { font-family: var(--font-heading, inherit); font-weight: 800; font-size: 1.05rem; }

        .tarjeta { background: var(--cta-card); border: 1px solid var(--cta-border); border-radius: 16px; padding: 12px 14px; }
        .tarjeta-titulo { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: .72rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--cta-muted); margin-bottom: 8px; }
        .tarjeta-titulo .nombre { text-transform: none; letter-spacing: 0; font-weight: 600; font-size: .82rem; }

        /* ── Estado: franja compacta; solo "listo" se hace grande ── */
        .estado {
            display: flex; align-items: center; gap: 11px;
            border-radius: 14px; padding: 11px 14px;
            background: color-mix(in srgb, var(--cta-primary) 12%, var(--cta-card));
            border: 1px solid color-mix(in srgb, var(--cta-primary) 30%, transparent);
            transition: all .35s ease;
        }
        .estado-icono {
            width: 38px; height: 38px; border-radius: 11px; flex: 0 0 auto;
            display: flex; align-items: center; justify-content: center; font-size: 1rem;
            background: var(--cta-primary); color: #fff;
        }
        .estado-texto { min-width: 0; display: flex; flex-direction: column; }
        .estado-texto strong { font-size: 1rem; line-height: 1.2; }
        .estado-texto small { color: var(--cta-muted); font-size: .8rem; }
        /* Listo: todo el ancho, verde, con la campana moviéndose. Imposible de ignorar. */
        .estado.estado-ready {
            background: linear-gradient(135deg, var(--cta-ok), #43A047);
            border-color: transparent; color: #fff; padding: 18px 16px;
            box-shadow: 0 0 0 4px color-mix(in srgb, var(--cta-ok) 22%, transparent);
            animation: latido 1.6s ease-in-out infinite;
        }
        .estado.estado-ready .estado-icono { background: rgba(255,255,255,.22); color: #fff; }
        .estado.estado-ready .estado-texto strong { font-size: 1.3rem; }
        .estado.estado-ready .estado-texto small { color: rgba(255,255,255,.92); }
        .estado.estado-ready .estado-icono i { animation: campana 1.1s ease-in-out infinite; }
        .estado.estado-completed { background: color-mix(in srgb, var(--cta-ok) 14%, var(--cta-card)); border-color: color-mix(in srgb, var(--cta-ok) 32%, transparent); }
        .estado.estado-completed .estado-icono { background: var(--cta-ok); }
        .estado.estado-cancelled { background: color-mix(in srgb, var(--cta-alto) 12%, var(--cta-card)); border-color: color-mix(in srgb, var(--cta-alto) 30%, transparent); }
        .estado.estado-cancelled .estado-icono { background: var(--cta-alto); }
        @keyframes campana { 0%,60%,100% { transform: rotate(0); } 70% { transform: rotate(14deg); } 80% { transform: rotate(-12deg); } 90% { transform: rotate(6deg); } }
        @keyframes latido { 0%,100% { transform: scale(1); } 50% { transform: scale(1.012); } }

        /* ── QR compacto, con un halo suave ── */
        .qr-caja { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .qr-marco { background: #fff; padding: 10px; border-radius: 14px; display: inline-flex; box-shadow: 0 4px 14px rgba(0,0,0,.10); }
        #qr { display: flex; justify-content: center; }
        #qr img, #qr canvas { display: block; border-radius: 7px; }
        .qr-nota { margin: 0; font-size: .78rem; color: var(--cta-muted); text-align: center; }

        /* ── Artículos: miniatura, precios antes/después y promoción ── */
        .articulos { display: flex; flex-direction: column; }
        .art {
            display: flex; align-items: center; gap: 10px; padding: 9px 0;
            border-bottom: 1px solid var(--cta-border);
            animation: entrar .42s cubic-bezier(.2,.7,.3,1) both;
            animation-delay: calc(var(--i, 0) * 55ms);
        }
        .art:last-child { border-bottom: 0; padding-bottom: 2px; }
        @keyframes entrar { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
        @media (prefers-reduced-motion: reduce) { .art, .estado, .estado-icono i { animation: none !important; } }
        .art-img {
            width: 46px; height: 46px; flex: 0 0 auto; border-radius: 11px; overflow: hidden;
            background: color-mix(in srgb, var(--cta-muted) 12%, transparent);
            display: flex; align-items: center; justify-content: center; color: var(--cta-muted); font-size: .95rem;
        }
        .art-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .art-info { flex: 1; min-width: 0; }
        .art-nombre { font-weight: 700; font-size: .92rem; line-height: 1.2; overflow-wrap: anywhere; }
        .art-meta { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; margin-top: 2px; }
        .art-cant { font-size: .76rem; font-weight: 800; color: var(--cta-primary); }
        .art-precios { display: inline-flex; align-items: baseline; gap: 5px; font-size: .8rem; }
        .art-antes { color: var(--cta-muted); text-decoration: line-through; }
        .art-ahora { font-weight: 800; }
        .art-promo {
            display: inline-flex; align-items: center; gap: 4px;
            font-size: .68rem; font-weight: 800; padding: 1px 7px; border-radius: 999px;
            color: var(--cta-ok); background: color-mix(in srgb, var(--cta-ok) 14%, transparent);
        }
        .art-total { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; font-size: .92rem; }

        .totales { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--cta-border); }
        .tfila { display: flex; justify-content: space-between; gap: 10px; font-size: .87rem; color: var(--cta-muted); padding: 1px 0; }
        .tfila.desc { color: var(--cta-ok); }
        .tfila.total { margin-top: 6px; color: var(--cta-text); font-weight: 800; align-items: baseline; font-size: .95rem; }
        .tfila.total strong { font-size: 1.25rem; font-variant-numeric: tabular-nums; }

        /* ── Pago y tiempo: filas compactas ── */
        .fila { display: flex; align-items: center; gap: 11px; }
        .fila-icono { width: 38px; height: 38px; border-radius: 11px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: .95rem; }
        .fila-txt { min-width: 0; }
        .fila-txt strong { display: block; font-size: .92rem; }
        .fila-txt span { color: var(--cta-muted); font-size: .8rem; }
        .pago-unpaid .fila-icono { background: color-mix(in srgb, var(--cta-muted) 15%, transparent); color: var(--cta-muted); }
        .pago-partial .fila-icono { background: color-mix(in srgb, var(--cta-warn) 18%, transparent); color: var(--cta-warn); }
        .pago-paid .fila-icono { background: color-mix(in srgb, var(--cta-ok) 18%, transparent); color: var(--cta-ok); }
        .tiempo .fila-icono { background: color-mix(in srgb, var(--cta-primary) 15%, transparent); color: var(--cta-primary); }
        .tiempo-valor { font-size: 1.35rem; font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }

        /* ── Aviso de "listo": popup que no se puede ignorar ── */
        .aviso-listo { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.65); display: flex; align-items: center; justify-content: center; padding: 18px; animation: aparecer .25s ease; }
        @keyframes aparecer { from { opacity: 0; } to { opacity: 1; } }
        .aviso-listo-caja {
            background: var(--cta-card); border-radius: 22px; padding: 22px 18px; width: 100%; max-width: 360px;
            text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px;
            box-shadow: 0 18px 50px rgba(0,0,0,.4); animation: subir .32s cubic-bezier(.2,.8,.3,1);
        }
        @keyframes subir { from { transform: translateY(20px) scale(.96); } to { transform: none; } }
        .aviso-listo-icono {
            width: 66px; height: 66px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 1.8rem; color: #fff; background: linear-gradient(135deg, var(--cta-ok), #43A047);
            animation: campana 1.1s ease-in-out infinite;
        }
        .aviso-listo-caja h2 { margin: 0; font-size: 1.32rem; font-family: var(--font-heading, inherit); }
        .aviso-listo-caja p { margin: 0; color: var(--cta-muted); font-size: .88rem; }
        .aviso-listo-qr { background: #fff; padding: 10px; border-radius: 14px; display: inline-flex; }

        button {
            border: 0; border-radius: 13px; cursor: pointer; font-family: inherit;
            padding: 13px 16px; font-size: .92rem; font-weight: 800;
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            background: var(--cta-primary); color: #fff; width: 100%;
        }
        button.activo { background: var(--cta-ok); }
        button.fantasma { background: var(--cta-card); color: var(--cta-text); border: 1px solid var(--cta-border); }
        .problema { background: color-mix(in srgb, var(--cta-alto) 12%, var(--cta-card)); border: 1px solid color-mix(in srgb, var(--cta-alto) 28%, transparent); color: var(--cta-alto); border-radius: 14px; padding: 12px 14px; font-size: .86rem; display: flex; flex-direction: column; gap: 9px; }
        .problema .botones { display: flex; gap: 8px; }
        @media (max-width: 360px) { .wrap { gap: 8px; } .art-img { width: 40px; height: 40px; } }
    </style>
    <script src="lib/qrcodejs/qrcode.min.js"></script>
</head>
<body>
    <div class="wrap">
        <div class="barra">
            <span class="barra-marca"><i class="fas fa-utensils"></i> <span id="marca">Mi pedido</span></span>
            <span class="barra-folio" id="folio">—</span>
        </div>

        <!-- 1. Cómo va, en una franja compacta (se agranda solo cuando está listo) -->
        <div class="estado" id="estado">
            <span class="estado-icono"><i class="fas fa-fire-burner" id="estadoIcono"></i></span>
            <span class="estado-texto">
                <strong id="estadoTexto">Cargando tu pedido…</strong>
                <small id="estadoSub">Un momento</small>
            </span>
        </div>

        <!-- 2. El QR, a la mano desde el principio -->
        <div class="tarjeta qr-caja">
            <div class="tarjeta-titulo"><span>Tu código de recogida</span></div>
            <div class="qr-marco"><div id="qr"></div></div>
            <p class="qr-nota">Muéstralo al llegar para recoger tu pedido.</p>
        </div>

        <!-- 3. Qué pidió, con precios de antes y de ahora -->
        <div class="tarjeta">
            <div class="tarjeta-titulo"><span>Tu pedido</span><span class="nombre" id="nombre"></span></div>
            <div class="articulos" id="articulos"></div>
            <div class="totales" id="totales">
                <div class="tfila" id="filaSubtotal"><span>Subtotal</span><span id="subtotal">$0.00</span></div>
                <div class="tfila desc hidden" id="filaDescuento"><span id="descuentoNombre">Descuento</span><span id="descuento">-$0.00</span></div>
                <div class="tfila total"><span>Total</span><strong id="total">$0.00</strong></div>
            </div>
        </div>

        <!-- 4. Cómo va el pago -->
        <div class="tarjeta">
            <div class="fila pago-unpaid" id="pago">
                <div class="fila-icono"><i class="fas fa-clock" id="pagoIcono"></i></div>
                <div class="fila-txt"><strong id="pagoTitulo">Pago</strong><span id="pagoDetalle"></span></div>
            </div>
        </div>

        <!-- 5. Y hasta abajo, cuánto lleva esperando -->
        <div class="tarjeta tiempo">
            <div class="fila">
                <div class="fila-icono"><i class="fas fa-hourglass-half"></i></div>
                <div class="fila-txt">
                    <strong class="tiempo-valor" id="reloj">00:00</strong>
                    <span id="esperaNota">Tiempo de espera</span>
                </div>
            </div>
        </div>

        <div id="problema" class="problema hidden">
            <span id="problemaTexto">No pudimos cargar tu pedido.</span>
            <div class="botones"><button type="button" id="btnReintentar" class="fantasma">Reintentar</button></div>
        </div>

        <button type="button" id="btnNotif"><i class="fas fa-bell"></i> <span id="btnNotifTexto">Avisarme cuando esté listo</span></button>
    </div>

    <!-- Aviso de "listo": aparece solo, con sonido y vibración, encima de todo -->
    <div class="aviso-listo hidden" id="avisoListo" role="alertdialog" aria-live="assertive">
        <div class="aviso-listo-caja">
            <div class="aviso-listo-icono"><i class="fas fa-bell"></i></div>
            <h2>¡Tu pedido está listo!</h2>
            <p id="avisoListoTexto">Muestra este código al llegar al mostrador.</p>
            <div class="aviso-listo-qr"><div id="qrAviso"></div></div>
            <button type="button" id="avisoListoOk">Entendido</button>
        </div>
    </div>

    <script>
    (function () {
        'use strict';
        var params = new URLSearchParams(window.location.search);
        var token = (params.get('t') || '').trim();
        var pedido = null;
        var vapidPublica = '';
        var socket = null;
        var relojTimer = null;
        var relojBaseSeg = 0;
        var relojBaseMs = 0;
        var swReg = null;
        var audioCtx = null;
        var avisoYaMostrado = false;
        var intentos = 0;

        var $ = function (id) { return document.getElementById(id); };
        function dinero(n) { return '$' + (Number(n) || 0).toFixed(2); }
        function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
        function pad2(n) { return (n < 10 ? '0' : '') + n; }
        function mmss(s) { s = Math.max(0, Math.floor(s)); return pad2(Math.floor(s / 60)) + ':' + pad2(s % 60); }
        function porUnidad(n) { return '$' + (Number(n) || 0).toFixed(2); }

        /** Igual que getRelativeImagePath() de la app: deja la ruta lista desde /public/. */
        function rutaImagen(p) {
            if (!p) return null;
            if (p.indexOf('data:image') === 0 || p.indexOf('http') === 0) return p;
            var c = String(p).replace(/\\/g, '/');
            if (c.indexOf('public/') !== -1) c = c.split('public/')[1];
            if (c.charAt(0) === '/') c = c.substring(1);
            return c;
        }

        var ETIQUETA = {
            pending:   ['En preparación', 'fa-fire-burner', 'estado-pending', 'Estamos preparando tu pedido'],
            ready:     ['¡Listo para recoger!', 'fa-bell', 'estado-ready', 'Pasa al mostrador por tu pedido'],
            completed: ['Entregado', 'fa-circle-check', 'estado-completed', 'Gracias por tu compra'],
            cancelled: ['Cancelado', 'fa-ban', 'estado-cancelled', 'El pedido fue cancelado']
        };

        // ---- Tema: el del NEGOCIO para los acentos, el del DISPOSITIVO para las superficies --
        var BASE_OSCURA = { bg: '#0f1216', card: '#171b21', texto: '#e8eaed', borde: '#2a3037', tenue: '#9aa3ad' };
        var BASE_CLARA  = { bg: '#f4f7f6', card: '#ffffff', texto: '#1a1a2e', borde: '#e3e8ec', tenue: '#66707a' };

        function esOscuro() {
            try { return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches); }
            catch (e) { return false; }
        }

        function aplicarTema(tema) {
            var t = tema || {};
            var oscuro = esOscuro();
            var mio = (oscuro ? t.dark : t.light) || null;      // la paleta que corresponde al dispositivo
            var otro = (oscuro ? t.light : t.dark) || null;     // de donde sacar los acentos si falta
            var r = document.documentElement.style;

            // Acentos: los del negocio, siempre.
            var acentos = mio || otro || {};
            if (acentos.primary_color)   r.setProperty('--cta-primary', acentos.primary_color);
            if (acentos.secondary_color) r.setProperty('--cta-primary-2', acentos.secondary_color);
            if (acentos.success_color)   r.setProperty('--cta-ok', acentos.success_color);
            if (acentos.warning_color)   r.setProperty('--cta-warn', acentos.warning_color);
            if (acentos.danger_color)    r.setProperty('--cta-alto', acentos.danger_color);

            // Superficies: las del modo del DISPOSITIVO. Si la tienda no definió ese modo, se
            // usa una base neutra para no encandilar a quien trae el teléfono en oscuro.
            var base = oscuro ? BASE_OSCURA : BASE_CLARA;
            var s = mio || {};
            r.setProperty('--cta-bg',     s.bg_body     || base.bg);
            r.setProperty('--cta-card',   s.bg_card     || base.card);
            r.setProperty('--cta-text',   s.text_color  || base.texto);
            r.setProperty('--cta-border', s.border_color|| base.borde);
            r.setProperty('--cta-muted',  base.tenue);
            document.documentElement.style.colorScheme = oscuro ? 'dark' : 'light';

            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', oscuro ? (s.bg_card || base.card) : (acentos.primary_color || '#39C5BB'));
        }

        // ---- Tiempo de espera (los segundos los manda el SERVIDOR) ----------------
        function pintarReloj() { $('reloj').textContent = mmss(relojBaseSeg + (Date.now() - relojBaseMs) / 1000); }
        function arrancarReloj() {
            if (relojTimer) clearInterval(relojTimer);
            relojBaseSeg = Number(pedido.esperando_seg) || 0;
            relojBaseMs = Date.now();
            pintarReloj();
            relojTimer = setInterval(pintarReloj, 1000);
        }
        function pararReloj() { if (relojTimer) { clearInterval(relojTimer); relojTimer = null; } }
        function pintarEspera() {
            if (pedido.status === 'pending') {
                arrancarReloj();
                $('esperaNota').textContent = 'Llevas esperando';
            } else {
                pararReloj();
                var t = Number(pedido.espera_total_seg) || Number(pedido.esperando_seg) || 0;
                $('reloj').textContent = mmss(t);
                $('esperaNota').textContent = pedido.status === 'ready' ? 'Quedó listo en ese tiempo'
                    : (pedido.status === 'completed' ? 'Tiempo que tardó' : 'El pedido se canceló');
            }
        }

        // ---- Sonido del aviso (sin archivos: se genera en el navegador) -----------
        function sonarAviso() {
            try {
                var AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                if (!audioCtx) audioCtx = new AC();
                if (audioCtx.state === 'suspended') {
                    var pr = audioCtx.resume();
                    if (pr && pr.catch) pr.catch(function () {});
                }
                var t0 = audioCtx.currentTime;
                [880, 1174.66, 880].forEach(function (f, i) {
                    var o = audioCtx.createOscillator(), g = audioCtx.createGain();
                    o.type = 'sine'; o.frequency.value = f;
                    var t = t0 + i * 0.19;
                    g.gain.setValueAtTime(0.0001, t);
                    g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
                    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
                    o.connect(g); g.connect(audioCtx.destination);
                    o.start(t); o.stop(t + 0.38);
                });
            } catch (e) { /* sin audio, el aviso visual y la vibración siguen */ }
        }
        function vibrar() { try { if (navigator.vibrate) navigator.vibrate([140, 70, 140, 70, 220]); } catch (e) {} }

        function mostrarAvisoListo() {
            if (avisoYaMostrado) return;
            avisoYaMostrado = true;
            $('avisoListoTexto').textContent = (pedido.customer_name ? pedido.customer_name + ', ' : '') +
                'muestra este código al llegar al mostrador.';
            $('avisoListo').classList.remove('hidden');
            sonarAviso();
            vibrar();
            try { dibujarQr(); } catch (e) {}   // el QR del popup, por si el del inicio no salió
            notificar('¡Tu pedido está listo!', 'Pasa al mostrador con tu código.');
        }
        function ocultarAvisoListo() { $('avisoListo').classList.add('hidden'); }

        // ---- Pintado --------------------------------------------------------------
        function pintar() {
            if (!pedido) return;
            $('folio').textContent = 'Pedido #' + pedido.number;
            $('nombre').textContent = pedido.customer_name || '';
            if (pedido.tema) aplicarTema(pedido.tema);

            var e = ETIQUETA[pedido.status] || ETIQUETA.pending;
            $('estado').className = 'estado ' + e[2];
            $('estadoIcono').className = 'fas ' + e[1];
            $('estadoTexto').textContent = e[0];
            $('estadoSub').textContent = e[3];
            document.body.classList.toggle('pedido-listo', pedido.status === 'ready');

            // Cada artículo con su miniatura, su precio de antes y el de ahora.
            $('articulos').innerHTML = (pedido.items || []).map(function (it, i) {
                var img = rutaImagen(it.image_path);
                var antes = Number(it.original_unit_price) || 0;
                var ahora = Number(it.unit_price) || 0;
                var hayPromo = antes > ahora + 0.001;
                return '<div class="art" style="--i:' + i + '">' +
                    '<div class="art-img">' +
                        (img ? '<img src="' + esc(img) + '" loading="lazy" decoding="async" alt="" onerror="this.parentNode.innerHTML=\'<i class=&quot;fas fa-utensils&quot;></i>\';">'
                             : '<i class="fas fa-utensils"></i>') +
                    '</div>' +
                    '<div class="art-info">' +
                        '<div class="art-nombre">' + esc(it.product_name) + '</div>' +
                        '<div class="art-meta">' +
                            '<span class="art-cant">' + (Number(it.quantity) || 0) + '×</span>' +
                            '<span class="art-precios">' +
                                (hayPromo ? '<span class="art-antes">' + porUnidad(antes) + '</span>' : '') +
                                '<span class="art-ahora">' + porUnidad(ahora) + '</span>' +
                            '</span>' +
                            (it.promotion_name ? '<span class="art-promo"><i class="fas fa-tags"></i> ' + esc(it.promotion_name) + '</span>' : '') +
                        '</div>' +
                    '</div>' +
                    '<div class="art-total">' + dinero(it.line_total) + '</div>' +
                '</div>';
            }).join('');

            $('subtotal').textContent = dinero(pedido.subtotal);
            $('total').textContent = dinero(pedido.total);
            var hayDesc = Number(pedido.discount) > 0;
            $('filaDescuento').classList.toggle('hidden', !hayDesc);
            if (hayDesc) $('descuento').textContent = '-' + dinero(pedido.discount);

            pintarPago();
            pintarEspera();
            $('problema').classList.add('hidden');
            if (pedido.status === 'ready') mostrarAvisoListo();
        }

        function pintarPago() {
            var est = pedido.payment_status || 'unpaid';
            $('pago').className = 'fila pago-' + est;
            var total = Number(pedido.total) || 0;
            var pagado = Number(pedido.paid_amount) || 0;
            if (est === 'paid') {
                $('pagoIcono').className = 'fas fa-circle-check';
                $('pagoTitulo').textContent = 'Pagado · ' + dinero(total);
                $('pagoDetalle').textContent = 'Ya está cubierto, solo pasa por tu pedido.';
            } else if (est === 'partial') {
                $('pagoIcono').className = 'fas fa-coins';
                $('pagoTitulo').textContent = 'Pagaste ' + dinero(pagado) + ' de ' + dinero(total);
                $('pagoDetalle').textContent = 'Falta pagar ' + dinero(Math.max(0, total - pagado)) + ' al recoger.';
            } else {
                $('pagoIcono').className = 'fas fa-clock';
                $('pagoTitulo').textContent = 'Por pagar ' + dinero(total);
                $('pagoDetalle').textContent = 'Lleva el importe cuando pases por tu pedido.';
            }
        }

        function dibujarQr() {
            if (typeof QRCode !== 'function') return;
            var url = window.location.href;
            ['qr', 'qrAviso'].forEach(function (id) {
                var c = $(id);
                if (!c) return;
                c.innerHTML = '';
                new QRCode(c, { text: url, width: 140, height: 140, colorDark: '#000000', colorLight: '#ffffff', correctLevel: (QRCode.CorrectLevel && QRCode.CorrectLevel.M) || 0 });
            });
        }

        function notificar(texto, cuerpo) {
            try {
                if (!('Notification' in window) || Notification.permission !== 'granted') return;
                var opciones = {
                    body: cuerpo,
                    icon: (pedido && pedido.icono_aviso) || '/public/assets/app-icons/tomodachi-icon-192.png',
                    tag: 'tomodachi-pedido'
                };
                if (swReg && swReg.showNotification) swReg.showNotification(texto, opciones);
                else if (typeof Notification === 'function') new Notification(texto, opciones);
            } catch (e) { /* sin permisos se sigue sin notificar */ }
        }

        // ---- Presencia -------------------------------------------------------------
        function enviarPresencia(notifyGranted) {
            if (!token) return;
            var cuerpo = { token: token };
            if (notifyGranted === true || notifyGranted === false) cuerpo.notify_granted = notifyGranted;
            try {
                fetch('../api/counter/presence.php', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cuerpo), keepalive: true
                }).catch(function () {});
            } catch (e) { /* sin red no se puede avisar de la presencia */ }
        }

        // ---- Carga (a prueba de fallos) -------------------------------------------
        function mostrarProblema(texto) {
            $('problemaTexto').textContent = texto || 'No pudimos cargar tu pedido.';
            $('problema').classList.remove('hidden');
        }

        function cargar(silencioso) {
            if (!token) return Promise.resolve(false);
            return fetch('../api/counter/track.php?t=' + encodeURIComponent(token), { cache: 'no-store' })
                .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
                .then(function (res) {
                    if (!res.ok || !res.d || !res.d.success) throw new Error((res.d && res.d.message) || 'No se pudo leer el pedido');
                    var anterior = pedido ? pedido.status : null;
                    pedido = res.d.data.order;
                    vapidPublica = res.d.data.vapid_public_key || '';
                    pintar();
                    if (anterior && anterior !== 'ready' && pedido.status === 'ready') mostrarAvisoListo();
                    return true;
                })
                .catch(function (err) {
                    if (!silencioso) mostrarProblema((err && err.message) || 'No pudimos cargar tu pedido.');
                    return false;
                });
        }

        function conectarWS() {
            if (!token || !('WebSocket' in window)) return;
            var scheme = (location.protocol === 'https:') ? 'wss:' : 'ws:';
            try { socket = new WebSocket(scheme + '//' + window.location.host + '/ws/?session=' + encodeURIComponent(token)); }
            catch (e) { socket = null; return; }
            socket.onmessage = function (ev) {
                var m = null; try { m = JSON.parse(ev.data); } catch (e) { return; }
                if (m && (m.type === 'order_update' || m.event)) cargar(true);
            };
            socket.onerror = function () {};
        }

        // ---- Avisos push -----------------------------------------------------------
        function b64urlABytes(base64) {
            var padding = '='.repeat((4 - base64.length % 4) % 4);
            var b64 = (base64 + padding).replace(/-/g, '+').replace(/_/g, '/');
            var raw = atob(b64);
            var bytes = new Uint8Array(raw.length);
            for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
            return bytes;
        }

        function activarAvisos() {
            if (!('Notification' in window) || !('serviceWorker' in navigator)) {
                $('btnNotifTexto').textContent = 'Tu navegador no soporta avisos';
                return;
            }
            sonarAviso();   // de paso desbloquea el audio para el aviso real
            Notification.requestPermission().then(function (permiso) {
                if (permiso !== 'granted') {
                    $('btnNotifTexto').textContent = 'Avisos bloqueados';
                    enviarPresencia(false);
                    return;
                }
                enviarPresencia(true);
                marcarBotonAvisos();
                notificar('Avisos activados', 'Te avisaremos cuando tu pedido esté listo.');
                if (!vapidPublica || !('PushManager' in window)) return;
                navigator.serviceWorker.register('counter/sw.js', { scope: 'counter/' }).then(function (reg) {
                    swReg = reg;
                    if (reg.active) return null;
                    var w = reg.installing || reg.waiting;
                    if (!w) return null;
                    return new Promise(function (res) {
                        w.addEventListener('statechange', function () { if (w.state === 'activated') res(); });
                        setTimeout(res, 4000);
                    });
                }).then(function () {
                    return swReg.pushManager.getSubscription().then(function (sub) {
                        if (sub) return sub;
                        return swReg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64urlABytes(vapidPublica) });
                    });
                }).then(function (sub) {
                    if (!sub) return null;
                    var j = sub.toJSON();
                    return fetch('../api/counter/presence.php', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ subscribe: true, token: token, endpoint: j.endpoint, p256dh: j.keys && j.keys.p256dh, auth: j.keys && j.keys.auth })
                    });
                }).catch(function () { /* si el push falla, los avisos en vivo siguen */ });
            }).catch(function () { $('btnNotifTexto').textContent = 'Avisos no disponibles'; });
        }

        function marcarBotonAvisos() {
            $('btnNotif').classList.add('activo');
            $('btnNotifTexto').textContent = 'Avisos activados';
        }

        // ---- Arranque --------------------------------------------------------------
        $('btnNotif').addEventListener('click', activarAvisos);
        $('avisoListoOk').addEventListener('click', ocultarAvisoListo);
        $('btnReintentar').addEventListener('click', function () { cargar(false); });

        // Nada de lo que falle después puede dejar la página en blanco sin decir por qué.
        window.addEventListener('error', function () { if (!pedido) mostrarProblema('Algo no cargó bien. Toca Reintentar.'); });
        window.addEventListener('unhandledrejection', function () { if (!pedido) mostrarProblema('Algo no cargó bien. Toca Reintentar.'); });

        if (esOscuro() && window.matchMedia) {
            try {
                window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
                    if (pedido) aplicarTema(pedido.tema);
                });
            } catch (e) { /* navegadores viejos: el tema queda como al cargar */ }
        }
        setInterval(function () { if (!document.hidden) enviarPresencia(); }, 20000);
        document.addEventListener('visibilitychange', function () { if (!document.hidden) { enviarPresencia(); cargar(true); } });

        if (!token) {
            mostrarProblema('Falta el identificador del pedido en el enlace.');
        } else {
            // PRIMERO los datos, y el QR después: si el dibujado del código fallara, el pedido
            // ya está en pantalla (en Firefox móvil el QR primero dejaba la página vacía).
            cargar(false).then(function () {
                try { dibujarQr(); } catch (e) { /* sin QR queda el resto */ }
                enviarPresencia(('Notification' in window) && Notification.permission === 'granted');
                if (('Notification' in window) && Notification.permission === 'granted') marcarBotonAvisos();
            });
            conectarWS();
            // Si no cargó, se reintenta sin depender del WebSocket (redes móviles flojas).
            setInterval(function () {
                if (pedido) return;
                if (intentos >= 40) return;
                intentos++;
                cargar(intentos > 2);
            }, 5000);
        }
    })();
    </script>
</body>
</html>
